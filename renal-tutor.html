    if(bp>=160)bpTx=`<li><strong>Hypertension (SBP ≥160 persistently, or any level with target-organ damage):</strong> ${sp==='cat'?'amlodipine first-line in cats, or telmisartan':'ACEi or ARB first-line in dogs, adding amlodipine if needed'}. Target &lt;160 mmHg and avoid dropping below ~110 mmHg. Check the eyes for retinal detachment or hemorrhage.</li>`;}
  const tx={
    1:['Stop nephrotoxic drugs. Identify and treat the underlying disease (pyelonephritis, uroliths, leptospirosis, etc.).','Correct any pre- and post-renal problems. Provide free access to fresh water.','Monitor creatinine/SDMA, UPC, and BP trends.'],
    2:['Everything listed for stage 1, plus:',`Start a clinical renal diet (strongly indicated for cats; indicated in dogs when phosphate is above target or the dog is proteinuric). Phosphate target: <strong>${IRIS_P[2]} mg/dL</strong>.`,sp==='cat'?'Cats: treat hypokalemia (potassium gluconate or citrate).':'Correct metabolic acidosis if bicarbonate or tCO₂ is &lt;18 mmol/L.'],
    3:['Everything listed for stage 2, plus:',`Phosphate target: <strong>${IRIS_P[3]} mg/dL</strong>. Add an enteric phosphate binder if diet alone does not reach it.`,'Manage nausea/vomiting (maropitant, ondansetron) and appetite (mirtazapine; capromorelin in cats).','Treat anemia if it is affecting quality of life (ESA such as darbepoetin; check iron). Give SC fluids for chronic dehydration.'],
    4:['Everything listed for stage 3, plus:',`Phosphate target: <strong>${IRIS_P[4]} mg/dL</strong>.`,'Consider a feeding tube for nutrition, fluids, and medications.','Have a quality-of-life and prognosis conversation. Intermittent hemodialysis or transplantation are options at some referral centers.'],
  }[stage];
  out.innerHTML=`<div class="result-head"><div class="rl">IRIS CKD stage · ${sp==='dog'?'Dog':'Cat'}</div><div class="rv">Stage ${stage}${prot?` · ${prot.split(' (')[1].replace(')','')}`:''}${bp!==null?` · ${bp<140?'NT':bp<160?'PH':bp<180?'HT':'SHT'}`:''}</div>
  <div class="rs">${cr!==null?`Creatinine ${cr.toFixed(1)} mg/dL (${Math.round(cr*88.4)} µmol/L) → stage ${sCr}`:''}${sdma!==null?` · SDMA ${sdma} µg/dL → stage ${sS}`:''}</div></div>
  <div class="result-body">${notes.join('')}
  ${prot||bpTxt?`<div class="tier">${prot?`<span class="badge b-accent">UPC ${upc}: ${prot}</span>`:''}${bpTxt?`<span class="badge b-accent">SBP ${bp}: ${bpTxt}</span>`:''}</div>`:''}
  <div class="card-title" style="margin-top:10px">Stage-based management (condensed from IRIS)</div>
  <ul>${tx.map(t=>`<li>${t}</li>`).join('')}${protTx}${bpTx}</ul></div>`;
}

// TOOL 6 — IRIS AKI GRADER
// ═══════════════════════════════════════════════════════
function renderAKITool(){
  return `<div class="sh"><h2>IRIS AKI grader</h2><p>AKI is graded on creatinine at diagnosis and during hospitalization, then subgraded on urine output and whether renal replacement therapy is needed.</p></div>
<div class="card">
  <div class="calc-grid">
    <div class="field"><label>Creatinine (mg/dL)</label><input type="number" id="ak-cr" step="0.1" placeholder="e.g. 4.2" oninput="akiUpdate()"></div>

  </div>
  <label class="chk"><input type="checkbox" id="ak-rise" onchange="akiUpdate()">Creatinine has risen ≥0.3 mg/dL (≥26.4 µmol/L) within 48 h, or there is other documented evidence of AKI</label>
  <label class="chk"><input type="checkbox" id="ak-rrt" onchange="akiUpdate()">Needs renal replacement therapy (dialysis)</label>
</div>
<div class="result-card" id="ak-result"></div>
<div class="card" style="padding:0"><table>
<tr><th>Grade</th><th>Creatinine mg/dL (µmol/L)</th><th>Description</th></tr>
<tr><td><strong>I</strong></td><td>&lt;1.6 (&lt;140)</td><td>Non-azotemic AKI: documented injury, a progressive rise ≥0.3 mg/dL in 48 h, or measured oliguria</td></tr>
<tr><td><strong>II</strong></td><td>1.7–2.5 (141–220)</td><td>Mild AKI: documented AKI with static or progressive azotemia</td></tr>
<tr><td><strong>III</strong></td><td>2.6–5.0 (221–439)</td><td rowspan="3">Moderate to severe AKI, with increasing azotemia and functional renal failure</td></tr>
<tr><td><strong>IV</strong></td><td>5.1–10.0 (440–880)</td></tr>
<tr><td><strong>V</strong></td><td>&gt;10.0 (&gt;880)</td></tr>
</table></div>`;
}
function akiUpdate(){
  const cr=num('ak-cr'),uo=num('ak-uo'),rise=$('ak-rise').checked,rrt=$('ak-rrt').checked,out=$('ak-result');
  if(cr===null){out.innerHTML=`<div class="result-head"><div class="rl">IRIS AKI grade</div><div class="rv">Enter creatinine</div><div class="rs">Dogs and cats</div></div>`;return;}
  let g=cr<1.7?'I':cr<=2.5?'II':cr<=5.0?'III':cr<=10?'IV':'V';
  const sub=[];
  if(uo!==null)sub.push(uo<1?(uo<0.08?'Anuric (O)':'Oliguric (O)'):'Non-oliguric (NO)');

  <div class="result-body">${notes.join('')}
  <div class="card-title">Next steps</div><ul>
  <li><strong>Find the cause:</strong> nephrotoxins (ethylene glycol, lilies in cats, grapes/raisins in dogs, NSAIDs, aminoglycosides, amphotericin), infection (leptospirosis, pyelonephritis), ischemia (shock, anesthesia, thrombosis), and obstruction.</li>

  </ul></div>`;

function ecgPath(k){
  const W=640,H=150,base=95,sc=60;
  if(k>=9.3){let d='';for(let x=0;x<=W;x+=2){const y=base-Math.sin(x/22)*sc*0.65;d+=(x?'L':'M')+x+','+y.toFixed(1)+' ';}return d;}
  const pA=k<6.5?0.15:k<7.5?0.15*(1-(k-6.5)):0;
  const tA=k<5.5?0.3:Math.min(1.15,0.3+(k-5.5)*0.42);
  const tSd=k<5.5?13:Math.max(6,13-(k-5.5)*3);
  const qw=k<7.5?1:1+(k-7.5)*0.9;
  const pr=k<6.5?0:Math.min(14,(k-6.5)*14);
  const beat=200+Math.max(0,k-7)*45;
  const g=(x,m,s,a)=>a*Math.exp(-((x-m)**2)/(2*s*s));
  let d='';
  for(let x=0;x<=W;x+=1.5){
    const bx=x%beat;
    let y=g(bx,30,7,pA)+g(bx,70+pr,2.2*qw,-0.08)+g(bx,77+pr,2.6*qw,1.0)+g(bx,85+pr+3*(qw-1),3*qw,-0.22)+g(bx,135+pr+6*(qw-1),tSd,tA);
    d+=(x?'L':'M')+x.toFixed(1)+','+(base-y*sc).toFixed(1)+' ';
  }
  return d;
}
function kUpdate(){
  const k=parseFloat($('k-slider').value);$('k-read').textContent=k.toFixed(1);
  $('k-ecg').innerHTML=`<svg viewBox="0 0 640 150" width="100%" preserveAspectRatio="none" style="display:block;height:150px"><path d="${ecgPath(k)}" fill="none" stroke="#1a1714" stroke-width="1.6"/></svg>`;
  const band=k<5.5?['Normal to mild','No ECG changes expected.']:k<6.5?['Mild–moderate','Tall, narrow, <strong>peaked T waves</strong> and a shortened QT.']:k<7.5?['Moderate','Peaked T waves, <strong>prolonged PR interval</strong>, flattening P waves.']:k<8.5?['Severe','<strong>P waves lost (atrial standstill)</strong>, widened QRS, bradycardia.']:k<9.3?['Life-threatening','Wide, bizarre QRS complexes merging into the T wave, with a sinoventricular rhythm.']:['Pre-arrest','<strong>Sine-wave pattern</strong>, then ventricular fibrillation or asystole.'];
  const emerg=k>=6.5;
  $('k-result').innerHTML=`<div class="result-head"><div class="rl">Expected ECG · ${band[0]}</div><div class="rv">K⁺ ${k.toFixed(1)} mEq/L</div><div class="rs">${band[1].replace(/<[^>]+>/g,'')}</div></div>
  <div class="result-body">

  ${emerg?'<li><strong>10% calcium gluconate</strong> 0.5–1.5 mL/kg IV slowly over 10–20 min with ECG monitoring. This protects the heart (restores the threshold-to-resting potential gap) but <em>does not lower K⁺</em>. It works within minutes and lasts about 20–30 min.</li>':''}
  <li><strong>Regular insulin</strong> 0.25–0.5 U/kg IV <strong>plus dextrose</strong> 1–2 g per unit of insulin, followed by dextrose-supplemented fluids. Monitor blood glucose every 1–2 h to avoid hypoglycemia.</li>
  ${k>=7?'<li>± <strong>Sodium bicarbonate</strong> 1–2 mEq/kg slow IV if there is severe metabolic acidosis. Do not give it in the same line as calcium.</li>':''}
  <li><strong>IV isotonic crystalloid.</strong> 0.9% NaCl or a balanced solution (LRS, Plasma-Lyte) are both acceptable. The small amount of K⁺ in balanced fluids does not slow the correction of hyperkalemia, and they correct acidosis better.</li>
  <li><strong>Remove the source:</strong> relieve the urethral obstruction (decompressive cystocentesis while you prepare, then a urinary catheter), drain a uroabdomen, or treat hypoadrenocorticism.</li></ul>`}
  ${k>=5.5?'<div class="sep"></div><p style="font-size:12.5px;color:var(--text-muted)"><strong>After relief:</strong> watch for post-obstructive diuresis (UOP &gt;2 mL/kg/h). Match ins and outs every 4–6 h and expect K⁺ to swing low within 12–24 h. Supplement K⁺ as needed.</p>':''}
  </div>`;
}

nephron:`<div class="sh"><h2>Nephron & diuretics</h2><p>Each tubule segment, the transporter that works there, and the drug that blocks it.</p></div>
<div class="card"><table>
<tr><th>Segment</th><th>% Na⁺</th><th>Key transporter</th><th>Drug</th></tr>
<tr><td>PCT</td><td>65–70%</td><td>NHE3, SGLT2, carbonic anhydrase</td><td>Acetazolamide, mannitol, SGLT2 inhibitors</td></tr>
<tr><td>Thick ascending limb</td><td>~25%</td><td>NKCC2</td><td>Furosemide, torsemide</td></tr>
<tr><td>DCT</td><td>5–8%</td><td>NCC</td><td>Thiazides</td></tr>
<tr><td>Collecting duct</td><td>2–5%</td><td>ENaC, ROMK, AQP2</td><td>Spironolactone, amiloride</td></tr>
</table></div>
<div class="g2"><div class="card"><div class="card-title">Furosemide pearls</div><p style="font-size:13px">It must be <strong>filtered and secreted</strong> into the tubular lumen to work, so its effect falls as GFR falls. It is used for CHF, oliguric AKI (a trial only, once the patient is volume-replete), and hypercalcemia (after rehydration). Side effects: hypokalemia, hypochloremic alkalosis, hypomagnesemia, dehydration, and prerenal azotemia.</p></div>
<div class="card"><div class="card-title">Concentrating urine</div><p style="font-size:13px">The countercurrent multiplier (loop of Henle) builds the medullary gradient from NaCl and urea, and ADH then lets water leave the collecting duct. <strong>Medullary washout</strong> (Addison's, PU/PD of any cause, low urea in liver failure, aggressive diuresis) impairs concentration even when the nephrons are intact.</p></div></div>`,
azotemia:`<div class="sh"><h2>Azotemia</h2><p>Azotemia means increased BUN and/or creatinine. Uremia is the clinical syndrome that results.</p></div>
<div class="g3">
<div class="card"><div class="card-title"><span class="badge b-info">Pre-renal</span></div><p style="font-size:13px">Reduced renal perfusion: dehydration, shock, CHF, hypoadrenocorticism. <strong>USG concentrated</strong> (unless there is a confounder). Resolves within 24–48 h of fluids.</p></div>
<div class="card"><div class="card-title"><span class="badge b-danger">Renal</span></div><p style="font-size:13px">Loss of ≥75% of functional nephrons, from AKI or CKD. <strong>USG inadequate</strong> (dog &lt;1.030, cat &lt;1.035, horse and ruminant &lt;1.025) while the patient is azotemic.</p></div>
<div class="card"><div class="card-title"><span class="badge b-warn">Post-renal</span></div><p style="font-size:13px">Obstruction (urethral stones, urethral plugs in cats, neoplasia) or rupture (uroabdomen). USG is variable. Hyperkalemia is common.</p></div></div>
<div class="card"><div class="card-title">Extra-renal causes of impaired concentrating ability</div><p style="font-size:13px">Hypoadrenocorticism, hypercalcemia, diuretics or fluids, glucocorticoids and hyperadrenocorticism, diabetes mellitus (osmotic diuresis), pyometra and E. coli endotoxin, hepatic failure/PSS, hyponatremia, central or nephrogenic DI, and psychogenic polydipsia. An Addisonian dog with azotemia and a USG of 1.020 can look renal and still recover completely.</p></div>`,
ua:`<div class="sh"><h2>Urinalysis</h2><p>Always interpret the dipstick together with the USG and sediment.</p></div>
<div class="g2"><div class="card"><div class="card-title">Dipstick traps</div>
<div class="kv"><span class="kv-key">USG</span><span>Use a refractometer. Dipstick USG pads are not valid for animals.</span></div>
<div class="kv"><span class="kv-key">Leukocyte pad</span><span>False positives in cats and false negatives in dogs. Use the sediment.</span></div>
<div class="kv"><span class="kv-key">Protein pad</span><span>False positive in alkaline urine. Confirm with UPC.</span></div>
<div class="kv"><span class="kv-key">Bilirubin</span><span>Trace to 1+ can be normal in dogs. Any amount is abnormal in cats.</span></div>
<div class="kv"><span class="kv-key">Blood pad</span><span>Positive for hematuria, hemoglobinuria, or myoglobinuria. Check the sediment and serum color.</span></div>
</div><div class="card"><div class="card-title">Proteinuria workup</div><p style="font-size:13px">1. Exclude <strong>pre-renal</strong> causes (hemoglobin, myoglobin, light chains). 2. Exclude <strong>post-renal</strong> causes (inflammation or hemorrhage with an active sediment, so culture). 3. A persistent renal UPC (on ≥3 tests, ≥2 weeks apart) means glomerular or tubular disease. A UPC &gt;2.0 strongly suggests glomerular disease.</p></div></div>
<div class="info-box">Collect a <strong>cystocentesis</strong> sample for culture. Run the sediment within 30–60 minutes, because refrigeration creates struvite and CaOx crystals in vitro.</div>`,
ckd:`<div class="sh"><h2>CKD & IRIS staging</h2><p>CKD is structural or functional kidney damage lasting ≥3 months. It is irreversible and usually progressive.</p></div>
<div class="g2"><div class="card"><div class="card-title">Clinical picture</div><p style="font-size:13px">PU/PD, weight loss, hyporexia, vomiting, halitosis and uremic oral ulcers, non-regenerative anemia, small irregular kidneys (cats), hypokalemia with cervical ventroflexion (cats), hypertension with retinal detachment, and renal secondary hyperparathyroidism.</p></div>
<div class="card"><div class="card-title">Causes</div><p style="font-size:13px"><strong>Cats:</strong> chronic tubulointerstitial nephritis (usually), polycystic kidney disease (Persians, PKD1), lymphoma, FIP, and nephroliths. <strong>Dogs:</strong> glomerular disease, familial nephropathies (e.g., hereditary nephritis in English Cocker Spaniels and Samoyeds, Shar-Pei amyloidosis), chronic pyelonephritis, and the aftermath of AKI.</p></div></div>
<div class="card"><div class="card-title">Substaging cutoffs</div><table>
<tr><th>UPC</th><th>Dog</th><th>Cat</th></tr>
<tr><td>Non-proteinuric</td><td>&lt;0.2</td><td>&lt;0.2</td></tr><tr><td>Borderline</td><td>0.2–0.5</td><td>0.2–0.4</td></tr><tr><td>Proteinuric</td><td>&gt;0.5</td><td>&gt;0.4</td></tr></table>
<div class="sep"></div><table><tr><th>Systolic BP</th><th>Category</th><th>Target-organ damage risk</th></tr>
<tr><td>&lt;140</td><td>Normotensive</td><td>Minimal</td></tr><tr><td>140–159</td><td>Prehypertensive</td><td>Low</td></tr><tr><td>160–179</td><td>Hypertensive</td><td>Moderate</td></tr><tr><td>≥180</td><td>Severely hypertensive</td><td>High</td></tr></table></div>
<div class="info-box">Renal diets (phosphate and protein restriction, plus omega-3s) have the strongest evidence of any CKD intervention, including prolonged survival in cats from IRIS stage 2 onward.</div>`,
aki:`<div class="sh"><h2>AKI & nephrotoxins</h2><p>An abrupt loss of function that is potentially reversible. The degree of azotemia does not predict whether the patient will recover.</p></div>
<div class="card"><table>
<tr><th>Toxin</th><th>Species</th><th>Key points</th></tr>
<tr><td><strong>Ethylene glycol</strong></td><td>Dogs, cats</td><td>Early CNS signs, then AKI at 24–72 h. High anion gap and osmolal gap, CaOx monohydrate crystals, hyperechoic renal cortices. <strong>Fomepizole</strong> (cats need a much higher dose than dogs) or ethanol. Start within about 3 h in cats and about 8 h in dogs. Hemodialysis removes EG.</td></tr>
<tr><td><strong>Lilies</strong> (<em>Lilium</em>, <em>Hemerocallis</em>)</td><td>Cats only</td><td>Every part, including pollen and vase water. Vomiting, then oligo-anuric AKI within 24–72 h. Decontaminate and start aggressive IV fluids early, ideally within 18 h.</td></tr>
<tr><td><strong>Grapes / raisins</strong></td><td>Dogs</td><td>Tartaric acid is the likely toxic principle (which explains the dose inconsistency). Induce emesis and give IV fluids for 48–72 h, with serial creatinine checks.</td></tr>
<tr><td><strong>NSAIDs</strong></td><td>All</td><td>Afferent constriction and renal papillary necrosis. Higher risk with hypovolemia, anesthesia, or CKD.</td></tr>
<tr><td><strong>Aminoglycosides</strong></td><td>All</td><td>Accumulate in PCT cells. Watch for <strong>granular casts</strong>, glucosuria, and rising GGT:creatinine before azotemia appears. Dose once daily and monitor trough levels.</td></tr>
<tr><td><strong>Vitamin D (cholecalciferol rodenticide, calcipotriene)</strong></td><td>Dogs, cats</td><td>Hypercalcemia and hyperphosphatemia lead to soft-tissue mineralization and AKI.</td></tr>
</table></div>
<div class="g2"><div class="card"><div class="card-title">Leptospirosis (dogs)</div><p style="font-size:13px">AKI ± hepatopathy, pulmonary hemorrhage syndrome, and thrombocytopenia. Diagnose with blood and urine PCR plus paired MAT (a fourfold rise). Treat with <strong>doxycycline</strong> (5 mg/kg PO q12h for 14 days, per the ACVIM 2023 consensus), using IV ampicillin or penicillin first if the dog is vomiting. It is <strong>zoonotic</strong>, so use PPE and handle urine with care.</p></div>
<div class="card"><div class="card-title">Phases of AKI</div><p style="font-size:13px">Initiation, then extension, then maintenance (often oliguric), then recovery (often polyuric). The maintenance phase can last weeks. Dialysis bridges patients through it while the tubules regenerate.</p></div></div>`,
uroliths:`<div class="sh"><h2>Uroliths</h2><p>Dissolve what you can and remove what you cannot. Prevent recurrence in every patient.</p></div>
<div class="card"><table>
<tr><th>Stone</th><th>pH</th><th>X-ray</th><th>Dissolvable</th><th>Hallmark</th></tr>
<tr><td>Struvite</td><td>Alkaline</td><td>Opaque</td><td><span class="badge b-success">Yes</span></td><td>Dogs: UTI. Cats: sterile.</td></tr>
<tr><td>Calcium oxalate</td><td>Any</td><td>Opaque</td><td><span class="badge b-danger">No</span></td><td>Schnauzers, small breeds; Burmese and Himalayan cats</td></tr>
<tr><td>Urate</td><td>Acidic</td><td>Lucent</td><td><span class="badge b-success">Yes*</span></td><td>Dalmatians, Bulldogs, PSS</td></tr>
<tr><td>Cystine</td><td>Acidic</td><td>Faint</td><td><span class="badge b-success">Yes</span></td><td>Intact male Newfoundlands, Bulldogs, Mastiffs</td></tr>
<tr><td>Silica</td><td>Acid/neutral</td><td>Opaque</td><td><span class="badge b-danger">No</span></td><td>Plant-protein diets; jackstone shape</td></tr>
<tr><td>Xanthine</td><td>Acidic</td><td>Lucent</td><td><span class="badge b-danger">No</span></td><td>Allopurinol without purine restriction</td></tr>
</table><p style="font-size:12px;color:var(--text-hint);margin-top:6px">*Urate stones are dissolvable only when there is no portosystemic shunt.</p></div>
<div class="card"><div class="card-title">FLUTD in cats</div><p style="font-size:13px"><strong>Feline idiopathic cystitis</strong> is the most common cause in cats younger than 10, followed by uroliths (struvite and CaOx), urethral plugs, and anatomic causes. Bacterial UTI is uncommon in young cats but more likely in older cats with CKD, hyperthyroidism, or diabetes. FIC treatment: environmental enrichment (MEMO), stress reduction, more water intake (wet food), and analgesia.</p></div>`,
obstruction:`<div class="sh"><h2>Urethral obstruction & hyperkalemia</h2><p>The blocked male cat is a medical emergency first and a catheterization procedure second.</p></div>
<div class="g2"><div class="card"><div class="card-title">Triage</div><p style="font-size:13px">Get IV access and run a stat panel of K⁺, iCa, venous blood gas, BUN/creatinine, and an ECG. Hyperkalemia, ionized hypocalcemia, and metabolic acidosis travel together. Hypothermia with bradycardia means the patient is critical.</p></div>
<div class="card"><div class="card-title">Relief</div><p style="font-size:13px">Sedation (e.g., an opioid plus midazolam, ± a low dose of ketamine or alfaxalone) and consider a coccygeal epidural. Perform decompressive cystocentesis while you prepare, then retrograde flushing and an indwelling catheter (usually for 24–72 h). Use a closed collection system.</p></div></div>
<div class="card"><div class="card-title">After relief</div><p style="font-size:13px"><strong>Post-obstructive diuresis</strong> (UOP &gt;2 mL/kg/h) is common. Measure ins and outs every 4–6 h and adjust the fluid rate. Recheck K⁺ (hypokalemia often follows). Give analgesia and consider prazosin as a urethral relaxant (evidence is mixed). Feed wet food and enrich the environment for FIC. About 15–40% of cats re-obstruct. Perineal urethrostomy is for cats that obstruct repeatedly.</p></div>`,
uroabdomen:`<div class="sh"><h2>Uroabdomen</h2><p>Urine in the peritoneal cavity. Usually caused by trauma in dogs and cats, and by bladder or urachal rupture in neonatal foals.</p></div>
<div class="card"><div class="card-title">Why the ratios work</div><p style="font-size:13px">Urea is small and equilibrates across the peritoneum quickly, so abdominal BUN quickly matches serum BUN. Creatinine and K⁺ cross more slowly, so they become concentrated in the abdominal fluid. That makes creatinine and K⁺ ratios the useful diagnostic tests, and BUN ratios unhelpful.</p></div>
<div class="g2"><div class="card"><div class="card-title">Dog / cat</div><p style="font-size:13px">Creatinine ≥2:1 in both species. K⁺ ≥1.4:1 (dog) or ≥1.9:1 (cat). Some animals can still urinate, so this does not rule out a leak. Positive-contrast cystourethrography locates the tear.</p></div>
<div class="card"><div class="card-title">Foal</div><p style="font-size:13px">Usually a colt 2–4 days old (dorsal bladder tear during foaling), or a septic foal with urachal necrosis. Labs: Na⁺ ↓, Cl⁻ ↓, K⁺ ↑, creatinine ↑. Peritoneal:serum creatinine ≥2:1. Correct K⁺ before anesthesia.</p></div></div>`,
largeanimal:`<div class="sh"><h2>Large animal nephrology</h2><p>Ruminant urolithiasis, equine renal disease, and nephrotoxic plants.</p></div>
<div class="g2"><div class="card"><div class="card-title">Ruminant urolithiasis</div><p style="font-size:13px">Castrated males are at highest risk, because early castration leaves a narrower urethra. Stones lodge at the <strong>urethral process</strong> in goats and sheep and at the <strong>distal sigmoid flexure</strong> in cattle. Grain-heavy rations produce struvite and phosphate stones, legumes produce calcium carbonate, and range grasses produce silica. Tube cystotomy gives the best long-term outcome in pet goats. Prevent with Ca:P 2:1, ammonium chloride, salt, and water.</p></div>
<div class="card"><div class="card-title">Equine renal quirks</div><p style="font-size:13px">Normal equine urine is cloudy, viscous, and alkaline because of calcium carbonate crystals and mucus. Horses with CKD develop <strong>hypercalcemia and hypophosphatemia</strong>, the reverse of small animals. Adequate USG is ≥1.025. Common nephrotoxins: NSAIDs (papillary necrosis), aminoglycosides, oxytetracycline, pigment, and vitamin K₃. Blister beetle (cantharidin) causes hematuria, hypocalcemia, and GI ulceration.</p></div></div>
<div class="card"><div class="card-title">Ruminant notes</div><p style="font-size:13px">In ruminants, <strong>creatinine is preferred to BUN</strong> because urea is recycled to the rumen. Bovine pyelonephritis is caused by the <em>C. renale</em> group. Leptospirosis in calves (<em>L. pomona</em>) causes hemolytic anemia and hemoglobinuria. Amyloidosis causes massive proteinuria with enlarged kidneys. Avoid aminoglycosides because of prolonged residues, and consult FARAD.</p></div>`,
};

let fcState={deck:'phys',idx:0,flipped:false,got:0,missed:0,seen:new Set()};
function renderFlashcards(){
  const deck=FC_DECKS[fcState.deck],card=deck.cards[fcState.idx],total=deck.cards.length;
  const deckBtns=Object.keys(FC_DECKS).map(k=>`<button class="fc-deckbtn${fcState.deck===k?' active':''}" onclick="fcDeck('${k}')">${FC_DECKS[k].name}</button>`).join('');
  $('main').innerHTML=`
<div class="sh"><h2>Flashcards</h2><p>Click a card to flip it. Mark each one to track your progress.</p></div>
<div class="fc-deckbar">${deckBtns}</div>
<div class="fc-click-hint">Click the card to reveal the answer</div>
<div class="fc-wrap"><div class="fc-card${fcState.flipped?' flipped':''}" onclick="fcFlip()">
  <div class="fc-front"><div class="fc-lbl">Question ${fcState.idx+1} of ${total}</div><div class="fc-q">${card.q}</div></div>
  <div class="fc-back"><div class="fc-a">${card.a}</div>${card.hint?`<div class="fc-hint">Hint: ${card.hint}</div>`:''}</div>
</div></div>
<div class="fc-ctrl">
  <button class="fc-btn miss" onclick="fcMark(false)" ${!fcState.flipped?'disabled':''}>✗ Missed</button>
  <button class="fc-btn" onclick="fcPrev()">← Prev</button>
  <div class="fc-prog">${fcState.idx+1} / ${total}</div>
  <button class="fc-btn" onclick="fcNext()">Next →</button>
  <button class="fc-btn got" onclick="fcMark(true)" ${!fcState.flipped?'disabled':''}>✓ Got it</button>
</div>
<div class="fc-stats"><span style="color:var(--success)">✓ ${fcState.got}</span><span style="color:var(--danger)">✗ ${fcState.missed}</span><span style="color:var(--text-hint)">Seen: ${fcState.seen.size}/${total}</span></div>`;
}
function fcFlip(){fcState.flipped=!fcState.flipped;renderFlashcards();}
function fcNext(){const d=FC_DECKS[fcState.deck];fcState.seen.add(fcState.idx);fcState.idx=(fcState.idx+1)%d.cards.length;fcState.flipped=false;renderFlashcards();}
function fcPrev(){const d=FC_DECKS[fcState.deck];fcState.idx=(fcState.idx-1+d.cards.length)%d.cards.length;fcState.flipped=false;renderFlashcards();}
function fcMark(c){fcState.seen.add(fcState.idx);if(c)fcState.got++;else fcState.missed++;addScore(c?1:0,1);fcNext();}
function fcDeck(k){fcState={deck:k,idx:0,flipped:false,got:0,missed:0,seen:new Set()};renderFlashcards();}

    {q:'A dog with proteinuric CKD starts benazepril. Two weeks later creatinine has risen from 2.0 to 2.3 mg/dL. Best interpretation?',opts:['ACEi nephrotoxicity, so stop immediately','Expected small fall in GFR from efferent dilation, so continue and monitor','Sign of acute pyelonephritis','Laboratory error'],correct:1,explain:'Efferent dilation lowers P_GC, so GFR falls slightly and proteinuria improves. A rise in creatinine of less than about 30% is expected. Larger rises, or azotemia with dehydration, call for reassessment.'},
    {q:'Which drug blocks the Na⁺-Cl⁻ cotransporter of the DCT?',opts:['Furosemide','Spironolactone','Hydrochlorothiazide','Acetazolamide'],correct:2,explain:'Thiazides block NCC in the DCT. Furosemide blocks NKCC2 (TAL), spironolactone blocks the aldosterone receptor (collecting duct), and acetazolamide inhibits carbonic anhydrase (PCT).'},
    {q:'Constricting the efferent arteriole alone will:',opts:['Decrease RPF and decrease GFR','Decrease RPF and increase GFR','Increase RPF and increase GFR','Increase RPF and decrease GFR'],correct:1,explain:'Blood backs up in the glomerulus, so P_GC and GFR rise while total renal plasma flow falls. Filtration fraction increases.'},
    {q:'A Basenji has glucosuria with a blood glucose of 95 mg/dL. Most likely?',opts:['Diabetes mellitus','Stress hyperglycemia','Fanconi syndrome','Hyperadrenocorticism'],correct:2,explain:'Glucosuria with normoglycemia points to a proximal tubular reabsorption defect. Basenjis have inherited Fanconi syndrome. Jerky treats are an acquired cause.'},
  ]},
  azo:{name:'Azotemia & UA',questions:[
    {q:'A 4-yr-old dog: vomiting, BUN 88, creatinine 3.4, USG 1.018, Na 128, K 7.1. Most likely diagnosis?',opts:['CKD stage 3','Hypoadrenocorticism','Ethylene glycol toxicosis','Leptospirosis'],correct:1,explain:'Na:K of 18 with azotemia and poorly concentrated urine is classic hypoadrenocorticism. Aldosterone deficiency causes medullary washout, so the USG looks "renal" even though the azotemia is largely pre-renal. Confirm with an ACTH stimulation test.'},
    {q:'An azotemic cat has a USG of 1.045. The azotemia is best classified as:',opts:['Renal','Pre-renal','Post-renal','Cannot be classified'],correct:1,explain:'USG ≥1.035 in an azotemic cat shows the tubules can concentrate, which points to pre-renal azotemia. Some cats with CKD keep concentrating ability, so recheck after rehydration.'},
    {q:'Which UA finding most strongly supports pyelonephritis over cystitis?',opts:['Bacteriuria','Pyuria','WBC casts','Hematuria'],correct:2,explain:'WBC casts form in the renal tubules, so they place the inflammation in the kidney. Bacteriuria, pyuria, and hematuria occur in lower urinary tract infection too.'},
    {q:'Which crystal is never normal in a cat?',opts:['Struvite','Calcium oxalate dihydrate','Bilirubin','Amorphous phosphate'],correct:2,explain:'Cats have a high renal threshold for bilirubin, so bilirubinuria or bilirubin crystals always indicate disease (hemolysis, hepatic, or post-hepatic).'},
  ]},
  ckd:{name:'CKD & IRIS',questions:[
    {q:'A 13-yr-old cat with stable creatinine of 3.6 mg/dL and UPC 0.3. IRIS classification?',opts:['Stage 2, non-proteinuric','Stage 3, borderline proteinuric','Stage 3, proteinuric','Stage 4, borderline proteinuric'],correct:1,explain:'Creatinine 2.9–5.0 is stage 3. A cat UPC of 0.2–0.4 is borderline proteinuric.'},
    {q:'A dog has creatinine 2.4 mg/dL (stage 2) and SDMA 40 µg/dL (stage 3), with poor muscle condition. IRIS advises:',opts:['Stage by creatinine and ignore SDMA','Consider treating with stage 3 recommendations','Repeat SDMA only','Diagnose AKI'],correct:1,explain:'Low muscle mass makes creatinine underestimate GFR loss. When SDMA stages higher, IRIS advises considering treatment at the higher stage.'},
    {q:'Which intervention has the strongest evidence for prolonging survival in cats with CKD stage 2–3?',opts:['Benazepril','Renal diet','Darbepoetin','Calcitriol'],correct:1,explain:'Clinical renal diets (phosphate and protein restriction) have the strongest evidence for reducing uremic crises and prolonging survival in cats.'},
    {q:'A CKD cat with SBP 190 mmHg and retinal detachment. First-line treatment?',opts:['Benazepril','Amlodipine','Furosemide','Atenolol'],correct:1,explain:'Amlodipine is first-line for feline hypertension, and essential with target-organ damage. Telmisartan is an alternative. ACEi alone rarely controls severe feline hypertension.'},
  ]},
  aki:{name:'AKI & toxins',questions:[
    {q:'A cat chewed a bouquet of Easter lilies 6 h ago and is vomiting. Creatinine is normal. Best plan?',opts:['Send home and recheck in 1 week','Decontaminate and start IV fluids for 48 h with serial creatinine','Give fomepizole','Furosemide only'],correct:1,explain:'Lily AKI develops over 24–72 h. Early decontamination and aggressive IV fluids (ideally started within 18 h) give a good prognosis. Waiting for azotemia means waiting too long.'},
    {q:'Increased anion gap, increased osmolal gap, and CaOx monohydrate crystals in a dog with AKI. Diagnosis?',opts:['Grape toxicosis','Ethylene glycol','Leptospirosis','NSAID toxicosis'],correct:1,explain:'Ethylene glycol metabolites (glycolate, oxalate) raise the anion gap. Unmetabolized EG raises the osmolal gap. CaOx monohydrate crystals deposit in the tubules.'},
    {q:'A dog in AKI makes 0.4 mL/kg/h of urine despite being volume-replete. IRIS subgrade?',opts:['Non-oliguric','Oliguric','Polyuric','Cannot subgrade'],correct:1,explain:'Less than 1 mL/kg/h over 6 h in a volume-replete patient is oliguric (O). Consider a furosemide trial and early referral for dialysis.'},
    {q:'A Labrador with AKI, thrombocytopenia, and elevated ALT after swimming in a pond. Empiric antibiotic?',opts:['Enrofloxacin','Doxycycline (or ampicillin IV if vomiting)','Metronidazole','Cefazolin'],correct:1,explain:'Suspect leptospirosis. Per the ACVIM 2023 consensus, doxycycline 5 mg/kg q12h for 14 days, with IV ampicillin or penicillin first if the dog cannot take oral medication.'},
  ]},
  stones:{name:'Uroliths',questions:[
    {q:'A 9-yr-old Miniature Schnauzer has radiopaque cystoliths and urine pH 6.0. Most likely stone and plan?',opts:['Struvite: dissolution diet','Calcium oxalate: removal','Urate: allopurinol','Cystine: tiopronin'],correct:1,explain:'Schnauzers, radiopaque stones, and acidic urine all fit calcium oxalate, which cannot be dissolved. Remove it (voiding urohydropropulsion if small, otherwise cystoscopy or cystotomy).'},
    {q:'A female dog has radiopaque cystoliths, alkaline urine, and a positive urine culture for Staph. pseudintermedius. Plan?',opts:['Cystotomy','Dissolution diet + antibiotics for the dissolution period','Antibiotics for 7 days only','Potassium citrate'],correct:1,explain:'This is infection-induced struvite, which can be dissolved. Give a calculolytic diet plus appropriate antibiotics until the stone dissolves on imaging.'},
    {q:'Radiolucent cystoliths in a 1-yr-old Yorkie with microhepatica. Most likely?',opts:['Calcium oxalate','Ammonium urate','Silica','Struvite'],correct:1,explain:'Radiolucent stones plus a small liver in a young toy breed suggest a portosystemic shunt with ammonium urate urolithiasis.'},
    {q:'A Dalmatian on long-term allopurinol without diet change develops new stones. Most likely?',opts:['Calcium oxalate','Struvite','Xanthine','Cystine'],correct:2,explain:'Allopurinol inhibits xanthine oxidase, so xanthine builds up if purine intake is not restricted, and xanthine stones form.'},
  ]},
  emerg:{name:'Obstruction & emergencies',questions:[
    {q:'A blocked male cat: HR 120, temperature 96.8°F, K⁺ 8.9, absent P waves. First drug?',opts:['Regular insulin','Calcium gluconate','Furosemide','Acepromazine'],correct:1,explain:'With severe hyperkalemic ECG changes, give 10% calcium gluconate first for immediate cardioprotection. Then lower K⁺ with insulin/dextrose and relieve the obstruction.'},
    {q:'In a blocked cat, is LRS contraindicated because it contains K⁺?',opts:['Yes, use only 0.9% NaCl','No, balanced crystalloids are acceptable and correct acidosis faster','Yes, use D5W','No, but add KCl'],correct:1,explain:'The 4 mEq/L of K⁺ in LRS is far below the cat\'s serum K⁺, so the fluid still dilutes K⁺. Studies in obstructed cats show balanced solutions correct acidosis faster without slowing K⁺ correction.'},
    {q:'A dog hit by a car 36 h ago is now azotemic and hyperkalemic. Abdominal fluid creatinine is 8.2 and serum is 3.1. Interpretation?',opts:['Hemoabdomen','Uroabdomen','Septic peritonitis','Bile peritonitis'],correct:1,explain:'An abdominal:serum creatinine ratio of 2.6:1 (≥2:1) confirms uroabdomen. Stabilize the K⁺, drain, and divert urine before surgical repair.'},
  ]},
  la:{name:'Large animal',questions:[
    {q:'A 3-day-old colt: stranguria, distended abdomen, Na 119, Cl 82, K 7.4, creatinine 5.6. Next step before surgery?',opts:['Immediate GA for cystorrhaphy','Drain the abdomen slowly and correct hyperkalemia','Give LRS rapidly and operate','Furosemide'],correct:1,explain:'Uroperitoneum. Anesthetizing a hyperkalemic foal risks fatal arrhythmia. Drain slowly, give 0.9% NaCl with dextrose ± insulin/calcium, aim for K⁺ below about 5.5, then repair.'},
    {q:'A pet wether goat on a grain-heavy diet has stranguria. Most common obstruction site?',opts:['Bladder neck','Ischial arch','Urethral process','Renal pelvis'],correct:2,explain:'The urethral process (vermiform appendage) is the narrowest point and the most common site in small ruminants. Amputating it may restore flow, but recurrence is common.'},
    {q:'Which electrolyte abnormality is characteristic of equine CKD?',opts:['Hypocalcemia','Hypercalcemia','Hypernatremia','Hypermagnesemia'],correct:1,explain:'Horses excrete large amounts of dietary calcium in urine. Failing kidneys retain it, causing hypercalcemia (with hypophosphatemia), the reverse of small animals.'},
    {q:'Range cattle in the western US with obstructive urolithiasis most likely have which stone?',opts:['Struvite','Calcium carbonate','Silica','Cystine'],correct:2,explain:'Silica stones come from silica-rich range grasses. Feedlot (grain) cattle form struvite and phosphate stones, and cattle on legume pasture form calcium carbonate.'},
  ]},
};
let mcqState={deck:'phys',idx:0,answered:false,chosen:null,correct:false,score:0,total:0};
function renderQuiz(){
  const bank=MCQ_BANKS[mcqState.deck],q=bank.questions[mcqState.idx],total=bank.questions.length;
  const deckBtns=Object.keys(MCQ_BANKS).map(k=>`<button class="mcq-deckbtn${mcqState.deck===k?' active':''}" onclick="mcqDeck('${k}')">${MCQ_BANKS[k].name}</button>`).join('');
  const opts=q.opts.map((o,i)=>{let cls='mcq-opt';if(mcqState.answered){if(i===q.correct)cls+=' reveal';else if(mcqState.chosen===i)cls+=' wrong';}
    return `<button class="${cls}" onclick="mcqAnswer(${i})" ${mcqState.answered?'disabled':''}><span class="opt-let">${String.fromCharCode(65+i)}.</span>${o}</button>`;}).join('');
  $('main').innerHTML=`
<div class="sh"><h2>Board-style quiz</h2><p>Select the best answer.</p></div>
<div class="mcq-deckbar">${deckBtns}</div>
<div class="mcq-card"><div class="mcq-qnum">Question ${mcqState.idx+1} of ${total} · ${bank.name}</div><div class="mcq-q">${q.q}</div><div class="mcq-opts">${opts}</div>
<div class="mcq-exp${mcqState.answered?' show':''}">${mcqState.answered?`<strong>${mcqState.correct?'✓ Correct!':'✗ Incorrect.'}</strong> ${q.explain}`:''}</div></div>
<div class="mcq-nav"><button class="mcq-nav-btn" onclick="mcqPrev()">← Back</button>${mcqState.answered?`<button class="mcq-nav-btn primary" onclick="mcqNext()">Next →</button>`:''}<span class="mcq-counter">Score: ${mcqState.score} / ${mcqState.total}</span></div>`;
}
function mcqAnswer(i){if(mcqState.answered)return;const q=MCQ_BANKS[mcqState.deck].questions[mcqState.idx];mcqState.answered=true;mcqState.chosen=i;mcqState.correct=(i===q.correct);mcqState.total++;if(mcqState.correct)mcqState.score++;addScore(mcqState.correct?1:0,1);renderQuiz();}
function mcqNext(){const b=MCQ_BANKS[mcqState.deck];mcqState.idx=(mcqState.idx+1)%b.questions.length;mcqState.answered=false;mcqState.chosen=null;renderQuiz();}
function mcqPrev(){const b=MCQ_BANKS[mcqState.deck];mcqState.idx=(mcqState.idx-1+b.questions.length)%b.questions.length;mcqState.answered=false;mcqState.chosen=null;renderQuiz();}
function mcqDeck(k){mcqState={deck:k,idx:0,answered:false,chosen:null,correct:false,score:0,total:0};renderQuiz();}

const DND_EX={
  diur:{name:'Diuretic → segment',instructions:'Drag each diuretic to the nephron segment where it acts.',
    items:[{id:'a',text:'Furosemide'},{id:'b',text:'Hydrochlorothiazide'},{id:'c',text:'Spironolactone'},{id:'d',text:'Acetazolamide'}],
    zones:[{id:'pct',label:'Proximal convoluted tubule',correct:'d'},{id:'tal',label:'Thick ascending limb',correct:'a'},{id:'dct',label:'Distal convoluted tubule',correct:'b'},{id:'cd',label:'Collecting duct',correct:'c'}]},
  stone:{name:'Stone → hallmark',instructions:'Match each urolith to its classic association.',
    items:[{id:'a',text:'Portosystemic shunt'},{id:'b',text:'Urease-positive Staph UTI'},{id:'c',text:'Miniature Schnauzer, not dissolvable'},{id:'d',text:'Intact male Newfoundland'}],
    zones:[{id:'ur',label:'Ammonium urate',correct:'a'},{id:'st',label:'Struvite (dog)',correct:'b'},{id:'ox',label:'Calcium oxalate',correct:'c'},{id:'cy',label:'Cystine',correct:'d'}]},
  azo:{name:'Azotemia type',instructions:'Classify each azotemic patient.',
    items:[{id:'a',text:'Dehydrated dog, USG 1.045'},{id:'b',text:'Blocked tom with a large firm bladder'},{id:'c',text:'Thin cat, small kidneys, USG 1.014'},{id:'d',text:'Addisonian dog, USG 1.020'}],
    zones:[{id:'pre',label:'Pre-renal',correct:'a'},{id:'post',label:'Post-renal',correct:'b'},{id:'ren',label:'Renal',correct:'c'},{id:'conf',label:'Pre-renal with a confounded USG',correct:'d'}]},
  la:{name:'Ruminant ration → stone',instructions:'Match each diet to the urolith it predisposes to.',
    items:[{id:'a',text:'High-grain feedlot ration'},{id:'b',text:'Clover/alfalfa pasture'},{id:'c',text:'Western range grasses'},{id:'d',text:'Low Ca:P, pelleted goat feed'}],
    zones:[{id:'st',label:'Struvite',correct:'a'},{id:'ca',label:'Calcium carbonate',correct:'b'},{id:'si',label:'Silica',correct:'c'},{id:'ph',label:'Calcium phosphate (apatite)',correct:'d'}]},
};
let dndState={ex:'diur',dragging:null,placements:{},checked:false,sel:null};
function renderDnD(){
  const ex=DND_EX[dndState.ex];
  const selBtns=Object.keys(DND_EX).map(k=>`<button class="dnd-selbtn${dndState.ex===k?' active':''}" onclick="dndSel('${k}')">${DND_EX[k].name}</button>`).join('');
  const placed=Object.values(dndState.placements);
  const items=ex.items.filter(i=>!placed.includes(i.id)).map(i=>`<div class="dnd-item" draggable="true" id="dnd-i-${i.id}" style="${dndState.sel===i.id?'border-color:var(--accent);background:var(--accent-light)':''}" ondragstart="dndStart(event,'${i.id}')" ondragend="dndEnd()" onclick="dndTap('${i.id}')">${i.text}</div>`).join('');
  const zones=ex.zones.map(z=>{const pid=dndState.placements[z.id],pi=pid?ex.items.find(i=>i.id===pid):null;let h='';
    if(pi){const cls=dndState.checked?(pid===z.correct?'correct':'wrong'):'neutral';const extra=dndState.checked&&pid!==z.correct?` ✗ (→ ${ex.items.find(i=>i.id===z.correct).text})`:'';h=`<div class="dnd-pi ${cls}" onclick="event.stopPropagation();dndRemove('${z.id}')">${pi.text}${extra}</div>`;}
    return `<div class="dnd-zone" id="dnd-z-${z.id}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dndDrop(event,'${z.id}')" onclick="dndZoneTap('${z.id}')"><div class="dnd-zone-hdr">${z.label}</div><div class="dnd-drop">${h}</div></div>`;}).join('');
  const allPlaced=ex.zones.every(z=>dndState.placements[z.id]);
  $('main').innerHTML=`
<div class="sh"><h2>Drag & match</h2><p>Drag items into the correct category. On a phone, tap an item and then tap its category.</p></div>
<div class="dnd-selbar">${selBtns}</div>
<div style="font-size:13px;color:var(--text-muted);margin-bottom:12px;padding:9px 12px;background:var(--surface2);border-radius:var(--r)">${ex.instructions}</div>
<div class="dnd-board"><div class="dnd-items"><div style="font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--text-hint);text-transform:uppercase;margin-bottom:6px">Drag these</div>${items||'<div style="font-size:13px;color:var(--text-hint);padding:8px">All placed!</div>'}</div><div class="dnd-zones">${zones}</div></div>
<div class="dnd-actions">${allPlaced&&!dndState.checked?`<button class="dnd-btn primary" onclick="dndCheck()">Check answers</button>`:''}<button class="dnd-btn" onclick="dndReset()">Reset</button></div>`;
}
function dndSel(k){dndState={ex:k,dragging:null,placements:{},checked:false,sel:null};renderDnD();}
function dndStart(e,id){dndState.dragging=id;e.dataTransfer.setData('text/plain',id);}
function dndEnd(){}
function dndPlace(z,id){Object.keys(dndState.placements).forEach(k=>{if(dndState.placements[k]===id)delete dndState.placements[k];});dndState.placements[z]=id;dndState.checked=false;dndState.sel=null;renderDnD();}
function dndDrop(e,z){e.preventDefault();if(dndState.dragging){dndPlace(z,dndState.dragging);dndState.dragging=null;}}
function dndTap(id){dndState.sel=dndState.sel===id?null:id;renderDnD();}
function dndZoneTap(z){if(dndState.sel)dndPlace(z,dndState.sel);}
function dndRemove(z){if(dndState.checked)return;delete dndState.placements[z];renderDnD();}
function dndCheck(){const ex=DND_EX[dndState.ex];let c=0;ex.zones.forEach(z=>{if(dndState.placements[z.id]===z.correct)c++;});dndState.checked=true;addScore(c,ex.zones.length);renderDnD();}
function dndReset(){dndState.placements={};dndState.checked=false;dndState.sel=null;renderDnD();}

const CASES=[
  {title:'The Thin Old Cat',tags:['CKD','IRIS staging'],steps:[
    {label:'Signalment & History',content:'Pepper, a 15-year-old female spayed DSH, presents for 4 months of weight loss, increased thirst, larger urine clumps, and occasional vomiting. She eats dry food only.',question:'List your top differentials for PU/PD and weight loss in a geriatric cat.',answer:'1. CKD (most common). 2. Hyperthyroidism (check T4, which can also mask CKD by raising GFR). 3. Diabetes mellitus. 4. Neoplasia (e.g., lymphoma). 5. Hepatic disease. CKD and hyperthyroidism commonly occur together.'},
    {label:'Exam & Labs',content:'BCS 3/9, MCS moderate loss, about 6% dehydrated, small irregular kidneys. Creatinine 3.3 mg/dL, SDMA 28 µg/dL, BUN 62, phosphate 5.8 mg/dL, K 3.2 mEq/L, HCT 26% (non-regenerative), USG 1.016, inactive sediment, UPC 0.25, T4 normal. SBP 172 mmHg on two visits.',question:'Is this azotemia renal? What IRIS stage and substage, once she is stable?',answer:'Renal: azotemic, USG 1.016 (below 1.035), no extra-renal confounder, and small irregular kidneys. Stage 3 by creatinine (2.9–5.0) and by SDMA (26–38). Borderline proteinuric (UPC 0.2–0.4). Hypertensive (160–179, moderate TOD risk). Rehydrate and confirm stability before formal staging.'},
    {label:'Management',content:'The owner wants to know what will help Pepper most and what to expect.',question:'Outline your treatment plan, with targets.',answer:'1. Renal diet (wet if possible), which has the strongest survival evidence. Phosphate target 2.7–5.0 mg/dL for stage 3, adding a phosphate binder if needed. 2. Potassium gluconate for hypokalemia. 3. Amlodipine for SBP ≥160, targeting <160. Do a fundic exam. 4. Antiemetic (maropitant) and appetite support (mirtazapine or capromorelin). 5. SC fluids if chronically dehydrated. 6. Recheck UPC in about 2 months, and creatinine, phosphate, K, BP, and PCV in 2–4 weeks. Consider an ESA if anemia worsens. Prognosis: months to a few years, depending on how fast she progresses and how much proteinuria she develops.'},
  ]},
  {title:'The Straining Tomcat',tags:['Urethral obstruction','Hyperkalemia'],steps:[
    {label:'Signalment & History',content:'Milo, a 4-year-old male neutered indoor DSH, has been in and out of the litter box for 24 h producing nothing. He vomited twice this morning and is now lying in his carrier.',question:'What is your immediate concern, and what do you do in the first 5 minutes?',answer:'Urethral obstruction with hyperkalemia and uremia. Palpate the bladder (large, firm, painful). Place an IV catheter. Run a stat K⁺, iCa, venous gas, BUN/creatinine, and an ECG. Give opioid analgesia (e.g., buprenorphine or methadone).'},
    {label:'Stabilization',content:'HR 130, T 97.2°F. ECG: no P waves, wide QRS. K⁺ 9.1 mEq/L, iCa 0.9 mmol/L, pH 7.08.',question:'Order your emergency treatments and explain why each one is there.',answer:'1. 10% calcium gluconate 0.5–1.5 mL/kg IV slowly on ECG, for cardioprotection (it does not lower K⁺). 2. Regular insulin 0.25–0.5 U/kg IV + dextrose, followed by dextrose in fluids, to shift K⁺ into cells. 3. IV isotonic crystalloid (balanced solution acceptable). 4. Decompressive cystocentesis to relieve pressure while you prepare. 5. Once stable, sedate and catheterize. Warm him actively, and treat the bradycardia by treating the K⁺.'},
    {label:'After relief',content:'He is catheterized. Over the next 6 h he produces 6 mL/kg/h of urine. The next morning K⁺ is 2.9 mEq/L.',question:'What is happening, and how do you manage it and prevent recurrence?',answer:'Post-obstructive diuresis (>2 mL/kg/h) with hypokalemia. Measure ins and outs every 4–6 h, match fluids to output and taper gradually, and supplement KCl (no faster than 0.5 mEq/kg/h). Catheter for 24–72 h, then monitor for re-obstruction. Prevention: likely FIC, so wet food, more water, MEMO and stress reduction, analgesia, and ± prazosin. Discuss perineal urethrostomy if he obstructs again.'},
  ]},
  {title:'The Lily-Chewing Cat',tags:['AKI','Nephrotoxin'],steps:[
    {label:'History',content:'Luna, a 2-year-old female spayed Siamese, was found chewing a bouquet of stargazer lilies about 4 hours ago. She has vomited once. She is otherwise bright.',question:'Why is this an emergency even though she looks well, and what do you do now?',answer:'Every part of Lilium and Hemerocallis lilies, including pollen and vase water, causes acute tubular necrosis in cats. AKI develops over 24–72 h. Outcomes are good if decontamination and IV fluids start early (ideally within 18 h). Induce emesis if it has been less than about 1–2 h and she is not already vomiting, give activated charcoal, wash pollen off the coat, and get baseline creatinine, K⁺, and a UA.'},
    {label:'Hospitalization',content:'She receives IV fluids at about 2–3 times maintenance. At 36 h, creatinine has risen from 1.3 to 2.1 mg/dL, and UOP is 0.6 mL/kg/h despite euvolemia. Granular casts are present.',question:'Give her IRIS AKI grade and subgrade. What do you do next?',answer:'Grade II (1.7–2.5 mg/dL), oliguric (<1 mL/kg/h). Reduce fluids to avoid volume overload (weigh q6–12h). Try furosemide. Monitor K⁺ and acid–base. Refer early for hemodialysis or peritoneal dialysis if oligo-anuria persists, because cats with lily-induced anuria rarely survive without it.'},
  ]},
  {title:'The Wether with a Wet Belly',tags:['Large animal','Urolithiasis'],steps:[
    {label:'Signalment & History',content:'Buddy, a 2-year-old castrated Nigerian Dwarf pet goat, has been straining to urinate, vocalizing, and flagging his tail for a day. He eats a sweet-feed grain mix daily plus grass hay.',question:'Top differential, the obstruction sites to check, and the ration risk factor?',answer:'Obstructive urolithiasis. Check the urethral process (most common site in small ruminants) and the distal sigmoid flexure. The grain-heavy ration is high in phosphorus with a low Ca:P ratio, which predisposes to struvite and calcium phosphate stones. Early castration reduces urethral diameter.'},
    {label:'Diagnostics',content:'The urethral process is gritty and dark. Ultrasound shows a markedly distended bladder with no free fluid. BUN and creatinine are moderately increased. K⁺ is 5.9 mEq/L.',question:'What is your treatment plan, and what is the best long-term surgical option?',answer:'Stabilize first: IV fluids, analgesia, and correction of the K⁺. Under sedation, amputate the urethral process, which may restore flow but often fails because stones sit higher up. For the best long-term outcome in a pet goat, place a tube cystotomy (with normograde/retrograde flushing). Perineal urethrostomy is a salvage option with a high stricture rate. Free abdominal fluid or ventral SC swelling would indicate rupture.'},
    {label:'Prevention',content:'The owner has two more wethers at home on the same diet.',question:'What dietary changes do you recommend?',answer:'Cut out or sharply reduce grain and feed mostly grass hay. Bring the Ca:P ratio to about 2:1. Add ammonium chloride to acidify the urine (monitor urine pH). Add salt to encourage drinking, and provide clean, unfrozen water. Avoid alfalfa-heavy diets in herds with calcium carbonate stones.'},
  ]},
  {title:'The Pot-Bellied Colt',tags:['Equine neonate','Uroperitoneum'],steps:[
    {label:'History & Exam',content:'A 3-day-old Quarter Horse colt has had progressive abdominal distension, frequent posturing to urinate with small volumes, and lethargy since yesterday. The foaling was unassisted. The umbilicus looks dry.',question:'Top differentials, and what tests confirm your leading one?',answer:'1. Uroperitoneum (ruptured bladder; colts at 2–4 days are classic). 2. Meconium impaction. 3. Enteritis or ileus. 4. Urachal rupture with sepsis. Confirm with abdominal ultrasound (free anechoic fluid, possibly a collapsed bladder) and an abdominocentesis: peritoneal:serum creatinine ≥2:1. Also check IgG and run a sepsis screen.'},
    {label:'Labs',content:'Na 118, Cl 80, K 7.6 mEq/L, creatinine 6.2 mg/dL. Peritoneal creatinine 15.1 mg/dL.',question:'Explain the electrolyte pattern. What do you do before surgery?',answer:'Urine is low in Na and Cl and high in K and creatinine. Those solutes equilibrate across the peritoneum, so the foal becomes hyponatremic, hypochloremic, hyperkalemic, and azotemic. Peritoneal:serum creatinine is 2.4:1, which confirms the diagnosis. Before anesthesia: slowly drain the abdomen with a peritoneal catheter, give 0.9% NaCl with dextrose (± insulin, calcium gluconate if there are ECG changes), and aim for K⁺ below about 5.5 mEq/L to prevent arrhythmias under anesthesia. Then perform surgical cystorrhaphy. Treat failure of passive transfer and sepsis if present.'},
  ]},
];
let caseState={idx:0,step:0,revealed:[]};
function renderCases(){
  const cas=CASES[caseState.idx],step=cas.steps[caseState.step],rev=(caseState.revealed[caseState.idx]||[])[caseState.step];
  const selBtns=CASES.map((c,i)=>`<button class="case-selbtn${caseState.idx===i?' active':''}" onclick="caseSelect(${i})">${c.title}</button>`).join('');
  const stepDots=cas.steps.map((_,i)=>{const d=(caseState.revealed[caseState.idx]||[])[i];return `<div class="cstep${d?' done':''}${i===caseState.step?' active':''}" onclick="caseGo(${i})" title="Step ${i+1}"></div>`;}).join('');
  $('main').innerHTML=`
<div class="sh"><h2>Clinical cases</h2><p>Work through each case step by step. Write your answer before revealing the model answer.</p></div>
<div class="case-selbar">${selBtns}</div>
<div class="case-steps-row">${stepDots}<span style="font-size:12px;color:var(--text-hint);margin-left:4px">Step ${caseState.step+1} of ${cas.steps.length}</span></div>
<div class="case-card"><div class="case-banner"><h3>${cas.title}</h3><p>${cas.tags.map(t=>`<span class="badge b-accent" style="margin-right:4px">${t}</span>`).join('')}</p></div>
<div class="case-body"><div style="margin-bottom:12px"><div class="case-step-lbl">${step.label}</div><div class="case-text">${step.content}</div></div>
<div class="case-step-lbl">Your answer</div><textarea class="case-textarea" id="case-ta" placeholder="Write your answer before revealing…" rows="3"></textarea>
<div style="margin-top:4px"><button class="case-btn primary" onclick="caseReveal()">Reveal model answer</button>
${caseState.step>0?`<button class="case-btn" onclick="caseBack()">← Back</button>`:''}
${caseState.step<cas.steps.length-1?`<button class="case-btn" onclick="caseNext()" ${!rev?'disabled style="opacity:.45"':''}>Next step →</button>`:''}</div>
<div class="case-reveal-box${rev?' show':''}"><div class="case-reveal-lbl">Model answer</div><div class="case-reveal-text">${step.answer}</div></div></div></div>`;
}
function caseSelect(i){caseState.idx=i;caseState.step=0;renderCases();}
function caseGo(i){if(i<=caseState.step||(caseState.revealed[caseState.idx]||[])[i]){caseState.step=i;renderCases();}}
function caseReveal(){if(!caseState.revealed[caseState.idx])caseState.revealed[caseState.idx]=[];caseState.revealed[caseState.idx][caseState.step]=true;renderCases();}
function caseNext(){if(caseState.step<CASES[caseState.idx].steps.length-1){caseState.step++;renderCases();}}
function caseBack(){if(caseState.step>0){caseState.step--;renderCases();}}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
renderSidebar();render();
</script>
