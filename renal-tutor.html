const REF={
physiology:`<div class="sh"><h2>GFR & renal physiology</h2><p>Blood flow, filtration, autoregulation, and the hormones that act on the kidney.</p></div>
<div class="g2"><div class="card"><div class="card-title">Numbers to know</div>
<div class="kv"><span class="kv-key">Kidneys' share of cardiac output</span><span>~20–25%</span></div>
<div class="kv"><span class="kv-key">Filtration fraction (GFR/RPF)</span><span>~20%</span></div>
<div class="kv"><span class="kv-key">Autoregulation range</span><span>MAP ~80–180 mmHg</span></div>
<div class="kv"><span class="kv-key">Nephron loss before azotemia</span><span>~75%</span></div>
<div class="kv"><span class="kv-key">Nephron loss before concentrating ability fails</span><span>~66%</span></div>
</div><div class="card"><div class="card-title">GFR markers</div>
<p style="font-size:13px"><strong>Creatinine</strong> comes from muscle, so it underestimates GFR loss in cachectic patients and runs high in very muscular dogs (sighthounds). <strong>SDMA</strong> is not affected by muscle mass and rises earlier (around a 25–40% fall in GFR). Both have a <strong>curvilinear</strong> relationship with GFR: small rises early in disease represent large losses of GFR.</p></div></div>
<div class="card"><div class="card-title">Hormones</div><table>
<tr><th>Hormone</th><th>Trigger</th><th>Renal action</th></tr>
<tr><td>Renin → Ang II</td><td>↓ renal perfusion, ↓ NaCl at the macula densa, β₁</td><td>Efferent constriction, PCT Na⁺ reabsorption, aldosterone and ADH release, thirst</td></tr>
<tr><td>Aldosterone</td><td>Ang II, hyperkalemia</td><td>Collecting duct Na⁺ reabsorption and K⁺/H⁺ secretion</td></tr>
<tr><td>ADH (vasopressin)</td><td>↑ plasma osmolality, severe hypovolemia</td><td>Aquaporin-2 insertion in the collecting duct</td></tr>
<tr><td>PTH</td><td>↓ ionized Ca²⁺, ↑ phosphate</td><td>↑ DCT Ca²⁺ reabsorption, ↓ PCT phosphate reabsorption, ↑ calcitriol</td></tr>
<tr><td>Erythropoietin</td><td>Renal hypoxia</td><td>Made by peritubular interstitial cells. Falls in CKD, causing non-regenerative anemia.</td></tr>
<tr><td>Calcitriol</td><td>1α-hydroxylase in the PCT</td><td>Falls in CKD, contributing to renal secondary hyperparathyroidism</td></tr>
</table></div>
<div class="info-box"><strong>Renal secondary hyperparathyroidism in CKD:</strong> falling GFR causes phosphate retention and less calcitriol. Ionized Ca²⁺ drops, so PTH rises. The result is renal osteodystrophy ("rubber jaw" in young dogs) and progressive nephron injury. This is why phosphate restriction is central to CKD management.</div>`,
nephron:`<div class="sh"><h2>Nephron & diuretics</h2><p>Each tubule segment, the transporter that works there, and the drug that blocks it.</p></div>
<div class="card"><table>
<tr><th>Segment</th><th>% Na⁺</th><th>Key transporter</th><th>Drug</th></tr>
<tr><td>PCT</td><td>65–70%</td><td>NHE3, SGLT2, carbonic anhydrase</td><td>Acetazolamide, mannitol, SGLT2 inhibitors</td></tr>
<tr><td>Thick ascending limb</td><td>~25%</td><td>NKCC2</td><td>Furosemide, torsemide</td></tr>
<tr><td>DCT</td><td>5–8%</td><td>NCC</td><td>Thiazides</td></tr>
<tr><td>Collecting duct</td><td>2–5%</td><td>ENaC, ROMK, AQP2</td><td>Spironolactone, amiloride</td></tr>
</table></div>
<div class="g2"><div class="card"><div class="card-title">Furosemide pearls</div><p style="font-size:13px">It must be <strong>filtered and secreted</strong> into the tubular lumen to work, so its effect falls as GFR falls. It is used for CHF, oliguric AKI (a trial only, once the patient is volume-replete), and hypercalcemia (after rehydration). Side effects: hypokalemia, hypochloremic alkalosis, hypomagnesemia, dehydration, and prerenal azotemia.</p></div>
<div class="card"><div class="card-title">Concentrating urine</div><p style="font-size:13px">The countercurrent multiplier (loop of Henle) builds the medullary gradient from NaCl and urea, and ADH then lets water leave the collecting duct. <strong>Medullary washout</strong> (Addison's, PU/PD of any cause, low urea in liver failure, aggressive diuresis) impairs concentration even when the nephrons are intact.</p></div></div>`,
azotemia:`<div class="sh"><h2>Azotemia</h2><p>Azotemia means increased BUN and/or creatinine. Uremia is the clinical syndrome that results. Localize the azotemia before you treat it.</p></div>
<div class="g3">
<div class="card"><div class="card-title"><span class="badge b-info">Pre-renal</span></div><p style="font-size:13px">Reduced renal perfusion: dehydration, shock, CHF, hypoalbuminemia, hypoadrenocorticism. <strong>USG concentrated</strong> (unless there is a confounder). Resolves within 24–48 h of restoring perfusion.</p></div>
<div class="card"><div class="card-title"><span class="badge b-danger">Renal</span></div><p style="font-size:13px">Loss of ≥75% of functional nephrons, from AKI or CKD. <strong>USG inadequate</strong> while the patient is azotemic. About two-thirds of nephrons have already lost concentrating ability.</p></div>
<div class="card"><div class="card-title"><span class="badge b-warn">Post-renal</span></div><p style="font-size:13px">Obstruction (urethral stones, urethral plugs in cats, neoplasia) or rupture (uroabdomen). USG is variable and not useful for localizing. Hyperkalemia is common. Usually resolves within 24–72 h of relief. If it does not, there is a concurrent renal component.</p></div></div>
<div class="g2">
<div class="card"><div class="card-title">Step 1: use a pre-fluid USG</div>
<table><tr><th>Species</th><th>Adequately concentrated</th></tr>
<tr><td>Dog</td><td>≥1.030</td></tr><tr><td>Cat</td><td>≥1.035</td></tr><tr><td>Horse</td><td>≥1.025</td></tr><tr><td>Cattle / small ruminant</td><td>≥1.025</td></tr></table>
<p style="font-size:12.5px;color:var(--text-muted);margin-top:8px">The concentrating ability of an azotemic or dehydrated patient is the test of the tubules. Collect urine <strong>before</strong> fluids, because a sample taken during fluid therapy tells you nothing.</p></div>
<div class="card"><div class="card-title">Step 2: interpret</div><ul style="font-size:13px;padding-left:18px;line-height:1.65">
<li><strong>Azotemia + concentrated urine</strong> means pre-renal. <em>Cat caveat:</em> some cats with real CKD still concentrate above 1.035, so azotemia that persists after rehydration is renal.</li>
<li><strong>Azotemia + inadequately concentrated urine</strong>, with no confounder, means renal. If the patient is also dehydrated, a pre-renal component sits on top, so expect partial improvement with fluids.</li>
<li><strong>USG &lt;1.008 (hyposthenuria)</strong> means the tubules are actively diluting. Consider DI, psychogenic polydipsia, hypercalcemia, and pyelonephritis.</li>
<li><strong>Obstruction or rupture</strong> means post-renal whatever the USG. Relieve it, and check K⁺ and the ECG first.</li></ul></div></div>
<div class="card"><div class="card-title">Extra-renal reasons urine can be dilute in a pre-renal patient</div><table>
<tr><th>Confounder</th><th>Why the urine is dilute</th></tr>
<tr><td>Hypoadrenocorticism (Na:K &lt;27, no stress leukogram)</td><td>Na⁺ loss causes medullary washout</td></tr>
<tr><td>Hypercalcemia</td><td>Ca²⁺ blocks ADH action, causing nephrogenic DI</td></tr>
<tr><td>Fluids, diuretics, glucocorticoids, or mannitol before sampling</td><td>Iatrogenic dilution or diuresis</td></tr>
<tr><td>Glucosuria / diabetes mellitus</td><td>Osmotic diuresis</td></tr>
<tr><td>Pyometra, pyelonephritis, E. coli endotoxemia</td><td>Endotoxin blocks ADH action</td></tr>
<tr><td>Hepatic failure / portosystemic shunt</td><td>Low urea causes loss of the medullary gradient</td></tr>
<tr><td>Hyperadrenocorticism</td><td>Cortisol interferes with ADH release and action</td></tr>
<tr><td>Hyponatremia, low-protein or low-salt diet</td><td>Medullary solute washout</td></tr>
<tr><td>Central or nephrogenic DI, psychogenic polydipsia</td><td>No ADH, no response to it, or chronic washout</td></tr></table>
<p style="font-size:12.5px;color:var(--text-muted);margin-top:8px">Correct the confounder, rehydrate, and reassess. Azotemia that resolves quickly was pre-renal. Persistent azotemia confirms a renal component. An Addisonian dog with azotemia and a USG of 1.020 can look renal and still recover completely.</p></div>
<div class="g2">
<div class="card"><div class="card-title">Step 3: acute or chronic?</div><p style="font-size:13px"><strong>Favors CKD:</strong> small, irregular kidneys; non-regenerative anemia; weight loss and poor body condition; long-standing PU/PD; renal secondary hyperparathyroidism. Stage it with IRIS once the patient is stable.<br><strong>Favors AKI:</strong> normal or enlarged, painful kidneys; active sediment or casts; glucosuria with normoglycemia; severe hyperkalemia; an acute history or known toxin exposure. Grade it with the IRIS AKI scheme.</p></div>
<div class="card"><div class="card-title">BUN:creatinine notes</div><p style="font-size:13px">BUN rises <strong>disproportionately</strong> with GI hemorrhage, a recent high-protein meal, catabolism (fever, glucocorticoids, tetracyclines), and pre-renal states, because urea is partly reabsorbed when tubular flow is slow. BUN is <strong>relatively low</strong> with hepatic failure, PSS, PU/PD, and low-protein diets. <strong>Ruminants:</strong> urea is recycled to the rumen, so creatinine is the more reliable marker. <strong>Horses:</strong> a BUN:Cr ratio &gt;15:1 has traditionally pointed toward pre-renal or chronic disease and &lt;10:1 toward acute renal failure. Treat this as a soft clue only.</p></div></div>`,
ua:`<div class="sh"><h2>Urinalysis</h2><p>Always interpret the dipstick together with the USG and sediment.</p></div>
<div class="g2"><div class="card"><div class="card-title">Dipstick traps</div>
<div class="kv"><span class="kv-key">USG</span><span>Use a refractometer. Dipstick USG pads are not valid for animals.</span></div>
<div class="kv"><span class="kv-key">Leukocyte pad</span><span>False positives in cats and false negatives in dogs. Use the sediment.</span></div>
<div class="kv"><span class="kv-key">Protein pad</span><span>False positive in alkaline urine. Confirm with UPC.</span></div>
<div class="kv"><span class="kv-key">Bilirubin</span><span>Trace to 1+ can be normal in dogs. Any amount is abnormal in cats.</span></div>
<div class="kv"><span class="kv-key">Blood pad</span><span>Positive for hematuria, hemoglobinuria, or myoglobinuria. Check the sediment and serum color.</span></div>
</div><div class="card"><div class="card-title">Proteinuria workup</div><p style="font-size:13px">1. Exclude <strong>pre-renal</strong> causes (hemoglobin, myoglobin, light chains). 2. Exclude <strong>post-renal</strong> causes (inflammation or hemorrhage with an active sediment, so culture). 3. A persistent renal UPC (on ≥3 tests, ≥2 weeks apart) means glomerular or tubular disease. A UPC &gt;2.0 strongly suggests glomerular disease.</p></div></div>
<div class="info-box">Collect a <strong>cystocentesis</strong> sample for culture. Run the sediment within 30–60 minutes, because refrigeration creates struvite and CaOx crystals in vitro.</div>`,
ckd:`<div class="sh"><h2>CKD & IRIS staging</h2><p>CKD is structural or functional kidney damage lasting ≥3 months. It is irreversible and usually progressive.</p></div>
<div class="g2"><div class="card"><div class="card-title">Clinical picture</div><p style="font-size:13px">PU/PD, weight loss, hyporexia, vomiting, halitosis and uremic oral ulcers, non-regenerative anemia, small irregular kidneys (cats), hypokalemia with cervical ventroflexion (cats), hypertension with retinal detachment, and renal secondary hyperparathyroidism.</p></div>
<div class="card"><div class="card-title">Causes</div><p style="font-size:13px"><strong>Cats:</strong> chronic tubulointerstitial nephritis (usually), polycystic kidney disease (Persians, PKD1), lymphoma, FIP, and nephroliths. <strong>Dogs:</strong> glomerular disease, familial nephropathies (e.g., hereditary nephritis in English Cocker Spaniels and Samoyeds, Shar-Pei amyloidosis), chronic pyelonephritis, and the aftermath of AKI.</p></div></div>
<div class="card"><div class="card-title">Substaging cutoffs</div><table>
<tr><th>UPC</th><th>Dog</th><th>Cat</th></tr>
<tr><td>Non-proteinuric</td><td>&lt;0.2</td><td>&lt;0.2</td></tr><tr><td>Borderline</td><td>0.2–0.5</td><td>0.2–0.4</td></tr><tr><td>Proteinuric</td><td>&gt;0.5</td><td>&gt;0.4</td></tr></table>
<div class="sep"></div><table><tr><th>Systolic BP</th><th>Category</th><th>Target-organ damage risk</th></tr>
<tr><td>&lt;140</td><td>Normotensive</td><td>Minimal</td></tr><tr><td>140–159</td><td>Prehypertensive</td><td>Low</td></tr><tr><td>160–179</td><td>Hypertensive</td><td>Moderate</td></tr><tr><td>≥180</td><td>Severely hypertensive</td><td>High</td></tr></table></div>
<div class="info-box">Renal diets (phosphate and protein restriction, plus omega-3s) have the strongest evidence of any CKD intervention, including prolonged survival in cats from IRIS stage 2 onward.</div>`,
aki:`<div class="sh"><h2>AKI & nephrotoxins</h2><p>An abrupt loss of function that is potentially reversible. The degree of azotemia does not predict whether the patient will recover.</p></div>
<div class="card"><div class="card-title">IRIS AKI grading (dogs and cats)</div><table>
<tr><th>Grade</th><th>Creatinine mg/dL (µmol/L)</th><th>Description</th></tr>
<tr><td><strong>I</strong></td><td>&lt;1.6 (&lt;140)</td><td>Non-azotemic AKI: documented injury, a progressive rise ≥0.3 mg/dL (≥26.4 µmol/L) within 48 h, or measured oliguria</td></tr>
<tr><td><strong>II</strong></td><td>1.7–2.5 (141–220)</td><td>Mild AKI: documented AKI with static or progressive azotemia</td></tr>
<tr><td><strong>III</strong></td><td>2.6–5.0 (221–439)</td><td rowspan="3">Moderate to severe AKI, with increasing azotemia and functional renal failure</td></tr>
<tr><td><strong>IV</strong></td><td>5.1–10.0 (440–880)</td></tr>
<tr><td><strong>V</strong></td><td>&gt;10.0 (&gt;880)</td></tr></table>
<p style="font-size:12.5px;color:var(--text-muted);margin-top:8px">Each grade is subgraded as <strong>oliguric/anuric (O)</strong> or <strong>non-oliguric (NO)</strong>, and by whether renal replacement therapy (RRT) is needed. Oliguria is &lt;1 mL/kg/h of urine over 6 h in a volume-replete patient. Anuria is essentially no urine production. "Volume responsive" means UOP rises above 1 mL/kg/h over 6 h and/or creatinine falls to baseline over 48 h with fluids.</p></div>
<div class="g2">
<div class="card"><div class="card-title">Management priorities</div><ul style="font-size:13px;padding-left:18px;line-height:1.65">
<li><strong>Find the cause:</strong> nephrotoxins, infection (leptospirosis, pyelonephritis), ischemia (shock, anesthesia, thrombosis), and obstruction.</li>
<li><strong>Dogs with AKI of unknown cause:</strong> run leptospirosis PCR (blood and urine) plus MAT and start empirical treatment.</li>
<li><strong>Fluids:</strong> correct dehydration over 4–6 h, then match maintenance plus ongoing losses. Volume overload is linked to worse outcomes, so weigh every 6–12 h and watch for chemosis, serous nasal discharge, tachypnea, or a gain of more than 10% body weight.</li>
<li><strong>Measure UOP</strong> with a closed collection system or weighed litter, and monitor K⁺, acid–base, phosphate, and BP.</li>
<li><strong>Oligo-anuria:</strong> confirm the patient is volume-replete and not obstructed. If so, a furosemide trial is reasonable. Mannitol is controversial.</li>
<li><strong>Polyuric recovery (&gt;2 mL/kg/h):</strong> match fluids to ins and outs, and watch K⁺, Na⁺, and Mg²⁺.</li></ul></div>
<div class="card"><div class="card-title">Refer for dialysis when there is</div><ul style="font-size:13px;padding-left:18px;line-height:1.65">
<li>Refractory hyperkalemia</li><li>Fluid overload</li><li>Oligo-anuria unresponsive to therapy</li><li>Severe or worsening azotemia (grade IV–V)</li><li>A dialyzable toxin (ethylene glycol)</li></ul>
<div class="sep"></div><div class="card-title">Phases of AKI</div><p style="font-size:13px">Initiation, then extension, then maintenance (often oliguric), then recovery (often polyuric). The maintenance phase can last weeks. Dialysis bridges patients through it while the tubules regenerate.</p></div></div>
<div class="card"><div class="card-title">Nephrotoxins</div><table>
<tr><th>Toxin</th><th>Species</th><th>Key points</th></tr>
<tr><td><strong>Ethylene glycol</strong></td><td>Dogs, cats</td><td>Early CNS signs, then AKI at 24–72 h. High anion gap and osmolal gap, CaOx monohydrate crystals, hyperechoic renal cortices. <strong>Fomepizole</strong> (cats need a much higher dose than dogs) or ethanol. Start within about 3 h in cats and about 8 h in dogs. Hemodialysis removes EG.</td></tr>
<tr><td><strong>Lilies</strong> (<em>Lilium</em>, <em>Hemerocallis</em>)</td><td>Cats only</td><td>Every part, including pollen and vase water. Vomiting, then oligo-anuric AKI within 24–72 h. Decontaminate and start aggressive IV fluids early, ideally within 18 h.</td></tr>
<tr><td><strong>Grapes / raisins</strong></td><td>Dogs</td><td>Tartaric acid is the likely toxic principle (which explains the dose inconsistency). Induce emesis and give IV fluids for 48–72 h, with serial creatinine checks.</td></tr>
<tr><td><strong>NSAIDs</strong></td><td>All</td><td>Afferent constriction and renal papillary necrosis. Higher risk with hypovolemia, anesthesia, or CKD.</td></tr>
<tr><td><strong>Aminoglycosides</strong></td><td>All</td><td>Accumulate in PCT cells. Watch for <strong>granular casts</strong>, glucosuria, and rising GGT:creatinine before azotemia appears. Dose once daily and monitor trough levels.</td></tr>
<tr><td><strong>Vitamin D (cholecalciferol rodenticide, calcipotriene)</strong></td><td>Dogs, cats</td><td>Hypercalcemia and hyperphosphatemia lead to soft-tissue mineralization and AKI.</td></tr></table></div>
<div class="card"><div class="card-title">Leptospirosis (dogs)</div><p style="font-size:13px">AKI ± hepatopathy, pulmonary hemorrhage syndrome, and thrombocytopenia. Diagnose with blood and urine PCR plus paired MAT (a fourfold rise). Treat with <strong>doxycycline</strong> (5 mg/kg PO q12h for 14 days, per the ACVIM 2023 consensus), using IV ampicillin or penicillin first if the dog is vomiting. It is <strong>zoonotic</strong>, so use PPE and handle urine with care.</p></div>`,
uroliths:`<div class="sh"><h2>Uroliths</h2><p>Dissolve what you can and remove what you cannot. Prevent recurrence in every patient.</p></div>
<div class="card"><table>
<tr><th>Stone</th><th>pH</th><th>X-ray</th><th>Dissolvable</th><th>Hallmark</th></tr>
<tr><td>Struvite</td><td>Alkaline</td><td>Opaque</td><td><span class="badge b-success">Yes</span></td><td>Dogs: UTI. Cats: sterile.</td></tr>
<tr><td>Calcium oxalate</td><td>Any</td><td>Opaque</td><td><span class="badge b-danger">No</span></td><td>Schnauzers, small breeds; Burmese and Himalayan cats</td></tr>
<tr><td>Urate</td><td>Acidic</td><td>Lucent</td><td><span class="badge b-success">Yes*</span></td><td>Dalmatians, Bulldogs, PSS</td></tr>
<tr><td>Cystine</td><td>Acidic</td><td>Faint</td><td><span class="badge b-success">Yes</span></td><td>Intact male Newfoundlands, Bulldogs, Mastiffs</td></tr>
<tr><td>Silica</td><td>Acid/neutral</td><td>Opaque</td><td><span class="badge b-danger">No</span></td><td>Plant-protein diets; jackstone shape</td></tr>
<tr><td>Xanthine</td><td>Acidic</td><td>Lucent</td><td><span class="badge b-danger">No</span></td><td>Allopurinol without purine restriction</td></tr>
</table><p style="font-size:12px;color:var(--text-hint);margin-top:6px">*Urate stones are dissolvable only when there is no portosystemic shunt.</p></div>
<div class="card"><div class="card-title">FLUTD in cats</div><p style="font-size:13px"><strong>Feline idiopathic cystitis</strong> is the most common cause in cats younger than 10, followed by uroliths (struvite and CaOx), urethral plugs, and anatomic causes. Bacterial UTI is uncommon in young cats but more likely in older cats with CKD, hyperthyroidism, or diabetes. FIC treatment: environmental enrichment (MEMO), stress reduction, more water intake (wet food), and analgesia.</p></div>`,
obstruction:`<div class="sh"><h2>Urethral obstruction & hyperkalemia</h2><p>The blocked male cat is a medical emergency first and a catheterization procedure second.</p></div>
<div class="g2"><div class="card"><div class="card-title">Triage</div><p style="font-size:13px">Get IV access and run a stat panel of K⁺, iCa, venous blood gas, BUN/creatinine, and an ECG. Hyperkalemia, ionized hypocalcemia, and metabolic acidosis travel together. Hypothermia with bradycardia means the patient is critical.</p></div>
<div class="card"><div class="card-title">Relief</div><p style="font-size:13px">Sedation (e.g., an opioid plus midazolam, ± a low dose of ketamine or alfaxalone) and consider a coccygeal epidural. Perform decompressive cystocentesis while you prepare, then retrograde flushing and an indwelling catheter (usually for 24–72 h). Use a closed collection system.</p></div></div>
<div class="card"><div class="card-title">After relief</div><p style="font-size:13px"><strong>Post-obstructive diuresis</strong> (UOP &gt;2 mL/kg/h) is common. Measure ins and outs every 4–6 h and adjust the fluid rate. Recheck K⁺ (hypokalemia often follows). Give analgesia and consider prazosin as a urethral relaxant (evidence is mixed). Feed wet food and enrich the environment for FIC. About 15–40% of cats re-obstruct. Perineal urethrostomy is for cats that obstruct repeatedly.</p></div>`,
uroabdomen:`<div class="sh"><h2>Uroabdomen</h2><p>Urine in the peritoneal cavity. Usually caused by trauma in dogs and cats, and by bladder or urachal rupture in neonatal foals.</p></div>
<div class="card"><div class="card-title">Diagnostic ratios: abdominal fluid vs serum, sampled at the same time</div><table>
<tr><th>Species</th><th>Creatinine ratio</th><th>K⁺ ratio</th><th>Classic picture</th></tr>
<tr><td>Dog</td><td>≥2:1</td><td>≥1.4:1</td><td>Trauma (hit by car, pelvic fracture), often still able to urinate. Azotemia and hyperkalemia develop over 24–48 h.</td></tr>
<tr><td>Cat</td><td>≥2:1</td><td>≥1.9:1</td><td>Trauma, or iatrogenic injury from cystocentesis, bladder expression, or urinary catheterization.</td></tr>
<tr><td>Foal</td><td>≥2:1</td><td>—</td><td>A 2–4-day-old colt with stranguria and a distended abdomen. Labs show <strong>hyponatremia, hypochloremia, hyperkalemia, and azotemia</strong>.</td></tr></table>
<p style="font-size:12.5px;color:var(--text-muted);margin-top:8px">A ratio below the cutoff does not completely rule out a leak. If suspicion is high, repeat the sampling and image the urinary tract.</p></div>
<div class="g2">
<div class="card"><div class="card-title">Why the ratios work</div><p style="font-size:13px">Urea is small and equilibrates across the peritoneum quickly, so abdominal BUN quickly matches serum BUN. Creatinine and K⁺ cross more slowly, so they become concentrated in the abdominal fluid. That makes creatinine and K⁺ ratios the useful diagnostic tests, and BUN ratios unhelpful.</p></div>
<div class="card"><div class="card-title">Management</div><ul style="font-size:13px;padding-left:18px;line-height:1.65">
<li>It is a <strong>metabolic emergency before it is a surgical one</strong>. Treat hyperkalemia first (calcium gluconate, insulin + dextrose).</li>
<li>Drain the abdomen (peritoneal catheter) and divert urine (urinary catheter ± cystostomy tube).</li>
<li>Locate the leak with positive-contrast cystourethrography or CT.</li>
<li>Repair surgically once the patient is metabolically stable. Some small bladder tears heal with catheter decompression alone.</li></ul></div></div>
<div class="card"><div class="card-title">Foal uroperitoneum</div><p style="font-size:13px">Usually a colt 2–4 days old (dorsal bladder tear during foaling), or a septic foal with urachal necrosis. Peritoneal:serum creatinine is ≥2:1. Anesthesia with K⁺ &gt;5.5 mEq/L risks fatal arrhythmia, so drain the abdomen slowly and give 0.9% NaCl with dextrose (± insulin, plus calcium gluconate if there are ECG changes). Check IgG and look for sepsis or omphalitis, then perform cystorrhaphy.</p></div>`,
largeanimal:`<div class="sh"><h2>Large animal nephrology</h2><p>Ruminant urolithiasis, equine renal disease, and nephrotoxic plants.</p></div>

    items:[{id:'a',text:'High-grain feedlot ration'},{id:'b',text:'Clover/alfalfa pasture'},{id:'c',text:'Western range grasses'},{id:'d',text:'Low Ca:P, pelleted goat feed'}],
    zones:[{id:'st',label:'Struvite',correct:'a'},{id:'ca',label:'Calcium carbonate',correct:'b'},{id:'si',label:'Silica',correct:'c'},{id:'ph',label:'Calcium phosphate (apatite)',correct:'d'}]},
};
let dndState={ex:'diur',dragging:null,placements:{},checked:false,sel:null};
function renderDnD(){
  const ex=DND_EX[dndState.ex];
  const selBtns=Object.keys(DND_EX).map(k=>`<button class="dnd-selbtn${dndState.ex===k?' active':''}" onclick="dndSel('${k}')">${DND_EX[k].name}</button>`).join('');
  const placed=Object.values(dndState.placements);
  const items=ex.items.filter(i=>!placed.includes(i.id)).map(i=>`<div class="dnd-item" draggable="true" id="dnd-i-${i.id}" style="${dndState.sel===i.id?'border-color:var(--accent);background:var(--accent-light)':''}" ondragstart="dndStart(event,'${i.id}')" ondragend="dndEnd()" onclick="dndTap('${i.id}')">${i.text}</div>`).join('');
  const zones=ex.zones.map(z=>{const pid=dndState.placements[z.id],pi=pid?ex.items.find(i=>i.id===pid):null;let h='';
    if(pi){const cls=dndState.checked?(pid===z.correct?'correct':'wrong'):'neutral';const extra=dndState.checked&&pid!==z.correct?` ✗ (→ ${ex.items.find(i=>i.id===z.correct).text})`:'';h=`<div class="dnd-pi ${cls}" onclick="event.stopPropagation();dndRemove('${z.id}')">${pi.text}${extra}</div>`;}
    return `<div class="dnd-zone" id="dnd-z-${z.id}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dndDrop(event,'${z.id}')" onclick="dndZoneTap('${z.id}')"><div class="dnd-zone-hdr">${z.label}</div><div class="dnd-drop">${h}</div></div>`;}).join('');
  const allPlaced=ex.zones.every(z=>dndState.placements[z.id]);
  $('main').innerHTML=`
<div class="sh"><h2>Drag & match</h2><p>Drag items into the correct category. On a phone, tap an item and then tap its category.</p></div>
<div class="dnd-selbar">${selBtns}</div>
<div style="font-size:13px;color:var(--text-muted);margin-bottom:12px;padding:9px 12px;background:var(--surface2);border-radius:var(--r)">${ex.instructions}</div>
<div class="dnd-board"><div class="dnd-items"><div style="font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--text-hint);text-transform:uppercase;margin-bottom:6px">Drag these</div>${items||'<div style="font-size:13px;color:var(--text-hint);padding:8px">All placed!</div>'}</div><div class="dnd-zones">${zones}</div></div>
<div class="dnd-actions">${allPlaced&&!dndState.checked?`<button class="dnd-btn primary" onclick="dndCheck()">Check answers</button>`:''}<button class="dnd-btn" onclick="dndReset()">Reset</button></div>`;
}
function dndSel(k){dndState={ex:k,dragging:null,placements:{},checked:false,sel:null};renderDnD();}
function dndStart(e,id){dndState.dragging=id;e.dataTransfer.setData('text/plain',id);}
function dndEnd(){}
function dndPlace(z,id){Object.keys(dndState.placements).forEach(k=>{if(dndState.placements[k]===id)delete dndState.placements[k];});dndState.placements[z]=id;dndState.checked=false;dndState.sel=null;renderDnD();}
function dndDrop(e,z){e.preventDefault();if(dndState.dragging){dndPlace(z,dndState.dragging);dndState.dragging=null;}}
function dndTap(id){dndState.sel=dndState.sel===id?null:id;renderDnD();}
function dndZoneTap(z){if(dndState.sel)dndPlace(z,dndState.sel);}
function dndRemove(z){if(dndState.checked)return;delete dndState.placements[z];renderDnD();}
function dndCheck(){const ex=DND_EX[dndState.ex];let c=0;ex.zones.forEach(z=>{if(dndState.placements[z.id]===z.correct)c++;});dndState.checked=true;addScore(c,ex.zones.length);renderDnD();}
function dndReset(){dndState.placements={};dndState.checked=false;dndState.sel=null;renderDnD();}

const CASES=[
  {title:'The Thin Old Cat',tags:['CKD','IRIS staging'],steps:[
    {label:'Signalment & History',content:'Pepper, a 15-year-old female spayed DSH, presents for 4 months of weight loss, increased thirst, larger urine clumps, and occasional vomiting. She eats dry food only.',question:'List your top differentials for PU/PD and weight loss in a geriatric cat.',answer:'1. CKD (most common). 2. Hyperthyroidism (check T4, which can also mask CKD by raising GFR). 3. Diabetes mellitus. 4. Neoplasia (e.g., lymphoma). 5. Hepatic disease. CKD and hyperthyroidism commonly occur together.'},
    {label:'Exam & Labs',content:'BCS 3/9, MCS moderate loss, about 6% dehydrated, small irregular kidneys. Creatinine 3.3 mg/dL, SDMA 28 µg/dL, BUN 62, phosphate 5.8 mg/dL, K 3.2 mEq/L, HCT 26% (non-regenerative), USG 1.016, inactive sediment, UPC 0.25, T4 normal. SBP 172 mmHg on two visits.',question:'Is this azotemia renal? What IRIS stage and substage, once she is stable?',answer:'Renal: azotemic, USG 1.016 (below 1.035), no extra-renal confounder, and small irregular kidneys. Stage 3 by creatinine (2.9–5.0) and by SDMA (26–38). Borderline proteinuric (UPC 0.2–0.4). Hypertensive (160–179, moderate TOD risk). Rehydrate and confirm stability before formal staging.'},
    {label:'Management',content:'The owner wants to know what will help Pepper most and what to expect.',question:'Outline your treatment plan, with targets.',answer:'1. Renal diet (wet if possible), which has the strongest survival evidence. Phosphate target 2.7–5.0 mg/dL for stage 3, adding a phosphate binder if needed. 2. Potassium gluconate for hypokalemia. 3. Amlodipine for SBP ≥160, targeting <160. Do a fundic exam. 4. Antiemetic (maropitant) and appetite support (mirtazapine or capromorelin). 5. SC fluids if chronically dehydrated. 6. Recheck UPC in about 2 months, and creatinine, phosphate, K, BP, and PCV in 2–4 weeks. Consider an ESA if anemia worsens. Prognosis: months to a few years, depending on how fast she progresses and how much proteinuria she develops.'},
  ]},
  {title:'The Straining Tomcat',tags:['Urethral obstruction','Hyperkalemia'],steps:[
    {label:'Signalment & History',content:'Milo, a 4-year-old male neutered indoor DSH, has been in and out of the litter box for 24 h producing nothing. He vomited twice this morning and is now lying in his carrier.',question:'What is your immediate concern, and what do you do in the first 5 minutes?',answer:'Urethral obstruction with hyperkalemia and uremia. Palpate the bladder (large, firm, painful). Place an IV catheter. Run a stat K⁺, iCa, venous gas, BUN/creatinine, and an ECG. Give opioid analgesia (e.g., buprenorphine or methadone).'},
    {label:'Stabilization',content:'HR 130, T 97.2°F. ECG: no P waves, wide QRS. K⁺ 9.1 mEq/L, iCa 0.9 mmol/L, pH 7.08.',question:'Order your emergency treatments and explain why each one is there.',answer:'1. 10% calcium gluconate 0.5–1.5 mL/kg IV slowly on ECG, for cardioprotection (it does not lower K⁺). 2. Regular insulin 0.25–0.5 U/kg IV + dextrose, followed by dextrose in fluids, to shift K⁺ into cells. 3. IV isotonic crystalloid (balanced solution acceptable). 4. Decompressive cystocentesis to relieve pressure while you prepare. 5. Once stable, sedate and catheterize. Warm him actively, and treat the bradycardia by treating the K⁺.'},
    {label:'After relief',content:'He is catheterized. Over the next 6 h he produces 6 mL/kg/h of urine. The next morning K⁺ is 2.9 mEq/L.',question:'What is happening, and how do you manage it and prevent recurrence?',answer:'Post-obstructive diuresis (>2 mL/kg/h) with hypokalemia. Measure ins and outs every 4–6 h, match fluids to output and taper gradually, and supplement KCl (no faster than 0.5 mEq/kg/h). Catheter for 24–72 h, then monitor for re-obstruction. Prevention: likely FIC, so wet food, more water, MEMO and stress reduction, analgesia, and ± prazosin. Discuss perineal urethrostomy if he obstructs again.'},
  ]},
  {title:'The Lily-Chewing Cat',tags:['AKI','Nephrotoxin'],steps:[
    {label:'History',content:'Luna, a 2-year-old female spayed Siamese, was found chewing a bouquet of stargazer lilies about 4 hours ago. She has vomited once. She is otherwise bright.',question:'Why is this an emergency even though she looks well, and what do you do now?',answer:'Every part of Lilium and Hemerocallis lilies, including pollen and vase water, causes acute tubular necrosis in cats. AKI develops over 24–72 h. Outcomes are good if decontamination and IV fluids start early (ideally within 18 h). Induce emesis if it has been less than about 1–2 h and she is not already vomiting, give activated charcoal, wash pollen off the coat, and get baseline creatinine, K⁺, and a UA.'},
    {label:'Hospitalization',content:'She receives IV fluids at about 2–3 times maintenance. At 36 h, creatinine has risen from 1.3 to 2.1 mg/dL, and UOP is 0.6 mL/kg/h despite euvolemia. Granular casts are present.',question:'Give her IRIS AKI grade and subgrade. What do you do next?',answer:'Grade II (1.7–2.5 mg/dL), oliguric (<1 mL/kg/h). Reduce fluids to avoid volume overload (weigh q6–12h). Try furosemide. Monitor K⁺ and acid–base. Refer early for hemodialysis or peritoneal dialysis if oligo-anuria persists, because cats with lily-induced anuria rarely survive without it.'},
  ]},
  {title:'The Wether with a Wet Belly',tags:['Large animal','Urolithiasis'],steps:[
    {label:'Signalment & History',content:'Buddy, a 2-year-old castrated Nigerian Dwarf pet goat, has been straining to urinate, vocalizing, and flagging his tail for a day. He eats a sweet-feed grain mix daily plus grass hay.',question:'Top differential, the obstruction sites to check, and the ration risk factor?',answer:'Obstructive urolithiasis. Check the urethral process (most common site in small ruminants) and the distal sigmoid flexure. The grain-heavy ration is high in phosphorus with a low Ca:P ratio, which predisposes to struvite and calcium phosphate stones. Early castration reduces urethral diameter.'},
    {label:'Diagnostics',content:'The urethral process is gritty and dark. Ultrasound shows a markedly distended bladder with no free fluid. BUN and creatinine are moderately increased. K⁺ is 5.9 mEq/L.',question:'What is your treatment plan, and what is the best long-term surgical option?',answer:'Stabilize first: IV fluids, analgesia, and correction of the K⁺. Under sedation, amputate the urethral process, which may restore flow but often fails because stones sit higher up. For the best long-term outcome in a pet goat, place a tube cystotomy (with normograde/retrograde flushing). Perineal urethrostomy is a salvage option with a high stricture rate. Free abdominal fluid or ventral SC swelling would indicate rupture.'},
    {label:'Prevention',content:'The owner has two more wethers at home on the same diet.',question:'What dietary changes do you recommend?',answer:'Cut out or sharply reduce grain and feed mostly grass hay. Bring the Ca:P ratio to about 2:1. Add ammonium chloride to acidify the urine (monitor urine pH). Add salt to encourage drinking, and provide clean, unfrozen water. Avoid alfalfa-heavy diets in herds with calcium carbonate stones.'},
  ]},
  {title:'The Pot-Bellied Colt',tags:['Equine neonate','Uroperitoneum'],steps:[
    {label:'History & Exam',content:'A 3-day-old Quarter Horse colt has had progressive abdominal distension, frequent posturing to urinate with small volumes, and lethargy since yesterday. The foaling was unassisted. The umbilicus looks dry.',question:'Top differentials, and what tests confirm your leading one?',answer:'1. Uroperitoneum (ruptured bladder; colts at 2–4 days are classic). 2. Meconium impaction. 3. Enteritis or ileus. 4. Urachal rupture with sepsis. Confirm with abdominal ultrasound (free anechoic fluid, possibly a collapsed bladder) and an abdominocentesis: peritoneal:serum creatinine ≥2:1. Also check IgG and run a sepsis screen.'},
    {label:'Labs',content:'Na 118, Cl 80, K 7.6 mEq/L, creatinine 6.2 mg/dL. Peritoneal creatinine 15.1 mg/dL.',question:'Explain the electrolyte pattern. What do you do before surgery?',answer:'Urine is low in Na and Cl and high in K and creatinine. Those solutes equilibrate across the peritoneum, so the foal becomes hyponatremic, hypochloremic, hyperkalemic, and azotemic. Peritoneal:serum creatinine is 2.4:1, which confirms the diagnosis. Before anesthesia: slowly drain the abdomen with a peritoneal catheter, give 0.9% NaCl with dextrose (± insulin, calcium gluconate if there are ECG changes), and aim for K⁺ below about 5.5 mEq/L to prevent arrhythmias under anesthesia. Then perform surgical cystorrhaphy. Treat failure of passive transfer and sepsis if present.'},
  ]},
];
let caseState={idx:0,step:0,revealed:[]};
function renderCases(){
  const cas=CASES[caseState.idx],step=cas.steps[caseState.step],rev=(caseState.revealed[caseState.idx]||[])[caseState.step];
  const selBtns=CASES.map((c,i)=>`<button class="case-selbtn${caseState.idx===i?' active':''}" onclick="caseSelect(${i})">${c.title}</button>`).join('');
  const stepDots=cas.steps.map((_,i)=>{const d=(caseState.revealed[caseState.idx]||[])[i];return `<div class="cstep${d?' done':''}${i===caseState.step?' active':''}" onclick="caseGo(${i})" title="Step ${i+1}"></div>`;}).join('');
  $('main').innerHTML=`
<div class="sh"><h2>Clinical cases</h2><p>Work through each case step by step. Write your answer before revealing the model answer.</p></div>
<div class="case-selbar">${selBtns}</div>
<div class="case-steps-row">${stepDots}<span style="font-size:12px;color:var(--text-hint);margin-left:4px">Step ${caseState.step+1} of ${cas.steps.length}</span></div>
<div class="case-card"><div class="case-banner"><h3>${cas.title}</h3><p>${cas.tags.map(t=>`<span class="badge b-accent" style="margin-right:4px">${t}</span>`).join('')}</p></div>
<div class="case-body"><div style="margin-bottom:12px"><div class="case-step-lbl">${step.label}</div><div class="case-text">${step.content}</div></div>
<div class="case-step-lbl">Your answer</div><textarea class="case-textarea" id="case-ta" placeholder="Write your answer before revealing…" rows="3"></textarea>
<div style="margin-top:4px"><button class="case-btn primary" onclick="caseReveal()">Reveal model answer</button>
${caseState.step>0?`<button class="case-btn" onclick="caseBack()">← Back</button>`:''}
${caseState.step<cas.steps.length-1?`<button class="case-btn" onclick="caseNext()" ${!rev?'disabled style="opacity:.45"':''}>Next step →</button>`:''}</div>
<div class="case-reveal-box${rev?' show':''}"><div class="case-reveal-lbl">Model answer</div><div class="case-reveal-text">${step.answer}</div></div></div></div>`;
}
function caseSelect(i){caseState.idx=i;caseState.step=0;renderCases();}
function caseGo(i){if(i<=caseState.step||(caseState.revealed[caseState.idx]||[])[i]){caseState.step=i;renderCases();}}
function caseReveal(){if(!caseState.revealed[caseState.idx])caseState.revealed[caseState.idx]=[];caseState.revealed[caseState.idx][caseState.step]=true;renderCases();}
function caseNext(){if(caseState.step<CASES[caseState.idx].steps.length-1){caseState.step++;renderCases();}}
function caseBack(){if(caseState.step>0){caseState.step--;renderCases();}}
