<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vet Nephrology — Interactive Renal Tutor | desmoVet</title>
<meta name="description" content="Interactive veterinary nephrology tutor: IRIS CKD staging and AKI grading calculators, azotemia localizer, hyperkalemia ECG, urolith finder, and large animal renal disease.">
<link rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2eb;--surface:#faf8f3;--surface2:#ede9df;--surface3:#e4e0d5;
  --border:#d4cfc4;--border-light:#e8e4da;
  --text:#1a1714;--text-muted:#6b6560;--text-hint:#9c9590;
  --accent:#6b2d3e;--accent-light:#f6ebee;--accent-mid:#9a4b5f;--accent-dark:#4a1d2a;
  --umn:#1d3a5f;--umn-bg:#e8f0f8;--umn-border:#b8d0e8;
  --lmn:#6b2020;--lmn-bg:#f8eaea;--lmn-border:#e8b4b4;
  --warn:#7a4a0a;--warn-bg:#fdf3e3;--warn-border:#f0c880;
  --danger:#8b1a1a;--danger-bg:#fdeaea;--danger-border:#e8b4b4;
  --success:#1a4d2e;--success-bg:#e8f5ee;--success-border:#9ecfb0;
  --info:#1a3a5c;--info-bg:#e8f0f8;--info-border:#b8d0e8;
  --purple:#3d2b6b;--purple-bg:#eeebf8;
  --r:6px;--rl:10px;--rxl:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Instrument Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;gap:0;background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;height:52px;position:sticky;top:0;z-index:200}
.topbar-brand{font-family:'DM Serif Display',serif;font-size:16px;margin-right:1.5rem;white-space:nowrap;cursor:pointer;color:var(--text)}
.topbar-brand:hover{color:var(--accent)}
.back-desmovet{font-family:'DM Mono',monospace;font-size:12px;color:var(--text-muted);text-decoration:none;padding:6px 10px;border:1px solid var(--border);border-radius:6px;white-space:nowrap;margin-right:.75rem}
.back-desmovet:hover{color:var(--accent);border-color:var(--accent)}
.mode-tabs{display:flex;gap:3px}
.mtab{padding:6px 14px;border-radius:var(--r);border:none;background:transparent;cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text-muted);transition:all .15s}
.mtab:hover{background:var(--surface2);color:var(--text)}
.mtab.active{background:var(--accent);color:#fff}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.score-pill{font-family:'DM Mono',monospace;font-size:12px;color:var(--text-muted);background:var(--surface2);padding:4px 12px;border-radius:var(--r);border:1px solid var(--border-light)}

/* ── LAYOUT ── */
.app-body{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:210px;min-width:210px;background:var(--surface);border-right:1px solid var(--border);padding:.75rem 0;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;flex-shrink:0}
.main{flex:1;padding:2rem 2.5rem;overflow-y:auto}
.nav-label{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--text-hint);padding:0 1.25rem;margin:10px 0 4px;text-transform:uppercase}
.nav-btn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 1.25rem;border:none;background:transparent;cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:13px;color:var(--text-muted);text-align:left;transition:all .15s;border-left:2px solid transparent}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{background:var(--accent-light);color:var(--accent);font-weight:500;border-left-color:var(--accent)}
.nav-icon{font-size:13px;width:16px;flex-shrink:0}
.tool-badge{margin-left:auto;font-size:9px;font-weight:600;letter-spacing:.06em;padding:1px 5px;border-radius:3px;background:var(--warn-bg);color:var(--warn);text-transform:uppercase}

/* ── SHARED ── */
.section{display:none;animation:fadeIn .18s ease}
.section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.sh{margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border-light)}
.sh h2{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:3px}
.sh p{font-size:13px;color:var(--text-muted)}
.card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--rl);padding:1.25rem;margin-bottom:14px}
.card-title{font-size:13px;font-weight:600;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:7px 10px;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--text-hint);border-bottom:1px solid var(--border);background:var(--surface2)}
td{padding:7px 10px;border-bottom:1px solid var(--border-light);font-size:13px;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;font-family:'DM Mono',monospace;white-space:nowrap}
.b-umn{background:var(--umn-bg);color:var(--umn)} .b-lmn{background:var(--lmn-bg);color:var(--lmn)}
.b-norm{background:var(--success-bg);color:var(--success)} .b-warn{background:var(--warn-bg);color:var(--warn)}
.b-danger{background:var(--danger-bg);color:var(--danger)} .b-info{background:var(--info-bg);color:var(--info)}
.b-success{background:var(--success-bg);color:var(--success)} .b-accent{background:var(--accent-light);color:var(--accent)}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--border-light);font-size:13px;gap:8px}
.kv:last-child{border-bottom:none}
.kv-key{color:var(--text-muted);flex-shrink:0}
.sep{height:1px;background:var(--border-light);margin:10px 0}
.warn-box{background:var(--danger-bg);border:1px solid var(--danger-border);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--danger);margin:10px 0;font-weight:500}
.info-box{background:var(--accent-light);border:1px solid #e3c3cb;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--accent);margin:10px 0}
.pill-chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.arr{color:var(--text-hint);font-size:12px}
.drug-row{padding:10px 0;border-bottom:1px solid var(--border-light)}
.drug-row:last-child{border-bottom:none}
.drug-name{font-weight:600;font-size:13px;margin-bottom:3px}
.drug-note{font-size:12px;color:var(--text-muted)}
.drug-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.cn-num{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;color:var(--text-hint)}

/* ── HOMEPAGE ── */
.home-hero{padding:3rem 0 2rem;max-width:820px}
.home-hero h1{font-family:'DM Serif Display',serif;font-size:42px;line-height:1.15;margin-bottom:10px;color:var(--text)}
.home-hero h1 em{font-style:italic;color:var(--accent-mid)}
.home-hero p{font-size:15px;color:var(--text-muted);max-width:560px;line-height:1.7;margin-bottom:2rem}
.home-stats{display:flex;gap:2rem;margin-bottom:2.5rem}
.home-stat{text-align:center}
.home-stat .n{font-family:'DM Serif Display',serif;font-size:32px;color:var(--accent)}
.home-stat .l{font-size:12px;color:var(--text-hint);margin-top:2px}
.home-section-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-hint);margin-bottom:12px}
.home-tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:2.5rem}
.home-card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--rl);padding:1.25rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.home-card:hover{border-color:var(--accent-mid);transform:translateY(-1px);box-shadow:0 4px 16px rgba(107,45,62,.10)}
.home-card .hc-icon{font-size:22px;margin-bottom:10px}
.home-card .hc-title{font-size:14px;font-weight:600;margin-bottom:4px}
.home-card .hc-desc{font-size:12px;color:var(--text-muted);line-height:1.5}
.home-card .hc-tag{position:absolute;top:10px;right:10px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;letter-spacing:.04em}
.hc-tag-tool{background:var(--accent-light);color:var(--accent)}
.hc-tag-ref{background:var(--surface2);color:var(--text-hint)}
.hc-tag-new{background:var(--warn-bg);color:var(--warn)}
.home-topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:2.5rem}
.topic-chip{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--r);padding:10px 14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.topic-chip:hover{background:var(--accent-light);border-color:var(--accent-mid);color:var(--accent)}
.topic-chip .tc-icon{font-size:15px}
.progress-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--border-light)}
.progress-row:last-child{border-bottom:none}
.progress-bar{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease}
.progress-label{font-size:12px;font-family:'DM Mono',monospace;color:var(--text-hint);min-width:36px;text-align:right}

/* ── INTERACTIVE TOOLS ── */

/* Spinal cord localizer */
.sc-wrap{max-width:760px}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px}
.sc-diagram{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--rl);overflow:hidden}
.sc-diagram-title{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-hint);padding:10px 14px;border-bottom:1px solid var(--border-light)}
.sc-segments{padding:8px}
.sc-seg{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);cursor:pointer;transition:all .15s;margin-bottom:3px;border:1.5px solid transparent}
.sc-seg:hover{background:var(--surface2)}
.sc-seg.selected{border-color:var(--accent-mid);background:var(--accent-light)}
.sc-seg-label{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;min-width:48px;color:var(--text-muted)}
.sc-seg-bar{flex:1;height:8px;border-radius:4px}
.sc-seg-bar.c1c5{background:linear-gradient(90deg,var(--umn-bg),#b8d0e8)}
.sc-seg-bar.c6t2{background:linear-gradient(90deg,var(--lmn-bg),#e8b4b4)}
.sc-seg-bar.t3l3{background:linear-gradient(90deg,var(--surface2),var(--umn-bg))}
.sc-seg-bar.l4s3{background:linear-gradient(90deg,var(--surface2),var(--lmn-bg))}
.sc-result{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--rl);padding:1.25rem}
.sc-result-title{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-hint);margin-bottom:12px}
.sc-limb-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sc-limb{border-radius:var(--r);padding:12px;text-align:center}
.sc-limb-name{font-size:11px;color:var(--text-hint);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sc-limb-val{font-size:15px;font-weight:600}
.sc-limb.umn{background:var(--umn-bg);border:1px solid var(--umn-border)}
.sc-limb.umn .sc-limb-val{color:var(--umn)}
.sc-limb.lmn{background:var(--lmn-bg);border:1px solid var(--lmn-border)}
.sc-limb.lmn .sc-limb-val{color:var(--lmn)}
.sc-limb.normal{background:var(--success-bg);border:1px solid var(--success-border)}
.sc-limb.normal .sc-limb-val{color:var(--success)}
.sc-notes{font-size:12.5px;color:var(--text-muted);line-height:1.6}
.sc-notes strong{color:var(--text);font-weight:600}
.sc-quiz-wrap{margin-top:16px}
.sc-quiz-q{font-size:14px;font-weight:500;margin-bottom:10px;padding:12px 14px;background:var(--surface2);border-radius:var(--r)}
.sc-quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc-quiz-opt{padding:9px 14px;border-radius:var(--r);border:1.5px solid var(--border-light);background:var(--surface);cursor:pointer;font-size:13px;font-family:'Instrument Sans',sans-serif;font-weight:500;transition:all .15s;text-align:left}
.sc-quiz-opt:hover:not([disabled]){background:var(--surface2)}
.sc-quiz-opt.correct{background:var(--success-bg);border-color:var(--success-border);color:var(--success)}
.sc-quiz-opt.wrong{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}
.sc-quiz-opt.reveal{background:var(--success-bg);border-color:var(--success-border);color:var(--success)}

/* Vestibular decision tool */
.vd-wrap{max-width:760px}
.vd-finder{background:var(--surface);border:1.5px solid var(--border-light);border-radius:var(--rl);overflow:hidden;margin-bottom:16px}
.vd-finder-header{background:var(--accent);padding:14px 18px;color:#fff}
.vd-finder-header h3{font-size:15px;font-weight:600;margin-bottom:2px}
.vd-finder-header p{font-size:12px;opacity:.8}
.vd-questions{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.vd-q{font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px}
.vd-opts{display:flex;gap:8px;flex-wrap:wrap}
.vd-opt{padding:7px 16px;border-radius:var(--r);border:1.5px solid var(--border-light);background:var(--surface);cursor:pointer;font-size:13px;font-family:'Instrument Sans',sans-serif;transition:all .15s}
.vd-opt:hover{background:var(--surface2)}
.vd-opt.selected{border-color:var(--accent-mid);background:var(--accent-light);color:var(--accent);font-weight:500}
.vd-result{padding:14px 18px;border-top:1px solid var(--border-light);background:var(--surface2)}
.vd-result-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.vd-result-name{font-size:18px;font-weight:600;font-family:'DM Serif Display',serif;margin-bottom:4px}
.vd-result-desc{font-size:13px;color:var(--text-muted);line-height:1.6}

/* ASM table tool */
.asm-wrap{max-width:780px}
.asm-filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.asm-filter-label{font-size:12px;color:var(--text-muted);margin-right:4px}
.asm-filter-btn{padding:5px 12px;border-radius:var(--r);border:1px solid var(--border-light);background:var(--surface);cursor:pointer;font-size:12px;font-family:'Instrument Sans',sans-serif;transition:all .15s;color:var(--text-muted)}
.asm-filter-btn:hover{background:var(--surface2)}
.asm-filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.asm-table-wrap{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--rl);overflow:hidden}
.asm-row{display:grid;grid-template-columns:140px 80px 90px 90px 1fr;border-bottom:1px solid var(--border-light);transition:background .15s;align-items:center}
.asm-row:last-child{border-bottom:none}
.asm-row:hover{background:var(--surface2)}
.asm-row.header{background:var(--surface2);font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--text-hint)}
.asm-cell{padding:9px 12px;font-size:13px}
.asm-row.header .asm-cell{padding:7px 12px}
.asm-drug-name{font-weight:600}
.asm-row.faded{opacity:.3}
.asm-row.highlight{background:var(--accent-light)}
.no-cats-tag{font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;background:var(--danger-bg);color:var(--danger);margin-left:6px;font-family:'DM Mono',monospace}
.liver-tag{font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;background:var(--warn-bg);color:var(--warn);margin-left:6px;font-family:'DM Mono',monospace}

/* Fill-in table */
.fit-wrap{max-width:760px}
.fit-table{width:100%;border-collapse:collapse;border:1px solid var(--border-light);border-radius:var(--rl);overflow:hidden}
.fit-table th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--text-hint);background:var(--surface2);border-bottom:1px solid var(--border)}
.fit-table td{padding:7px 10px;border-bottom:1px solid var(--border-light);font-size:13px;vertical-align:middle}
.fit-table tr:last-child td{border-bottom:none}
.fit-input{border:1.5px dashed var(--border);border-radius:4px;padding:4px 8px;font-size:12px;font-family:'Instrument Sans',sans-serif;background:transparent;color:var(--text);outline:none;width:100%;min-width:90px;transition:border-color .15s}
.fit-input:focus{border-color:var(--accent-mid);background:var(--accent-light)}
.fit-input.correct{border-style:solid;border-color:var(--success-border);background:var(--success-bg);color:var(--success)}
.fit-input.wrong{border-style:solid;border-color:var(--danger-border);background:var(--danger-bg);color:var(--danger)}
.fit-input.revealed{border-style:solid;border-color:var(--success-border);background:var(--success-bg);color:var(--success);font-weight:600}
.fit-actions{display:flex;gap:8px;margin-top:12px}
.fit-btn{padding:8px 18px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text-muted);transition:all .15s}
.fit-btn:hover{background:var(--surface2)}
.fit-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.fit-btn.primary:hover{background:var(--accent-mid)}
.fit-score{font-family:'DM Mono',monospace;font-size:13px;color:var(--text-muted);margin-left:auto;align-self:center}

/* Vestibular cheat table with hide/reveal */
.vct-wrap{max-width:780px}
.vct-controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.vct-ctrl-label{font-size:12px;color:var(--text-muted)}
.vct-col-btn{padding:5px 12px;border-radius:var(--r);border:1px solid var(--border-light);background:var(--surface);cursor:pointer;font-size:12px;font-family:'Instrument Sans',sans-serif;transition:all .15s;color:var(--text-muted)}
.vct-col-btn:hover{background:var(--surface2)}
.vct-col-btn.hidden-col{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}
.vct-hidden{background:var(--surface2);color:transparent;user-select:none;cursor:pointer;border-radius:3px;transition:all .2s;position:relative}
.vct-hidden::after{content:'click to reveal';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:10px;color:var(--text-hint);white-space:nowrap}
.vct-hidden.revealed{background:transparent;color:inherit;cursor:default}
.vct-hidden.revealed::after{display:none}

/* FLASHCARDS */
.fc-deckbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:1.5rem}
.fc-deckbtn{padding:6px 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:13px;color:var(--text-muted);transition:all .15s}
.fc-deckbtn:hover{background:var(--surface2)}
.fc-deckbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.fc-wrap{perspective:1200px;margin:0 auto 20px;max-width:640px;height:270px}
.fc-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1);cursor:pointer}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--rl);border:1.5px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}
.fc-front{background:var(--surface)}
.fc-back{background:var(--accent);transform:rotateY(180deg)}
.fc-lbl{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--text-hint);text-transform:uppercase;margin-bottom:10px}
.fc-q{font-size:17px;font-weight:500;line-height:1.45;color:var(--text)}
.fc-a{font-size:15px;font-weight:500;line-height:1.5;color:#fff}
.fc-hint{font-size:11.5px;color:rgba(255,255,255,.65);margin-top:8px}
.fc-ctrl{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.fc-btn{padding:8px 18px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text-muted);transition:all .15s}
.fc-btn:hover{background:var(--surface2)}
.fc-btn.got{border-color:var(--success-border);color:var(--success);background:var(--success-bg)}
.fc-btn.miss{border-color:var(--danger-border);color:var(--danger);background:var(--danger-bg)}
.fc-prog{font-family:'DM Mono',monospace;font-size:12px;color:var(--text-hint);min-width:64px;text-align:center}
.fc-stats{display:flex;gap:14px;justify-content:center;margin-top:8px;font-family:'DM Mono',monospace;font-size:12px}
.fc-click-hint{font-size:12px;color:var(--text-hint);text-align:center;margin-bottom:6px}

/* MCQ */
.mcq-deckbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:1.5rem}
.mcq-deckbtn{padding:6px 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:13px;color:var(--text-muted);transition:all .15s}
.mcq-deckbtn:hover{background:var(--surface2)}
.mcq-deckbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.mcq-card{background:var(--surface);border:1.5px solid var(--border-light);border-radius:var(--rl);padding:1.5rem;margin-bottom:14px;max-width:700px}
.mcq-qnum{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--text-hint);text-transform:uppercase;margin-bottom:8px}
.mcq-q{font-size:15px;font-weight:500;line-height:1.5;margin-bottom:1.1rem}
.mcq-opts{display:flex;flex-direction:column;gap:8px}
.mcq-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:var(--r);border:1.5px solid var(--border-light);background:var(--surface);cursor:pointer;transition:all .15s;text-align:left;font-family:'Instrument Sans',sans-serif;font-size:13px;color:var(--text);line-height:1.4}
.mcq-opt:hover:not([disabled]){background:var(--surface2);border-color:var(--border)}
.mcq-opt[disabled]{cursor:default}
.mcq-opt.correct{background:var(--success-bg);border-color:var(--success-border);color:var(--success)}
.mcq-opt.wrong{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}
.mcq-opt.reveal{background:var(--success-bg);border-color:var(--success-border);color:var(--success)}
.opt-let{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;min-width:20px;flex-shrink:0;margin-top:1px}
.mcq-exp{margin-top:12px;background:var(--info-bg);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--info);display:none;border:1px solid var(--info-border);line-height:1.5}
.mcq-exp.show{display:block}
.mcq-nav{display:flex;gap:8px;margin-top:8px;align-items:center;max-width:700px}
.mcq-nav-btn{padding:8px 18px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text-muted);transition:all .15s}
.mcq-nav-btn:hover{background:var(--surface2)}
.mcq-nav-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.mcq-counter{font-family:'DM Mono',monospace;font-size:12px;color:var(--text-hint);margin-left:auto}

/* DND */
.dnd-selbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:1.5rem}
.dnd-selbtn{padding:6px 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:13px;color:var(--text-muted);transition:all .15s}
.dnd-selbtn:hover{background:var(--surface2)}
.dnd-selbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.dnd-board{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:700px;margin-bottom:12px}
.dnd-items{display:flex;flex-direction:column;gap:8px}
.dnd-item{padding:10px 14px;border:1.5px dashed var(--border);border-radius:var(--r);font-size:13px;cursor:grab;background:var(--surface);transition:all .15s;user-select:none}
.dnd-item:hover{border-color:var(--accent-mid);background:var(--accent-light)}
.dnd-item.dragging{opacity:.35}
.dnd-zones{display:flex;flex-direction:column;gap:8px}
.dnd-zone{border:1.5px solid var(--border-light);border-radius:var(--r);background:var(--surface);transition:border-color .15s}
.dnd-zone.over{border-color:var(--accent-mid);background:var(--accent-light)}
.dnd-zone-hdr{font-size:12px;font-weight:600;padding:8px 12px;border-bottom:1px solid var(--border-light);color:var(--text-muted)}
.dnd-drop{min-height:44px;padding:6px;display:flex;flex-direction:column;gap:4px}
.dnd-pi{padding:7px 10px;border-radius:4px;font-size:12.5px;cursor:pointer}
.dnd-pi.neutral{background:var(--surface2);color:var(--text)}
.dnd-pi.correct{background:var(--success-bg);color:var(--success)}
.dnd-pi.wrong{background:var(--danger-bg);color:var(--danger)}
.dnd-actions{display:flex;gap:8px;margin-top:2px;max-width:700px}
.dnd-btn{padding:8px 18px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text-muted);transition:all .15s}
.dnd-btn:hover{background:var(--surface2)}
.dnd-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

/* CASES */
.case-selbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:1.5rem}
.case-selbtn{padding:6px 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:13px;color:var(--text-muted);transition:all .15s}
.case-selbtn:hover{background:var(--surface2)}
.case-selbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.case-card{background:var(--surface);border:1.5px solid var(--border-light);border-radius:var(--rl);overflow:hidden;max-width:760px;margin-bottom:14px}
.case-banner{padding:1rem 1.25rem;background:var(--surface2);border-bottom:1px solid var(--border-light)}
.case-banner h3{font-size:15px;font-weight:600;margin-bottom:4px}
.case-body{padding:1.25rem}
.case-step-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-hint);margin-bottom:6px}
.case-text{font-size:13px;line-height:1.7}
.case-textarea{width:100%;min-height:58px;resize:vertical;border:1.5px solid var(--border-light);border-radius:var(--r);padding:10px;font-family:'Instrument Sans',sans-serif;font-size:13px;background:var(--surface);color:var(--text);outline:none;transition:border-color .15s;margin-top:8px}
.case-textarea:focus{border-color:var(--accent-mid)}
.case-reveal-box{background:var(--accent-light);border:1px solid #e3c3cb;border-radius:var(--r);padding:12px 14px;margin-top:10px;display:none}
.case-reveal-box.show{display:block}
.case-reveal-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;margin-bottom:5px}
.case-reveal-text{font-size:13px;line-height:1.6}
.case-btn{padding:8px 16px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text-muted);transition:all .15s;margin-right:7px;margin-top:8px}
.case-btn:hover{background:var(--surface2)}
.case-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.case-steps-row{display:flex;gap:5px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.cstep{width:26px;height:5px;border-radius:3px;background:var(--border);cursor:pointer;transition:background .15s}
.cstep.done{background:var(--accent)}
.cstep.active{background:var(--accent-mid)}

/* ── LOCALIZATION TOOL ── */
.loc-wrap{max-width:960px}
.loc-tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--border-light);padding-bottom:12px}
.loc-tab{padding:7px 18px;border-radius:var(--r);border:1.5px solid var(--border-light);background:var(--surface);cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text-muted);transition:all .15s}
.loc-tab:hover{background:var(--surface2)}
.loc-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Brain section */
.brain-layout{display:grid;grid-template-columns:240px 1fr;gap:20px;margin-bottom:16px}
.brain-diagram{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--rl);overflow:hidden}
.brain-region{cursor:pointer;transition:all .2s}
.brain-region:hover rect,.brain-region:hover ellipse,.brain-region:hover path{opacity:.85}
.brain-region.active rect,.brain-region.active ellipse,.brain-region.active path{stroke-width:2.5}
.brain-panel{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--rl);padding:1.25rem;transition:all .2s}
.brain-panel-name{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:4px}
.brain-panel-sub{font-size:12px;color:var(--text-hint);margin-bottom:14px;font-family:'DM Mono',monospace}
.brain-finding-row{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border-light);font-size:13px}
.brain-finding-row:last-child{border-bottom:none}
.brain-finding-label{font-weight:500;min-width:130px;color:var(--text-muted);flex-shrink:0;font-size:12px}
.brain-finding-val{color:var(--text);line-height:1.5}
.brain-region-list{display:flex;flex-direction:column;gap:4px;padding:12px}
.brain-sel-btn{padding:8px 12px;border-radius:var(--r);border:1.5px solid var(--border-light);background:var(--surface);cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:13px;text-align:left;transition:all .15s;display:flex;align-items:center;gap:8px}
.brain-sel-btn:hover{background:var(--surface2)}
.brain-sel-btn.active{border-color:currentColor}
.brain-sel-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* Spinal section — new layout */
.spine-layout{display:grid;grid-template-columns:160px 1fr;gap:20px;align-items:start}
.spine-column{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--border-light);border-radius:var(--rl);overflow:hidden}
.spine-col-hdr{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-hint);padding:10px 14px;border-bottom:1px solid var(--border-light);background:var(--surface2)}
.spine-seg-btn{display:flex;align-items:center;gap:0;cursor:pointer;border:none;background:transparent;width:100%;transition:background .15s;padding:0;border-bottom:1px solid var(--border-light)}
.spine-seg-btn:last-child{border-bottom:none}
.spine-seg-btn:hover{background:var(--surface2)}
.spine-seg-btn.active{background:var(--accent-light)}
.spine-seg-color{width:6px;align-self:stretch;flex-shrink:0}
.spine-seg-inner{padding:10px 12px;text-align:left;flex:1}
.spine-seg-name{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--text);margin-bottom:1px}
.spine-seg-hint{font-size:11px;color:var(--text-hint)}
.spine-seg-btn.active .spine-seg-name{color:var(--accent)}
.spine-panel{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--rl);overflow:hidden}
.spine-panel-header{padding:14px 16px;border-bottom:1px solid var(--border-light)}
.spine-panel-title{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:2px}
.spine-panel-sub{font-size:12px;color:var(--text-hint);font-family:'DM Mono',monospace}
.spine-limb-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border-light)}
.spine-limb-card{border-radius:var(--r);padding:12px;text-align:center;border:1px solid transparent}
.spine-limb-card.umn{background:var(--umn-bg);border-color:var(--umn-border)}
.spine-limb-card.lmn{background:var(--lmn-bg);border-color:var(--lmn-border)}
.spine-limb-card.normal{background:var(--success-bg);border-color:var(--success-border)}
.spine-limb-name{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.spine-limb-card.umn .spine-limb-name{color:var(--umn)}
.spine-limb-card.lmn .spine-limb-name{color:var(--lmn)}
.spine-limb-card.normal .spine-limb-name{color:var(--success)}
.spine-limb-val{font-size:16px;font-weight:600}
.spine-limb-card.umn .spine-limb-val{color:var(--umn)}
.spine-limb-card.lmn .spine-limb-val{color:var(--lmn)}
.spine-limb-card.normal .spine-limb-val{color:var(--success)}
.spine-detail-rows{padding:14px 16px}
.spine-detail-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:13px;align-items:flex-start}
.spine-detail-row:last-child{border-bottom:none}
.spine-detail-label{font-size:11px;font-weight:600;color:var(--text-hint);min-width:110px;flex-shrink:0;padding-top:2px}
.spine-detail-val{color:var(--text);line-height:1.5}

/* UMN/LMN signs */
.sign-compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sign-col{border-radius:var(--rl);overflow:hidden;border:1px solid transparent}
.sign-col.umn{border-color:var(--umn-border)}
.sign-col.lmn{border-color:var(--lmn-border)}
.sign-col-hdr{padding:10px 14px;font-size:12px;font-weight:600;letter-spacing:.04em}
.sign-col.umn .sign-col-hdr{background:var(--umn-bg);color:var(--umn)}
.sign-col.lmn .sign-col-hdr{background:var(--lmn-bg);color:var(--lmn)}
.sign-col-body{background:var(--surface);padding:10px 14px}
.sign-row{font-size:13px;padding:4px 0;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;gap:8px}
.sign-row:last-child{border-bottom:none}
.sign-key{color:var(--text-muted);font-size:12px}

/* NM section */
.nm-loc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.nm-loc-card{border-radius:var(--rl);border:1.5px solid var(--border-light);background:var(--surface);cursor:pointer;transition:all .2s;overflow:hidden}
.nm-loc-card:hover{border-color:var(--accent-mid);transform:translateY(-1px)}
.nm-loc-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.nm-loc-hdr{padding:10px 12px;font-size:12px;font-weight:600;border-bottom:1px solid var(--border-light)}
.nm-loc-body{padding:10px 12px;font-size:12px;color:var(--text-muted);line-height:1.5}
.nm-panel{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--rl);overflow:hidden}
.nm-panel-hdr{padding:14px 16px;border-bottom:1px solid var(--border-light);background:var(--surface2)}
.nm-panel-title{font-family:'DM Serif Display',serif;font-size:18px;margin-bottom:2px}
.nm-panel-sub{font-size:12px;color:var(--text-hint)}
.nm-panel-body{padding:14px 16px}
.nm-feat-row{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:13px}
.nm-feat-row:last-child{border-bottom:none}
.nm-feat-label{font-size:11px;font-weight:600;color:var(--text-hint);padding-top:2px}

/* Loss order */
.loss-chain{display:flex;align-items:stretch;gap:0;margin:14px 0;border-radius:var(--rl);overflow:hidden;border:1px solid var(--border)}
.loss-step{flex:1;text-align:center;padding:12px 8px;border-right:1px solid var(--border);position:relative}
.loss-step:last-child{border-right:none}
.loss-step-n{font-family:'DM Mono',monospace;font-size:10px;font-weight:600;opacity:.6;margin-bottom:4px}
.loss-step-name{font-size:13px;font-weight:500}
.loss-step-note{font-size:11px;opacity:.7;margin-top:3px}
.loss-step.s1{background:var(--info-bg);color:var(--info)}
.loss-step.s2{background:#eef4fb;color:#1e4a7c}
.loss-step.s3{background:var(--warn-bg);color:var(--warn)}
.loss-step.s4{background:var(--danger-bg);color:var(--danger)}

/* Quiz inside localize */
.loc-quiz-wrap{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--rl);padding:1.25rem;margin-top:16px}
.loc-quiz-q{font-size:14px;font-weight:500;padding:12px 14px;background:var(--surface2);border-radius:var(--r);margin-bottom:12px;line-height:1.5}
.loc-quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.loc-quiz-opt{padding:9px 14px;border-radius:var(--r);border:1.5px solid var(--border-light);background:var(--surface);cursor:pointer;font-size:13px;font-family:'Instrument Sans',sans-serif;font-weight:500;transition:all .15s;text-align:left}
.loc-quiz-opt:hover:not([disabled]){background:var(--surface2)}
.loc-quiz-opt.correct{background:var(--success-bg);border-color:var(--success-border);color:var(--success)}
.loc-quiz-opt.wrong{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}
.loc-quiz-opt.reveal{background:var(--success-bg);border-color:var(--success-border);color:var(--success)}
.loc-quiz-score{font-family:'DM Mono',monospace;font-size:12px;color:var(--text-hint);margin-top:10px}

@media(max-width:700px){
  .sidebar{width:160px;min-width:160px}
  .main{padding:1.25rem}
  .g2,.g3,.sc-grid,.dnd-board,.sc-quiz-opts{grid-template-columns:1fr}
  .home-tools{grid-template-columns:1fr 1fr}
  .asm-row{grid-template-columns:120px 70px 80px 80px 1fr}
  .brain-layout,.spine-layout{grid-template-columns:1fr}
  .nm-loc-grid{grid-template-columns:1fr 1fr}
  .loss-chain{flex-direction:column}
  .loss-step{border-right:none;border-bottom:1px solid var(--border)}
  .loss-step:last-child{border-bottom:none}
}
/* ── RENAL TUTOR ADDITIONS ── */
.calc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-hint);margin-bottom:4px}
.field input[type=number],.field select{width:100%;padding:8px 10px;border:1.5px solid var(--border-light);border-radius:var(--r);background:var(--surface);font-family:'DM Mono',monospace;font-size:13px;color:var(--text);outline:none}
.field input:focus,.field select:focus{border-color:var(--accent-mid)}
.seg{display:inline-flex;border:1.5px solid var(--border-light);border-radius:var(--r);overflow:hidden}
.seg button{padding:7px 12px;border:none;background:var(--surface);cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:12.5px;color:var(--text-muted);border-right:1px solid var(--border-light)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff}
.chk{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:5px 0;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--accent)}
.result-card{background:var(--surface);border:1.5px solid var(--border-light);border-radius:var(--rl);overflow:hidden;margin-bottom:14px}
.result-head{background:var(--accent);color:#fff;padding:14px 18px}
.result-head .rl{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.result-head .rv{font-family:'DM Serif Display',serif;font-size:26px;line-height:1.2}
.result-head .rs{font-size:12.5px;opacity:.85}
.result-body{padding:14px 18px;font-size:13px;line-height:1.65}
.result-body ul{padding-left:18px}
.result-body li{margin-bottom:3px}
.tier{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.tier .badge{font-size:12px}
.lever-wrap{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
.lever-row{margin-bottom:12px}
.lever-row .lbl{font-size:12px;font-weight:600;margin-bottom:5px}
.arrow-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.arrow-cell{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--r);padding:10px;text-align:center}
.arrow-cell .an{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--text-hint);text-transform:uppercase}
.arrow-cell .av{font-family:'DM Mono',monospace;font-size:20px;font-weight:500}
.up{color:var(--success)} .down{color:var(--danger)} .flat{color:var(--text-hint)}
.preset-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ecg-box{background:#fffdf8;border:1px solid var(--border-light);border-radius:var(--rl);padding:8px;margin-bottom:12px;background-image:linear-gradient(rgba(200,80,80,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(200,80,80,.08) 1px,transparent 1px);background-size:16px 16px}
.range{width:100%;accent-color:var(--accent)}
.k-readout{font-family:'DM Serif Display',serif;font-size:34px;color:var(--accent)}
.disclaimer{font-size:11.5px;color:var(--text-hint);margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border-light);line-height:1.6;max-width:820px}
.src-list{font-size:12px;color:var(--text-muted);padding-left:18px;line-height:1.7}
@media(max-width:900px){.lever-wrap{grid-template-columns:1fr}.arrow-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){
  .topbar{padding:0 .75rem;gap:8px}
  .topbar-brand{display:none}

</head>
<body>

<div class="topbar">
  <div class="topbar-brand" onclick="goHome()">Vet Nephrology</div>
  <div class="mode-tabs" id="mode-tabs">
    <button class="mtab active" data-mode="home" onclick="setMode('home')">Home</button>

    <button class="mtab" data-mode="cases" onclick="setMode('cases')">Cases</button>

  </div>

  </div>
</div>

<div class="app-body">
<nav class="sidebar" id="sidebar" style="display:none"></nav>
<main class="main" id="main"></main>
</div>

<script>
// ═══════════════════════════════════════════════════════
// TOPICS + STATE
// ═══════════════════════════════════════════════════════
const TOPICS=[
  ['physiology','◐','GFR & physiology','GFR lever'],
  ['nephron','≋','Nephron & diuretics','Nephron explorer'],
  ['azotemia','⇄','Azotemia','Azotemia localizer'],
  ['ua','◌','Urinalysis','USG + sediment'],
  ['ckd','▤','CKD & IRIS staging','IRIS staging calculator'],
  ['aki','⚠','AKI & nephrotoxins','IRIS AKI grader'],
  ['uroliths','◆','Uroliths','Urolith finder'],
  ['obstruction','⊗','Obstruction & K⁺','Hyperkalemia ECG'],
  ['uroabdomen','◍','Uroabdomen','Fluid:serum ratio calc'],
  ['largeanimal','🐄','Large animal','Large animal fill-in'],
];
let mode='home', topic='physiology';
let gScore={c:0,t:0};
function addScore(c,t){gScore.c+=c;gScore.t+=t;document.getElementById('score-pill').textContent=`Score: ${gScore.c} / ${gScore.t}`;}
const $=id=>document.getElementById(id);
const num=id=>{const el=$(id);if(!el||el.value==='')return null;const v=parseFloat(el.value);return isNaN(v)?null:v;};

// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════
function renderSidebar(){
  $('sidebar').innerHTML=`<div class="nav-label">Topics</div>`+TOPICS.map(([k,ic,lb])=>
    `<button class="nav-btn${topic===k?' active':''}" onclick="showTopic('${k}')"><span class="nav-icon">${ic}</span>${lb}</button>`).join('');
}
function goHome(){setMode('home')}
function setMode(m){
  mode=m;
  document.querySelectorAll('.mtab').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  $('sidebar').style.display=(m==='reference'||m==='tools')?'':'none';
  renderSidebar();render();window.scrollTo(0,0);
}
function showTopic(t){topic=t;renderSidebar();render();}
function goTool(t){topic=t;setMode('tools');}
function goRef(t){topic=t;setMode('reference');}
function render(){
  const m=$('main');
  if(mode==='home') m.innerHTML=renderHome();
  else if(mode==='tools') m.innerHTML=renderTool(topic);
  else if(mode==='reference') m.innerHTML=(REF[topic]||REF.physiology)+`<div style="margin-top:14px"><button class="fit-btn primary" onclick="goTool('${topic}')">Open the interactive tool →</button></div>`;
  else if(mode==='flashcards'){renderFlashcards();return;}
  else if(mode==='quiz'){renderQuiz();return;}
  else if(mode==='match'){renderDnD();return;}
  else if(mode==='cases'){renderCases();return;}
  if(mode==='tools'&&TOOL_INIT[topic])TOOL_INIT[topic]();
}

// ═══════════════════════════════════════════════════════
// HOME
// ═══════════════════════════════════════════════════════
function renderHome(){
  const nQ=Object.values(MCQ_BANKS).reduce((a,b)=>a+b.questions.length,0);
  const nF=Object.values(FC_DECKS).reduce((a,b)=>a+b.cards.length,0);
  const cards=[
    ['ckd','▤','IRIS staging calculator','Creatinine, SDMA, UPC, and blood pressure in, stage, substage, and stage-specific management out.'],
    ['azotemia','⇄','Azotemia localizer','Pre-renal, renal, or post-renal? Works through USG, hydration, and the extra-renal reasons urine stays dilute.'],
    ['obstruction','⊗','Hyperkalemia ECG','Drag serum K⁺ and watch the ECG change: peaked T waves, then lost P waves, then a sine wave. Shows the treatment for each level.'],
    ['physiology','◐','GFR lever','Constrict or dilate the afferent and efferent arterioles and see what happens to RPF, P<sub>GC</sub>, GFR, and FF. Includes the NSAID + ACEi case.'],
    ['uroliths','◆','Urolith finder','Filter dog and cat stones by urine pH, radiopacity, and whether diet can dissolve them.'],
    ['aki','⚠','IRIS AKI grader','Grade I–V, oliguric subgrade, and when to think about dialysis.'],
    ['uroabdomen','◍','Uroabdomen ratios','Abdominal fluid:serum creatinine and K⁺ ratios for dogs, cats, and foals.'],
    ['largeanimal','🐄','Large animal renal','Ruminant urolithiasis, foal uroperitoneum, equine CKD hypercalcemia, and nephrotoxic plants.'],
  ];
  return `
<div class="home-hero">
  <h1>Veterinary<br><em>Nephrology</em></h1>
  <p>A day-one guide to kidneys and the urinary tract for vet students and new grads. It covers small and large animal patients, with interactive calculators, flashcards, board-style questions, and step-by-step cases.</p>
  <div class="home-stats">
    <div class="home-stat"><div class="n">${TOPICS.length}</div><div class="l">topics</div></div>
    <div class="home-stat"><div class="n">${TOPICS.length}</div><div class="l">interactive tools</div></div>
    <div class="home-stat"><div class="n">${CASES.length}</div><div class="l">clinical cases</div></div>
    <div class="home-stat"><div class="n">${nQ}</div><div class="l">practice questions</div></div>
    <div class="home-stat"><div class="n">${nF}</div><div class="l">flashcards</div></div>
  </div>
  <div class="home-section-label">Interactive tools</div>
  <div class="home-tools">
    ${cards.map(([t,ic,ti,de])=>`<div class="home-card" onclick="goTool('${t}')"><div class="hc-icon">${ic}</div><div class="hc-tag hc-tag-tool">Interactive</div><div class="hc-title">${ti}</div><div class="hc-desc">${de}</div></div>`).join('')}
  </div>
  <div class="home-section-label">Study modes</div>
  <div class="home-tools">
    <div class="home-card" onclick="setMode('flashcards')"><div class="hc-icon">🃏</div><div class="hc-tag hc-tag-ref">Study</div><div class="hc-title">Flashcards</div><div class="hc-desc">${Object.keys(FC_DECKS).length} decks, with Got it / Missed tracking.</div></div>
    <div class="home-card" onclick="setMode('quiz')"><div class="hc-icon">✏️</div><div class="hc-tag hc-tag-ref">Study</div><div class="hc-title">Board-style quiz</div><div class="hc-desc">Case-based MCQs with explanations, in ${Object.keys(MCQ_BANKS).length} banks.</div></div>
    <div class="home-card" onclick="setMode('match')"><div class="hc-icon">🧩</div><div class="hc-tag hc-tag-ref">Study</div><div class="hc-title">Drag & match</div><div class="hc-desc">Match diuretics to segments, stones to features, and azotemia to its cause.</div></div>
    <div class="home-card" onclick="setMode('cases')"><div class="hc-icon">🩺</div><div class="hc-tag hc-tag-new">New</div><div class="hc-title">Clinical cases</div><div class="hc-desc">${CASES.length} step-by-step cases: a CKD cat, a blocked tom, a lily-toxic cat, a wether goat, and a foal with uroperitoneum.</div></div>
  </div>
  <div class="home-section-label">Browse reference by topic</div>
  <div class="home-topics">
    ${TOPICS.map(([t,ic,lb])=>`<div class="topic-chip" onclick="goRef('${t}')"><span class="tc-icon">${ic}</span>${lb}</div>`).join('')}
  </div>
  <div class="home-section-label">Key sources</div>
  <ul class="src-list">
    <li>International Renal Interest Society (IRIS): CKD staging, treatment recommendations, and AKI grading. <a href="https://www.iris-kidney.com" target="_blank" rel="noopener">iris-kidney.com</a></li>
    <li>Lulich JP et al. ACVIM consensus recommendations on the treatment and prevention of uroliths in dogs and cats. <em>JVIM</em> 2016.</li>
    <li>Acierno MJ et al. ACVIM consensus statement on systemic hypertension in dogs and cats. <em>JVIM</em> 2018.</li>
    <li>Sykes JE et al. 2023 updated ACVIM consensus statement on leptospirosis in dogs. <em>JVIM</em> 2023.</li>
    <li>Smith BP, <em>Large Animal Internal Medicine</em>; Reed, Bayly &amp; Sellon, <em>Equine Internal Medicine</em>; Ettinger &amp; Feldman, <em>Textbook of Veterinary Internal Medicine</em>.</li>
  </ul>
  <div class="disclaimer">This is an educational resource. It does not replace clinical judgment, a current formulary, or the latest IRIS and ACVIM guidance. Check every drug dose before you use it in a patient. Cutoffs follow IRIS guidance current as of 2026.</div>
</div>`;
}

// ═══════════════════════════════════════════════════════
// TOOL ROUTER
// ═══════════════════════════════════════════════════════
const TOOL_RENDER={
  physiology:()=>renderGFRTool(), nephron:()=>renderNephronTool(), azotemia:()=>renderAzoTool(),
  ua:()=>renderUATool(), ckd:()=>renderIRISTool(), aki:()=>renderAKITool(), uroliths:()=>renderStoneTool(),
  obstruction:()=>renderKTool(), uroabdomen:()=>renderUroabdTool(), largeanimal:()=>renderLATool(),
};
const TOOL_INIT={
  physiology:()=>gfrUpdate(), nephron:()=>nephSelect(nephSel), azotemia:()=>azoUpdate(), ua:()=>usgUpdate(),
  ckd:()=>irisUpdate(), aki:()=>akiUpdate(), obstruction:()=>kUpdate(), uroabdomen:()=>uaUpdate(),
};
function renderTool(t){return TOOL_RENDER[t]?TOOL_RENDER[t]():'';}
function segBtns(group,opts,cur,fn){return `<div class="seg">${opts.map(([v,l])=>`<button class="${cur===v?'on':''}" onclick="${fn}('${group}','${v}')">${l}</button>`).join('')}</div>`;}
function arrow(n){return n>=2?'<span class="up">↑↑</span>':n===1?'<span class="up">↑</span>':n===0?'<span class="flat">↔</span>':n===-1?'<span class="down">↓</span>':'<span class="down">↓↓</span>';}

// ═══════════════════════════════════════════════════════
// TOOL 1 — GFR LEVER
// ═══════════════════════════════════════════════════════
let gfr={aff:'norm',eff:'norm'};
const GFR_PRESETS=[
  ['Normal','norm','norm','Both arterioles at baseline tone. Autoregulation (myogenic response and tubuloglomerular feedback) holds GFR steady across a MAP of about 80–180 mmHg.'],
  ['Prostaglandins','dil','norm','PGE₂ and PGI₂ dilate the afferent arteriole. This matters most when perfusion is low: in a hypovolemic or CHF patient, prostaglandins are what keep GFR up.'],
  ['NSAID in hypovolemia','con','norm','The NSAID blocks prostaglandin-mediated afferent dilation. In a well-hydrated patient this does little. In hypovolemia, under anesthesia, or in CKD, GFR falls and the renal medulla and papilla become ischemic.'],
  ['Angiotensin II','norm','con','Ang II constricts the efferent arteriole more than the afferent. P<sub>GC</sub> rises and GFR is preserved even though RPF falls, so filtration fraction rises. This is the kidney defending GFR in hypovolemia.'],
  ['ACE inhibitor / ARB','norm','dil','The efferent arteriole dilates, so P<sub>GC</sub> drops. GFR falls slightly and proteinuria falls, which is the reason to use these drugs in proteinuric CKD. Expect a small rise in creatinine. A rise of more than about 30% from baseline means you should reassess.'],
  ['NSAID + ACEi ("double whammy")','con','dil','The afferent arteriole is narrowed and the efferent is open, so the glomerulus loses both of its pressure-preserving mechanisms. GFR drops sharply. Be very careful with this combination in dehydrated or anesthetized patients.'],
];
function renderGFRTool(){
  return `<div class="sh"><h2>GFR lever</h2><p>Set the tone of each arteriole and watch the glomerular hemodynamics change. The presets show common drug and disease effects.</p></div>
<div class="preset-row">${GFR_PRESETS.map((p,i)=>`<button class="asm-filter-btn" onclick="gfrPreset(${i})">${p[0]}</button>`).join('')}</div>
<div class="lever-wrap">
  <div>
    <div class="card">
      <div class="lever-row"><div class="lbl">Afferent arteriole</div>${segBtns('aff',[['con','Constrict'],['norm','Normal'],['dil','Dilate']],gfr.aff,'gfrSet')}</div>
      <div class="lever-row"><div class="lbl">Efferent arteriole</div>${segBtns('eff',[['con','Constrict'],['norm','Normal'],['dil','Dilate']],gfr.eff,'gfrSet')}</div>
    </div>
    <div class="card" id="gfr-svg"></div>
  </div>
  <div>
    <div class="arrow-grid" id="gfr-arrows"></div>
    <div class="card"><div class="card-title">What is happening</div><div id="gfr-explain" style="font-size:13px;line-height:1.65"></div></div>
    <div class="info-box"><strong>Rule of thumb:</strong> the afferent arteriole controls the flow coming in, and the efferent arteriole controls the pressure held behind the glomerulus. Changing afferent tone moves RPF and GFR in the same direction. Constricting the efferent lowers RPF but raises GFR, up to a point. Very strong efferent constriction eventually lowers GFR as well, because plasma flow becomes too slow.</div>
  </div>
</div>`;
}
function gfrSet(g,v){gfr[g]=v;$('main').innerHTML=renderGFRTool();gfrUpdate();}
function gfrPreset(i){const p=GFR_PRESETS[i];gfr={aff:p[1],eff:p[2]};$('main').innerHTML=renderGFRTool();gfrUpdate(p[3]);}
function gfrUpdate(presetNote){
  const a={con:-1,norm:0,dil:1}[gfr.aff], e={con:-1,norm:0,dil:1}[gfr.eff];
  const rpf=a+e, pgc=a-e, g=a-e, ff=-e;
  $('gfr-arrows').innerHTML=[['RPF',rpf],['P<sub>GC</sub>',pgc],['GFR',g],['FF',ff]].map(([n,v])=>`<div class="arrow-cell"><div class="an">${n}</div><div class="av">${arrow(v)}</div></div>`).join('');
  const lines=[];
  if(gfr.aff==='con')lines.push('<strong>Afferent constriction:</strong> less blood reaches the glomerulus, so RPF and P<sub>GC</sub> fall and GFR falls. Causes: NSAIDs (lost prostaglandin dilation), sympathetic tone, α-agonists, high-dose vasopressors, hypercalcemia, and cyclosporine/tacrolimus.');
  if(gfr.aff==='dil')lines.push('<strong>Afferent dilation:</strong> more flow in, so RPF and GFR rise together. Causes: prostaglandins, the myogenic response to low perfusion, and low-dose dopamine and fenoldopam (DA₁).');
  if(gfr.eff==='con')lines.push('<strong>Efferent constriction:</strong> blood backs up in the glomerulus, so P<sub>GC</sub> and GFR rise while RPF falls. Filtration fraction rises. The main mediator is angiotensin II.');
  if(gfr.eff==='dil')lines.push('<strong>Efferent dilation:</strong> pressure leaks out of the glomerulus, so P<sub>GC</sub> and GFR fall while RPF rises. Causes: ACE inhibitors (benazepril, enalapril) and ARBs (telmisartan). Lower intraglomerular pressure means less proteinuria.');
  if(!lines.length)lines.push('Baseline. Normal filtration fraction is about 20%: one-fifth of the plasma reaching the glomerulus is filtered.');
  $('gfr-explain').innerHTML=(presetNote?`<div class="warn-box" style="background:var(--accent-light);color:var(--accent-dark);border-color:var(--border)">${presetNote}</div>`:'')+lines.join('<div class="sep"></div>');
  const w={con:4,norm:9,dil:15};
  const fw=Math.max(2,6+g*4);
  $('gfr-svg').innerHTML=`<svg viewBox="0 0 300 200" width="100%" style="display:block">
    <text x="10" y="18" font-size="10" fill="#9c9590" font-family="DM Mono">AFFERENT</text>
    <text x="230" y="18" font-size="10" fill="#9c9590" font-family="DM Mono">EFFERENT</text>
    <line x1="0" y1="70" x2="128" y2="80" stroke="#b5485f" stroke-width="${w[gfr.aff]}" stroke-linecap="round"/>
    <line x1="172" y1="80" x2="300" y2="70" stroke="#7a3446" stroke-width="${w[gfr.eff]}" stroke-linecap="round"/>
    <circle cx="150" cy="85" r="48" fill="none" stroke="#d4cfc4" stroke-width="3"/>
    <circle cx="150" cy="82" r="${30+pgc*4}" fill="#f2d7dd" stroke="#b5485f" stroke-width="2"/>
    <text x="150" y="86" text-anchor="middle" font-size="11" fill="#6b2d3e" font-family="DM Mono">P<tspan baseline-shift="sub" font-size="8">GC</tspan></text>
    <line x1="150" y1="133" x2="150" y2="180" stroke="#c9a227" stroke-width="${fw}" stroke-linecap="round"/>
    <text x="160" y="175" font-size="10" fill="#7a4a0a" font-family="DM Mono">filtrate → PCT</text>
  </svg>`;
}

// ═══════════════════════════════════════════════════════
// TOOL 2 — NEPHRON & DIURETICS
// ═══════════════════════════════════════════════════════
const NEPHRON=[
  {k:'glom',name:'Glomerulus',na:'Filters ~20% of RPF',trans:'Size- and charge-selective barrier: fenestrated endothelium, GBM, and podocyte slit diaphragm',horm:'Ang II (efferent arteriole), prostaglandins (afferent)',drug:'No diuretic acts here. ACEi/ARBs lower P<sub>GC</sub>.',clin:'Glomerular disease (immune-complex GN, amyloidosis) causes proteinuria with an inactive sediment, plus hypoalbuminemia, hypercoagulability (antithrombin loss), and hypertension.'},
  {k:'pct',name:'Proximal convoluted tubule',na:'~65–70% of filtered Na⁺ and water',trans:'SGLT2 (glucose), NHE3, carbonic anhydrase, Na/K-ATPase; reabsorbs all filtered glucose and amino acids and most HCO₃⁻; PTH reduces phosphate reabsorption here',horm:'Ang II (stimulates NHE3); PTH (phosphaturia)',drug:'<strong>Acetazolamide</strong> (carbonic anhydrase inhibitor), a weak diuretic that causes metabolic acidosis. <strong>Mannitol</strong> (osmotic, PCT and descending limb). <strong>SGLT2 inhibitors</strong> (bexagliflozin, velagliflozin) for feline diabetes.',clin:'Renal glucose threshold is ~180–220 mg/dL in dogs and ~250–300 mg/dL in cats. Glucosuria with normoglycemia means a proximal tubular defect: Fanconi syndrome (Basenjis, jerky treats) or acute tubular injury.'},
  {k:'tdl',name:'Thin descending limb',na:'Water out, solute stays',trans:'Permeable to water (aquaporin-1), relatively impermeable to NaCl',horm:'None of note',drug:'None',clin:'Tubular fluid becomes concentrated as it descends into the hypertonic medulla, which is part of the countercurrent multiplier.'},
  {k:'tal',name:'Thick ascending limb (TAL)',na:'~25% of filtered Na⁺',trans:'NKCC2 (Na⁺-K⁺-2Cl⁻); ROMK recycles K⁺ and creates a lumen-positive potential that drives paracellular Ca²⁺ and Mg²⁺ reabsorption; impermeable to water (the diluting segment)',horm:'ADH (increases NKCC2 activity in some species)',drug:'<strong>Furosemide, torsemide</strong> (loop diuretics), the most potent diuretics.',clin:'Loop diuretics cause hypokalemia, hypochloremic metabolic alkalosis, hypocalcemia (calciuresis, which is why they help in hypercalcemia once the patient is volume-replete), hypomagnesemia, and volume contraction. Ototoxicity is possible at high IV doses.'},
  {k:'md',name:'Macula densa / JGA',na:'Sensor, not a transporter',trans:'Senses NaCl delivery to the distal TAL',horm:'Renin released from juxtaglomerular cells in response to ↓NaCl, ↓afferent pressure, and β₁ stimulation',drug:'β-blockers reduce renin. Loop diuretics block NKCC2 in the macula densa, so renin rises.',clin:'Tubuloglomerular feedback: high distal NaCl delivery → afferent constriction → GFR falls back toward normal.'},
  {k:'dct',name:'Distal convoluted tubule',na:'~5–8% of filtered Na⁺',trans:'NCC (Na⁺-Cl⁻ cotransporter); PTH-stimulated active Ca²⁺ reabsorption (TRPV5)',horm:'PTH, aldosterone (late DCT)',drug:'<strong>Hydrochlorothiazide, chlorothiazide</strong> (thiazides)',clin:'Thiazides lower urinary calcium, so they are used to help prevent recurrent calcium oxalate uroliths in dogs. They can cause hypokalemia and mild hypercalcemia, and paradoxically reduce urine volume in nephrogenic DI.'},
  {k:'cd',name:'Collecting duct',na:'~2–5% of filtered Na⁺, but this is where final tuning happens',trans:'Principal cells: ENaC (Na⁺ in) and ROMK (K⁺ out) under aldosterone; aquaporin-2 inserted via the ADH V₂ receptor. Intercalated cells: type A secretes H⁺, type B secretes HCO₃⁻.',horm:'Aldosterone, ADH, ANP/BNP (natriuresis)',drug:'<strong>Spironolactone</strong> (aldosterone antagonist), <strong>amiloride, triamterene</strong> (ENaC blockers). All are K⁺-sparing. Desmopressin acts at V₂.',clin:'Hypoadrenocorticism (no aldosterone) causes hyponatremia, hyperkalemia, and medullary washout, so USG is often &lt;1.030 despite pre-renal azotemia. Central DI (no ADH) and nephrogenic DI (no response to ADH) both produce hyposthenuria.'},
];
let nephSel='pct';
function renderNephronTool(){
  return `<div class="sh"><h2>Nephron explorer</h2><p>Click a segment to see what it reabsorbs, which hormones act on it, which diuretic targets it, and why that matters clinically.</p></div>
<div class="brain-layout">
  <div class="brain-diagram"><div class="brain-region-list">${NEPHRON.map(s=>`<button class="brain-sel-btn" id="nb-${s.k}" onclick="nephSelect('${s.k}')"><span class="brain-sel-dot" style="background:var(--accent-mid)"></span>${s.name}</button>`).join('')}</div></div>
  <div class="brain-panel" id="neph-panel"></div>
</div>
<div class="card"><div class="card-title">Diuretics at a glance</div><table>
<tr><th>Class</th><th>Example</th><th>Site</th><th>K⁺</th><th>Urinary Ca²⁺</th></tr>
<tr><td>Carbonic anhydrase inhibitor</td><td>Acetazolamide</td><td>PCT</td><td><span class="badge b-danger">↓</span></td><td>↔</td></tr>
<tr><td>Osmotic</td><td>Mannitol</td><td>PCT, descending limb</td><td><span class="badge b-warn">↓/↔</span></td><td>↔</td></tr>
<tr><td>Loop</td><td>Furosemide, torsemide</td><td>TAL (NKCC2)</td><td><span class="badge b-danger">↓</span></td><td><span class="badge b-info">↑</span></td></tr>
<tr><td>Thiazide</td><td>Hydrochlorothiazide</td><td>DCT (NCC)</td><td><span class="badge b-danger">↓</span></td><td><span class="badge b-success">↓</span></td></tr>
<tr><td>K⁺-sparing</td><td>Spironolactone, amiloride</td><td>Collecting duct</td><td><span class="badge b-info">↑</span></td><td>↔</td></tr>
</table></div>`;
}
function nephSelect(k){
  nephSel=k;const s=NEPHRON.find(x=>x.k===k);
  document.querySelectorAll('.brain-sel-btn').forEach(b=>{b.style.borderColor='';b.style.background='';});
  const b=$('nb-'+k);if(b){b.style.borderColor='var(--accent-mid)';b.style.background='var(--accent-light)';}

// TOOL 3 — AZOTEMIA LOCALIZER
// ═══════════════════════════════════════════════════════
const USG_ADEQ={dog:1.030,cat:1.035,horse:1.025,cattle:1.025};
const SPECIES_LBL={dog:'Dog',cat:'Cat',horse:'Horse',cattle:'Cattle / small ruminant'};
let azo={sp:'dog'};
const AZO_CONF=[
  ['addison','Hypoadrenocorticism suspected (Na:K &lt;27, no stress leukogram)','medullary washout from Na⁺ loss'],
  ['hca','Hypercalcemia','Ca²⁺ blocks ADH action and causes nephrogenic DI'],
  ['drugs','Fluids, diuretics, glucocorticoids, or mannitol before sampling','iatrogenic dilution or diuresis'],
  ['gluc','Glucosuria / diabetes mellitus','osmotic diuresis'],
  ['endo','Pyometra, pyelonephritis, or E. coli endotoxemia','endotoxin blocks ADH action'],
  ['liver','Hepatic failure / portosystemic shunt','low urea causes loss of the medullary gradient'],
  ['hac','Hyperadrenocorticism','cortisol interferes with ADH release and action'],
  ['lowna','Hyponatremia or a low-protein/low-salt diet','medullary solute washout'],
];
function renderAzoTool(){
  return `<div class="sh"><h2>Azotemia localizer</h2><p>Enter what you know about an azotemic patient. The tool works through the same logic you would use on rounds.</p></div>
<div class="card">
  <div class="calc-grid">
    <div class="field"><label>Species</label>${segBtns('sp',[['dog','Dog'],['cat','Cat'],['horse','Horse'],['cattle','Ruminant']],azo.sp,'azoSet')}</div>
    <div class="field"><label>USG (pre-fluid)</label><input type="number" id="azo-usg" step="0.001" min="1.000" max="1.080" placeholder="e.g. 1.018" oninput="azoUpdate()"></div>
    <div class="field"><label>Hydration</label><select id="azo-hyd" onchange="azoUpdate()"><option value="dehy">Clinically dehydrated</option><option value="norm">Euhydrated</option></select></div>
  </div>
  <div class="card-title" style="margin-top:6px">Post-renal clues</div>
  <label class="chk"><input type="checkbox" id="azo-obs" onchange="azoUpdate()">Stranguria/anuria with a large, firm, painful bladder (urethral obstruction)</label>
  <label class="chk"><input type="checkbox" id="azo-rup" onchange="azoUpdate()">Free abdominal fluid, small/absent bladder, or trauma (suspect uroabdomen)</label>
  <div class="card-title" style="margin-top:10px">Extra-renal reasons urine may be dilute</div>
  ${AZO_CONF.map(([k,l])=>`<label class="chk"><input type="checkbox" id="azo-${k}" onchange="azoUpdate()">${l}</label>`).join('')}
</div>
<div class="result-card" id="azo-result"></div>
<div class="card"><div class="card-title">BUN:creatinine notes</div><div style="font-size:13px;line-height:1.65">BUN rises <strong>disproportionately</strong> with GI hemorrhage, a recent high-protein meal, catabolism (fever, glucocorticoids, tetracyclines), and pre-renal states, because urea is partly reabsorbed when tubular flow is slow. BUN is <strong>relatively low</strong> with hepatic failure, PSS, PU/PD, and low-protein diets. <strong>Ruminants:</strong> urea is recycled to the rumen, so creatinine is the more reliable marker. <strong>Horses:</strong> a BUN:Cr ratio &gt;15:1 has traditionally pointed toward pre-renal or chronic disease and &lt;10:1 toward acute renal failure. Treat this as a soft clue only.</div></div>`;
}
function azoSet(g,v){azo[g]=v;const keep=$('azo-usg').value;$('main').innerHTML=renderAzoTool();$('azo-usg').value=keep;azoUpdate();}
function azoUpdate(){
  const usg=num('azo-usg'), thr=USG_ADEQ[azo.sp], hyd=$('azo-hyd').value;
  const conf=AZO_CONF.filter(([k])=>$('azo-'+k)?.checked);
  const obs=$('azo-obs').checked, rup=$('azo-rup').checked;
  let title,sub,body=[];
  if(obs||rup){
    title='Post-renal azotemia';sub=obs?'Urethral obstruction':'Suspected uroabdomen';
    body.push(obs?'Relieve the obstruction and check K⁺ and the ECG first. Post-renal azotemia usually resolves within 24–72 h of relief. If it does not, there is a concurrent renal component.':'Compare abdominal fluid creatinine and K⁺ with serum (use the Uroabdomen tool). Imaging with positive-contrast cystourethrography locates the leak.');
    body.push('USG is unreliable for localizing in post-renal azotemia. Post-renal disease can also coexist with renal or pre-renal azotemia.');
  } else if(usg===null){
    title='Enter a USG';sub=`Adequate concentration for a ${SPECIES_LBL[azo.sp].toLowerCase()}: ≥${thr.toFixed(3)}`;
    body.push('Use a sample collected <strong>before</strong> fluid therapy. The concentrating ability of an azotemic or dehydrated patient is the key test of the renal tubules.');
  } else if(usg>=thr){
    title='Pre-renal azotemia';sub=`USG ${usg.toFixed(3)} ≥ ${thr.toFixed(3)}: the tubules can still concentrate`;
    body.push('Look for reduced renal perfusion: dehydration, hypovolemia, shock, heart failure, or hypoalbuminemia. Pre-renal azotemia should resolve within 24–48 h of restoring perfusion.');
    if(azo.sp==='cat')body.push('<strong>Cat caveat:</strong> some cats with real CKD keep the ability to concentrate above 1.035. If azotemia persists after rehydration, the cat has renal disease.');
    if(hyd==='norm')body.push('The patient is euhydrated, so consider occult hypovolemia, cardiac output problems, GI hemorrhage (BUN rises disproportionately), or a high-protein meal.');
  } else if(conf.length){
    title='Cannot confirm renal azotemia yet';sub=`USG ${usg.toFixed(3)} is below ${thr.toFixed(3)}, but there is an extra-renal reason the urine may be dilute`;
    body.push('Inadequate concentration with azotemia normally means renal azotemia. Here, though, these factors can impair concentration even when the kidneys are structurally normal:');
    body.push('<ul>'+conf.map(([,l,why])=>`<li>${l}: <em>${why}</em></li>`).join('')+'</ul>');
    body.push('Correct the confounder, rehydrate, and reassess. Azotemia that resolves quickly points to pre-renal disease. Persistent azotemia confirms a renal component.');
  } else {
    title='Renal azotemia';sub=`USG ${usg.toFixed(3)} < ${thr.toFixed(3)} with azotemia, and no extra-renal explanation`;
    body.push(`About two-thirds of nephrons have lost concentrating ability${usg<1.008?'. A USG &lt;1.008 (hyposthenuria) means the tubules are actively diluting, so also consider DI, psychogenic polydipsia, hypercalcemia, and pyelonephritis':''}.`);
    body.push('Next, decide whether this is <strong>acute or chronic</strong>. Small irregular kidneys, non-regenerative anemia, weight loss, and long-standing PU/PD suggest CKD (stage it with the IRIS calculator once the patient is stable). Normal or large kidneys, active sediment or casts, glucosuria, hyperkalemia, and an acute history suggest AKI (use the AKI grader).');
    if(hyd==='dehy')body.push('The patient is also dehydrated, so a pre-renal component is likely on top of the renal one. Expect partial improvement with fluids.');
  }
  $('azo-result').innerHTML=`<div class="result-head"><div class="rl">Localization</div><div class="rv">${title}</div><div class="rs">${sub}</div></div><div class="result-body">${body.map(b=>b.startsWith('<ul')?b:`<p style="margin-bottom:8px">${b}</p>`).join('')}</div>`;
}

// TOOL 4 — URINALYSIS (USG + sediment fill-in)
// ═══════════════════════════════════════════════════════
let usgSp='dog';
const SED_ROWS=[
  ['Struvite (MgNH₄PO₄) crystals','Colorless "coffin lid" prisms','Common in alkaline urine and in refrigerated samples; can be normal. In dogs, look for a urease-producing UTI.'],
  ['Calcium oxalate dihydrate','Square "envelope" with an X','Can be normal or an in-vitro artifact. Persistent crystalluria in a CaOx-prone breed is a stone risk.'],
  ['Calcium oxalate monohydrate','"Picket fence" or dumbbell shapes','<strong>Ethylene glycol toxicosis</strong> until proven otherwise.'],
  ['Ammonium urate / ammonium biurate','Brown spheres with spicules ("thorn apple")','Portosystemic shunt or hepatic failure. Normal in Dalmatians and English Bulldogs.'],
  ['Bilirubin crystals','Fine yellow needles','A small amount is normal in dogs (especially males). Always abnormal in cats.'],
  ['Cystine crystals','Flat colorless hexagons','Always abnormal: cystinuria, an inherited PCT transport defect.'],
  ['Calcium carbonate crystals','Large spheres, radial striations, dumbbells','Normal in horses, rabbits, and goats.'],
  ['Hyaline casts','Clear, low refractility','A few are normal. Increased numbers with proteinuria, fever, or exercise.'],
  ['Granular casts','Cast containing degenerating tubular cells','<strong>Active tubular injury</strong>, an early sign of AKI (e.g., aminoglycosides). Casts can appear before azotemia.'],
  ['Waxy casts','Smooth, homogeneous, with blunt broken ends','Chronic tubular disease with stasis.'],
  ['WBC casts','Leukocytes embedded in a protein matrix','Renal origin of the inflammation: <strong>pyelonephritis</strong>.'],
];
let sedRev={};
function renderUATool(){
  return `<div class="sh"><h2>Urinalysis: USG + sediment</h2><p>Interpret a USG for each species, then test yourself on sediment findings.</p></div>
<div class="card">
  <div class="calc-grid">
    <div class="field"><label>Species</label>${segBtns('sp',[['dog','Dog'],['cat','Cat'],['horse','Horse'],['cattle','Ruminant']],usgSp,'usgSet')}</div>
    <div class="field"><label>USG</label><input type="number" id="usg-v" step="0.001" placeholder="e.g. 1.012" oninput="usgUpdate()"></div>
  </div>
  <div id="usg-out"></div>
</div>
<div class="sh" style="margin-top:1.5rem"><h2 style="font-size:20px">Sediment fill-in</h2><p>Click a grey cell to reveal it.</p></div>
<div class="card" style="padding:0"><table>
<tr><th style="width:26%">Finding</th><th style="width:30%">Appearance</th><th>Clinical significance</th></tr>
${SED_ROWS.map((r,i)=>`<tr><td><strong>${r[0]}</strong></td>${[1,2].map(c=>{const k=i+'_'+c;return `<td class="vct-hidden${sedRev[k]?' revealed':''}" onclick="sedReveal('${k}')">${r[c]}</td>`}).join('')}</tr>`).join('')}
</table></div>
<div class="fit-actions"><button class="fit-btn primary" onclick="sedAll()">Reveal all</button><button class="fit-btn" onclick="sedRev={};render()">Reset</button></div>`;
}
function usgSet(g,v){usgSp=v;const keep=$('usg-v').value;$('main').innerHTML=renderUATool();$('usg-v').value=keep;usgUpdate();}
function sedReveal(k){if(!sedRev[k]){sedRev[k]=true;render();}}
function sedAll(){SED_ROWS.forEach((_,i)=>{sedRev[i+'_1']=true;sedRev[i+'_2']=true;});render();}
function usgUpdate(){
  const v=num('usg-v'),thr=USG_ADEQ[usgSp];
  const bands=[['Hyposthenuric','&lt;1.008','b-info'],['Isosthenuric','1.008–1.012','b-warn'],['Minimally concentrated',`1.013–${(thr-0.001).toFixed(3)}`,'b-warn'],['Adequately concentrated',`≥${thr.toFixed(3)}`,'b-success']];
  let idx=null;
  if(v!==null){idx=v<1.008?0:v<=1.012?1:v<thr?2:3;}
  const notes=['The kidney is <strong>actively diluting</strong>, so some tubular function remains. Think central or nephrogenic DI, psychogenic polydipsia, hypercalcemia, hyperadrenocorticism, pyelonephritis, hepatic disease, or recent fluids.','Same osmolality as plasma: the tubules are neither concentrating nor diluting. In an azotemic patient this is the classic renal azotemia finding.','Some concentrating ability is present, but not enough for an azotemic or dehydrated patient. In an azotemic patient this still supports renal azotemia, unless there is an extra-renal confounder.','Tubular concentrating ability is intact. In an azotemic patient, azotemia with this USG is pre-renal.'];
  $('usg-out').innerHTML=`<div class="tier">${bands.map((b,i)=>`<span class="badge ${b[2]}" style="${idx===i?'outline:2px solid var(--accent);':idx!==null?'opacity:.4':''}">${b[0]} ${b[1]}</span>`).join('')}</div>
  ${idx!==null?`<div class="info-box">${notes[idx]}${usgSp==='horse'&&idx===3?' Normal equine urine is also cloudy and viscous (calcium carbonate crystals and mucus).':''}</div>`:''}`;
}

// TOOL 5 — IRIS CKD STAGING
// ═══════════════════════════════════════════════════════
let iris={sp:'dog',unit:'mg'};
const IRIS_CR={dog:[1.4,2.8,5.0],cat:[1.6,2.8,5.0]};
const IRIS_SDMA={dog:[18,35,54],cat:[18,25,38]};
const IRIS_UPC={dog:[0.2,0.5],cat:[0.2,0.4]};
const IRIS_P={1:'2.7–4.6',2:'2.7–4.6',3:'2.7–5.0',4:'2.7–6.0'};
function stageOf(v,cut,strictLow){if(v===null)return null;if(strictLow?v<cut[0]:v<cut[0])return 1;if(v<=cut[1])return 2;if(v<=cut[2])return 3;return 4;}
function renderIRISTool(){
  return `<div class="sh"><h2>IRIS CKD staging calculator</h2><p>Staging applies only to <strong>stable CKD</strong> in dogs and cats, using a fasted, well-hydrated patient sampled at least twice. It is not a way to diagnose CKD.</p></div>
<div class="card">
  <div class="calc-grid">
    <div class="field"><label>Species</label>${segBtns('sp',[['dog','Dog'],['cat','Cat']],iris.sp,'irisSet')}</div>
    <div class="field"><label>Creatinine units</label>${segBtns('unit',[['mg','mg/dL'],['um','µmol/L']],iris.unit,'irisSet')}</div>
    <div class="field"><label>Creatinine</label><input type="number" id="ir-cr" step="0.1" placeholder="${iris.unit==='mg'?'e.g. 2.4':'e.g. 210'}" oninput="irisUpdate()"></div>
    <div class="field"><label>SDMA (µg/dL)</label><input type="number" id="ir-sdma" step="1" placeholder="optional" oninput="irisUpdate()"></div>
    <div class="field"><label>UPC</label><input type="number" id="ir-upc" step="0.1" placeholder="optional" oninput="irisUpdate()"></div>
    <div class="field"><label>Systolic BP (mmHg)</label><input type="number" id="ir-bp" step="1" placeholder="optional" oninput="irisUpdate()"></div>
  </div>
  <label class="chk"><input type="checkbox" id="ir-stable" checked onchange="irisUpdate()">Stable on repeat sampling (2–4 weeks apart), fasted, hydrated, and pre- and post-renal causes ruled out</label>
</div>
<div class="result-card" id="ir-result"></div>
<div class="card" style="padding:0"><table>
<tr><th>Stage</th><th>Dog creatinine mg/dL (µmol/L)</th><th>Cat creatinine mg/dL (µmol/L)</th><th>Dog SDMA</th><th>Cat SDMA</th></tr>
<tr><td><strong>1</strong></td><td>&lt;1.4 (&lt;125)</td><td>&lt;1.6 (&lt;140)</td><td>&lt;18</td><td>&lt;18</td></tr>
<tr><td><strong>2</strong></td><td>1.4–2.8 (125–250)</td><td>1.6–2.8 (140–250)</td><td>18–35</td><td>18–25</td></tr>
<tr><td><strong>3</strong></td><td>2.9–5.0 (251–440)</td><td>2.9–5.0 (251–440)</td><td>36–54</td><td>26–38</td></tr>
<tr><td><strong>4</strong></td><td>&gt;5.0 (&gt;440)</td><td>&gt;5.0 (&gt;440)</td><td>&gt;54</td><td>&gt;38</td></tr>
</table></div>`;
}
function irisSet(g,v){
  const keep=['ir-cr','ir-sdma','ir-upc','ir-bp'].map(id=>$(id).value), st=$('ir-stable').checked;
  if(g==='unit'&&v!==iris.unit&&keep[0]!==''){const c=parseFloat(keep[0]);keep[0]=v==='um'?Math.round(c*88.4):(c/88.4).toFixed(2);}
  iris[g]=v;$('main').innerHTML=renderIRISTool();
  ['ir-cr','ir-sdma','ir-upc','ir-bp'].forEach((id,i)=>$(id).value=keep[i]);$('ir-stable').checked=st;irisUpdate();
}
function irisUpdate(){
  const sp=iris.sp; let cr=num('ir-cr'); const sdma=num('ir-sdma'),upc=num('ir-upc'),bp=num('ir-bp'),stable=$('ir-stable').checked;
  if(cr!==null&&iris.unit==='um')cr=cr/88.4;
  const out=$('ir-result');
  if(cr===null&&sdma===null){out.innerHTML=`<div class="result-head"><div class="rl">IRIS stage</div><div class="rv">Enter creatinine and/or SDMA</div><div class="rs">${sp==='dog'?'Dog':'Cat'} cutoffs are loaded</div></div>`;return;}
  const sCr=stageOf(cr!==null?Math.round(cr*10)/10:null,IRIS_CR[sp]);
  const sS=stageOf(sdma,IRIS_SDMA[sp]);
  const stage=sCr!==null?sCr:sS;
  const notes=[];
  if(!stable)notes.push(`<div class="warn-box">Staging is not appropriate yet. IRIS stages only <strong>stable</strong> CKD. If creatinine is changing quickly, treat the patient as AKI (or acute-on-chronic), rehydrate, and restage once values plateau.</div>`);
  if(sCr!==null&&sS!==null&&sS>sCr)notes.push(`<div class="info-box"><strong>SDMA stages higher than creatinine</strong> (SDMA stage ${sS}). This often happens in patients with low muscle mass, where creatinine underestimates the loss of GFR. IRIS advises considering the treatment recommendations for the higher stage (for example, SDMA ≥25 in stage 2, or ≥45 in stage 3).</div>`);
  if(sCr===1&&sdma!==null&&sdma>14)notes.push(`<div class="info-box">Creatinine is not azotemic, but a <strong>persistently</strong> elevated SDMA (&gt;14 µg/dL) supports early CKD (stage 1). Confirm on repeat testing.</div>`);
  if(stage===1)notes.push(`<div class="info-box">Stage 1 also needs <strong>another renal abnormality</strong>: inadequate concentrating ability without another cause, abnormal renal imaging or palpation, persistent renal proteinuria, abnormal biopsy, or rising creatinine/SDMA.</div>`);
  let prot='',protTx='';
  if(upc!==null){const c=IRIS_UPC[sp];prot=upc<c[0]?'Non-proteinuric (NP)':upc<=c[1]?'Borderline proteinuric (BP)':'Proteinuric (P)';
    if(upc>c[1])protTx=`<li><strong>Proteinuria (UPC &gt;${c[1]}):</strong> first confirm it is persistent and renal, with an inactive sediment and no UTI. Start a renal diet and a RAAS inhibitor (ACEi such as benazepril/enalapril, or the ARB telmisartan). Aim to reduce UPC by ≥50% or bring it below the cutoff.${sp==='dog'?' In dogs with glomerular disease, consider antithrombotic therapy (low-dose aspirin or clopidogrel).':''}</li>`;
    else if(upc>=c[0])protTx=`<li><strong>Borderline proteinuria:</strong> recheck UPC within 2 months.</li>`;}
  let bpTxt='',bpTx='';
