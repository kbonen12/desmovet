<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAVLE Study Hub — desmoVet</title>
<meta name="description" content="A species-organized NAVLE review hub: high-yield infectious disease, differential clusters, oncology pharmacology, exotics and avian medicine, with a multiple-choice and typed-answer practice bank.">
<style>
/* ==========================================================================
   NAVLE Study Hub — visual system

   Editorial, not app-chrome. Display type is a serif; sections are set as a
   numbered list separated by hairlines rather than a stack of identical grey
   cards. Colour carries meaning in exactly two ways:
     · a per-chapter species accent — rules, numerals, tints, never body text
     · a per-content-type accent for pearls / discriminators / warnings, which
       render inline and open because they are the highest-value lines on the
       page and should never be hidden behind a toggle.
   ========================================================================== */

:root{
  color-scheme: light;
  --surface-0:#f6f3ed;  /* page */
  --surface-1:#fffdf9;  /* raised */
  --surface-2:#ece7dd;  /* wells, hover */
  --surface-3:#e1dacb;
  --border:#e0d9ca; --border-strong:#c6bda8; --hairline:#e8e2d5;
  --text-primary:#191712; --text-secondary:#544f45; --text-muted:#8b8375;
  --accent:#2a78d6; --accent-soft:#e9f0fa;

  --pearl:#8a6d00; --pearl-bg:#fdf3d9; --pearl-br:#e0c877;
  --danger:#a33028; --danger-bg:#fbeae8; --danger-br:#e6b1ab;
  --discrim:#1c6b58; --discrim-bg:#e2f1ec; --discrim-br:#9dd1c2;
  --series-1:#2a78d6;

  --radius:14px; --radius-sm:10px;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(40,32,20,.04), 0 6px 20px rgba(40,32,20,.05);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-0:#14130e; --surface-1:#1c1a14; --surface-2:#262218; --surface-3:#312c20;
  --border:#35301f; --border-strong:#4d4633; --hairline:#2b2619;
  --text-primary:#f8f5ed; --text-secondary:#c9c3b3; --text-muted:#978f7e;
  --accent:#5b9cea; --accent-soft:#172639;

  --pearl:#e4c86e; --pearl-bg:#2a2311; --pearl-br:#5c4f23;
  --danger:#f2928c; --danger-bg:#2e1816; --danger-br:#5f2f2b;
  --discrim:#68cbae; --discrim-bg:#122622; --discrim-br:#2c5549;
  --series-1:#5b9cea;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 22px rgba(0,0,0,.28);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); background:var(--surface-0); color:var(--text-primary);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
::selection{background:var(--accent-soft)}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
.sidebar{background:var(--surface-1);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:0 0 40px}
.main{min-width:0;padding:0 0 90px}
.wrap{max-width:1140px;margin:0 auto;padding:0 36px}
.chapterwrap{display:grid;grid-template-columns:minmax(0,1fr) 206px;gap:44px;align-items:start}
.chapterbody{min-width:0}

/* ---------- Brand ---------- */
.brand{padding:19px 20px 15px;border-bottom:1px solid var(--border)}
.brand-top{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--accent),#1d5ba8);
  color:#fff;font-weight:700;font-size:12px;letter-spacing:-.03em;
  box-shadow:0 1px 3px rgba(30,60,110,.35)}
.brand-name{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--text-muted);margin-top:5px;letter-spacing:.02em}

/* ---------- Search ---------- */
.searchbox{padding:14px 15px 6px;position:relative}
.searchbox input{width:100%;padding:8px 10px 8px 31px;font:inherit;font-size:13.5px;
  border:1px solid var(--border-strong);border-radius:9px;
  background:var(--surface-0);color:var(--text-primary)}
.searchbox input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.searchbox svg{position:absolute;left:24px;top:22px;width:14px;height:14px;stroke:var(--text-muted);fill:none;stroke-width:2}

/* ---------- Nav ---------- */
nav{padding:6px 9px}
.navgroup{margin:15px 0 4px;padding:0 11px;font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.navlink{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:8px;
  cursor:pointer;font-size:13.5px;color:var(--text-secondary);
  border:1px solid transparent;position:relative}
.navlink:hover{background:var(--surface-2);color:var(--text-primary)}
.navlink.active{background:var(--surface-2);color:var(--text-primary);font-weight:600}
.navlink.active:before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;
  border-radius:2px;background:var(--mod-accent,var(--accent))}
.navlink .lbl{flex:1;min-width:0}
.navlink .pct{font-size:10.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;flex:none}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--mod-accent,var(--border-strong))}

/* ---------- Header ---------- */
.topbar{position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--surface-0) 84%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1140px;margin:0 auto;padding:9px 36px;display:flex;align-items:center;gap:9px}
.menu-btn{display:none}
.spacer{flex:1}
.btn{font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;cursor:pointer;
  border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-secondary)}
.btn:hover{color:var(--text-primary);border-color:var(--text-muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.tiny{font-size:12px;padding:3px 9px}
.btn.big{font-size:14.5px;padding:9px 20px;border-radius:10px;font-weight:600}

/* ==========================================================================
   Page head — an accent-tinted plate rather than a plain block of text
   ========================================================================== */
.plate{
  margin:26px 0 0;padding:30px 34px 28px;border-radius:var(--radius);
  background:var(--mod-tint,var(--surface-1));
  border:1px solid var(--mod-br,var(--border));position:relative;overflow:hidden;
}
.plate:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--mod-accent,var(--accent))}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--text-muted)}
.eyebrow b{color:var(--text-secondary);font-weight:700}
h1{font-family:var(--serif);font-size:42px;line-height:1.06;letter-spacing:-.021em;
  margin:11px 0 0;font-weight:600}
.tagline{color:var(--text-secondary);font-size:16.5px;margin-top:11px;max-width:60ch;line-height:1.5}
.platestats{display:flex;gap:0;flex-wrap:wrap;margin-top:20px;
  border-top:1px solid var(--mod-br,var(--border));padding-top:15px}
.pstat{padding-right:26px;margin-right:26px;border-right:1px solid var(--mod-br,var(--border))}
.pstat:last-child{border-right:0;margin-right:0;padding-right:0}
.pstat b{display:block;font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.1;
  letter-spacing:-.01em}
.pstat span{display:block;font-size:11px;color:var(--text-muted);letter-spacing:.05em;
  text-transform:uppercase;font-weight:600;margin-top:3px}

/* ==========================================================================
   Chapter body — numbered sections on hairlines, no card stack
   ========================================================================== */
.sections{margin-top:14px}
.sec{border-bottom:1px solid var(--hairline)}
.sechead{display:grid;grid-template-columns:34px minmax(0,1fr) auto 16px;gap:14px;align-items:baseline;
  padding:15px 4px;cursor:pointer;user-select:none;background:none;border:0;
  width:100%;text-align:left;font:inherit;color:inherit}
.sechead:hover .sectitle{color:var(--mod-accent,var(--accent))}
.secnum{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.02em;
  color:var(--mod-accent,var(--text-muted));opacity:.75;font-variant-numeric:tabular-nums}
.sechead > .lines{min-width:0}
.sectitle{display:block;font-family:var(--serif);font-size:19px;font-weight:600;
  letter-spacing:-.012em;line-height:1.25;transition:color .12s;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.secprev{display:block;font-size:12.8px;color:var(--text-muted);margin-top:3px;line-height:1.45;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec.open .secprev{display:none}
.seccount{font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.04em;
  white-space:nowrap;text-transform:uppercase;align-self:center}
.chev{width:16px;height:16px;color:var(--text-muted);transition:transform .18s ease;align-self:center}
.sec.open .chev{transform:rotate(90deg);color:var(--mod-accent,var(--accent))}
.secbody{padding:2px 4px 24px 48px;display:none}
.sec.open .secbody{display:block}
/* Start-here chapters and other always-open contexts */
.sec.static{border-bottom:1px solid var(--hairline)}
.sec.static .secbody{display:block;padding-top:6px}
.sec.static .statichead{display:grid;grid-template-columns:34px 1fr auto;gap:14px;
  align-items:baseline;padding:20px 4px 4px}
.sec.static .secprev{display:none}

/* Callouts sit inline and open — the highest-value lines are never hidden */
.inlinecall{margin:22px 0 22px 48px}
.chapterbody > .sections > .inlinecall{margin-left:48px}

/* ---------- Jump rail ---------- */
.rail{position:sticky;top:78px;padding-top:34px;max-height:calc(100vh - 100px);
  overflow-y:auto;scrollbar-width:thin}
.railtitle{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--text-muted);padding:0 0 10px 12px}
.railitem{display:block;width:100%;text-align:left;font:inherit;font-size:12.4px;line-height:1.38;
  padding:5px 10px 5px 12px;border:0;border-left:2px solid var(--hairline);background:none;
  color:var(--text-muted);cursor:pointer}
.railitem:hover{color:var(--text-primary);border-left-color:var(--border-strong)}
.railitem.cur{color:var(--text-primary);border-left-color:var(--mod-accent,var(--accent));font-weight:600}
.railitem.iscall{color:var(--mod-accent,var(--accent));opacity:.85}
.railtools{display:flex;gap:6px;padding:14px 0 0 12px;flex-wrap:wrap}

/* ---------- Table ---------- */
.tablewrap{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-1)}
.tablescroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.4px}
th{text-align:left;font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);padding:10px 14px;background:var(--surface-2);
  border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:bottom}
td{padding:11px 14px;border-bottom:1px solid var(--hairline);vertical-align:top;
  color:var(--text-secondary);line-height:1.52}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
td:first-child{color:var(--text-primary);font-weight:580}
table.wide{min-width:1000px}
table.wide td:first-child{min-width:180px}
.agent{display:block;font-weight:400;font-size:12.3px;color:var(--text-muted);margin-top:2px;font-style:italic}
mark{background:var(--pearl-bg);color:var(--text-primary);border-radius:3px;padding:0 3px;
  box-shadow:0 0 0 1px var(--pearl-br)}
.tnote{font-size:12.2px;color:var(--text-muted);padding:9px 14px;border-bottom:1px solid var(--border);
  background:var(--surface-1)}
.yes{color:var(--discrim);font-weight:700}
.yes-c{color:var(--pearl);font-weight:700}
.no{color:var(--text-muted)}
.flag{display:inline-block;font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;
  vertical-align:1px;margin-left:4px;letter-spacing:.06em}
.flag.r{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-br)}
.flag.z{background:var(--pearl-bg);color:var(--pearl);border:1px solid var(--pearl-br)}

/* ---------- Callout ---------- */
.callout{border:1px solid;border-left-width:3px;border-radius:var(--radius-sm);
  padding:15px 18px 16px;position:relative}
.callout + .callout{margin-top:11px}
.callout .ct{font-weight:700;font-size:11px;letter-spacing:.09em;margin-bottom:8px;
  display:flex;gap:8px;align-items:center;text-transform:uppercase}
.callout .ct .glyph{font-size:11px}
.callout .cname{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-.01em;
  margin:0 0 8px;line-height:1.3;color:var(--text-primary);text-transform:none}
.callout p{margin:0;font-size:14px;line-height:1.62;color:var(--text-secondary)}
.callout ul{margin:4px 0 0;padding-left:19px;font-size:14px;line-height:1.62;color:var(--text-secondary)}
.callout li{margin:5px 0}
.c-pearl{background:var(--pearl-bg);border-color:var(--pearl-br)} .c-pearl .ct{color:var(--pearl)}
.c-danger{background:var(--danger-bg);border-color:var(--danger-br)} .c-danger .ct{color:var(--danger)}
.c-warn{background:var(--pearl-bg);border-color:var(--pearl-br)} .c-warn .ct{color:var(--pearl)}
.c-discrim{background:var(--discrim-bg);border-color:var(--discrim-br)} .c-discrim .ct{color:var(--discrim)}

/* ---------- List ---------- */
.plainlist{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-1);
  padding:4px 0;margin:0;list-style:none}
.plainlist li{padding:9px 18px 9px 34px;position:relative;font-size:13.7px;color:var(--text-secondary);line-height:1.55}
.plainlist li+li{border-top:1px solid var(--hairline)}
.plainlist li:before{content:"";position:absolute;left:18px;top:16px;width:5px;height:5px;
  border-radius:50%;background:var(--mod-accent,var(--border-strong));opacity:.55}

/* ---------- Rapid fire ---------- */
.rf{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-1)}
.rf-row{display:grid;grid-template-columns:1fr auto 1.05fr;gap:12px;align-items:center;padding:10px 16px;font-size:13.5px}
.rf-row+.rf-row{border-top:1px solid var(--hairline)}
.rf-row:hover{background:var(--surface-2)}
.rf-cue{color:var(--text-secondary)}
.rf-arrow{color:var(--mod-accent,var(--text-muted));font-size:12px;opacity:.7}
.rf-ans{color:var(--text-primary);font-weight:570}

/* ---------- 2x2 contingency matrix ----------
 * A status-coloured grid, not a categorical one: correct cells wear the "good"
 * token, error cells the "bad" one. That pair sits at deutan dE 8.2 — legal only
 * with secondary encoding — so every cell is directly labelled AND the two error
 * cells carry a diagonal texture. Colour is never the only signal, and all text
 * stays in text tokens rather than the cell hue.
 *
 * Every child is placed by grid-area rather than auto-flow, so hiding or
 * restacking a piece at a breakpoint cannot shift the rest of the grid.
 */
.mx{
  display:grid;gap:6px;align-items:stretch;margin:4px 0 2px;font-size:13.5px;
  grid-template-columns:auto auto minmax(0,1fr) minmax(0,1fr) auto;
  grid-template-areas:
    ".  .  ch ch ."
    ".  .  c1 c2 ."
    "rh rp tp fp pv"
    "rh rn fn tn nv"
    ".  .  sn sp .";
}
.mx-colhead{grid-area:ch;text-align:center;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);padding-bottom:2px}
.mx-c1{grid-area:c1} .mx-c2{grid-area:c2}
.mx-collabel{text-align:center;font-weight:650;font-size:13.5px;padding-bottom:4px;color:var(--text-primary)}
.mx-rowhead{grid-area:rh;display:grid;place-items:center;writing-mode:vertical-rl;
  transform:rotate(180deg);font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-muted);padding-right:4px}
.mx-rp{grid-area:rp} .mx-rn{grid-area:rn}
.mx-rowlabel{display:grid;place-items:center;font-weight:650;padding-right:10px;
  color:var(--text-primary);white-space:nowrap}
.mx-tp{grid-area:tp} .mx-fp{grid-area:fp} .mx-fn{grid-area:fn} .mx-tn{grid-area:tn}
.mx-cell{border:1px solid;border-radius:var(--radius-sm);padding:20px 14px;text-align:center;
  position:relative;overflow:hidden;min-height:104px;display:flex;flex-direction:column;
  justify-content:center;gap:5px}
.mx-cell .cl{font-size:13.5px;color:var(--text-secondary);line-height:1.35}
.mx-cell .ck{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--text-primary);
  letter-spacing:-.01em}
.mx-cell.good{background:var(--discrim-bg);border-color:var(--discrim-br)}
.mx-cell.bad{background:var(--danger-bg);border-color:var(--danger-br)}
/* texture carries the good/error split for red-green colour vision deficiency */
.mx-cell.bad:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(45deg,transparent 0 7px,var(--danger-br) 7px 8px)}
.mx-pv{grid-area:pv} .mx-nv{grid-area:nv} .mx-sn{grid-area:sn} .mx-sp{grid-area:sp}
.mx-side{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px;align-items:center}
.mx-under{display:grid;gap:3px;justify-items:center;align-content:start}
.mx-marg{border:1px dashed var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface-2);display:grid;place-items:center;padding:10px 12px;
  font-size:12.5px;font-weight:650;color:var(--text-secondary);text-align:center;line-height:1.3;
  width:100%}
.mx-marg small{display:block;font-weight:400;color:var(--text-muted);font-size:11px;margin-top:3px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.mx-arrow{color:var(--text-muted);font-size:13px}
/* Letter mode swaps TP/FP/FN/TN for the A/B/C/D the exam usually prints. Both
 * label sets are in the DOM; the toggle only flips a class, so nothing is
 * re-rendered and no state has to be tracked. */
/* Three ways to read the same grid: the abbreviations, the A/B/C/D an exam item
 * prints, and the formula that builds each cell straight from the givens. All
 * three label sets live in the DOM; the toggle only flips a class. */
.k-letter,.k-expr,.f-letter,.f-build,.n-build{display:none}
.letters .k-abbr,.letters .f-abbr{display:none}
.letters .k-letter,.letters .f-letter{display:inline}
.build .k-abbr,.build .f-abbr,.build .n-name{display:none}
.build .k-expr,.build .f-build,.build .n-build{display:inline}
.mx.build .ck{font-size:15.5px;line-height:1.35;font-weight:600}
.mx.build .mx-marg{font-size:12px}
.mxbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mxbar .lab{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-muted)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:12.5px;padding:5px 13px;border:0;cursor:pointer;
  background:var(--surface-1);color:var(--text-secondary)}
.seg button+button{border-left:1px solid var(--border-strong)}
.seg button.on{background:var(--mod-accent,var(--accent));color:#fff;font-weight:600}

/* ---------- Fill-in worksheet (back-calculation questions) ----------
 * Back-calculation runs down the columns: population splits into diseased and
 * healthy first, and only then does sensitivity act on one column and
 * specificity on the other. The sheet is staged in that order so the structure
 * of the work is visible, and it ships a small calculator because the arithmetic
 * is multiplication by a percentage, not something the grid can do for you.
 *
 * Every check compares your numbers against YOUR numbers — the only external
 * anchor is the stated population size. Nothing here reveals a cell value.
 */
.givens{display:flex;gap:0;flex-wrap:wrap;margin:0 0 14px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--surface-0);padding:12px 4px}
.given{padding:0 18px;border-right:1px solid var(--border);text-align:center;flex:1;min-width:84px}
.given:last-child{border-right:0}
.given b{display:block;font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.1;
  font-variant-numeric:tabular-nums}
.given span{display:block;font-size:10.5px;color:var(--text-muted);letter-spacing:.06em;
  text-transform:uppercase;font-weight:600;margin-top:3px}

.steplab{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mod-accent,var(--accent));margin:16px 0 8px;display:flex;gap:9px;align-items:baseline}
.steplab em{font-style:normal;font-weight:400;letter-spacing:0;text-transform:none;
  font-size:12px;color:var(--text-muted)}

.split{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.wfield{display:grid;gap:4px}
.wfield label{font-size:11px;font-weight:650;color:var(--text-secondary)}
.wfield input,.wcell input{font:inherit;font-family:var(--serif);font-size:19px;font-weight:600;
  text-align:center;padding:6px 8px;border-radius:8px;border:1px solid var(--border-strong);
  background:var(--surface-1);color:var(--text-primary);font-variant-numeric:tabular-nums;width:110px}
.wfield input:focus,.wcell input:focus,.calcstrip input:focus{outline:2px solid var(--accent);
  outline-offset:-1px;border-color:transparent}
.wcell{border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-0);
  padding:10px 8px;display:flex;flex-direction:column;gap:5px;align-items:center;min-height:74px;
  justify-content:center}
.wcell .pk{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--text-muted)}
.wcell input{width:100%;max-width:98px}

.checks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chk{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);
  background:var(--surface-0);color:var(--text-muted);font-variant-numeric:tabular-nums}
.chk.ok{border-color:var(--discrim-br);background:var(--discrim-bg);color:var(--discrim);font-weight:600}
.chk.no{border-color:var(--danger-br);background:var(--danger-bg);color:var(--danger);font-weight:600}

/* a plain four-function calculator — no percent key, no special semantics */
.calcstrip{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-0);
  padding:12px 14px;margin-top:4px}
.calcdisp{background:var(--surface-1);border:1px solid var(--border);border-radius:8px;
  padding:9px 14px;text-align:right;max-width:296px;font-family:var(--serif);font-size:26px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--text-primary);overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;min-height:46px;line-height:1.1}
.calcsub{text-align:right;font-size:11.5px;color:var(--text-muted);min-height:15px;
  font-variant-numeric:tabular-nums;padding:3px 4px 0;max-width:296px}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px;max-width:296px}
.key{font:inherit;font-size:16px;font-weight:600;padding:9px 0;border-radius:8px;cursor:pointer;
  border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary)}
.key:hover{border-color:var(--accent)}
.key:active{background:var(--accent-soft)}
.key.op{color:var(--text-secondary);background:var(--surface-2);font-size:17px}
.key.eq{background:var(--accent);border-color:var(--accent);color:#fff}
.key.eq:hover{filter:brightness(1.08)}
.key.fn{font-size:13px;color:var(--text-muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chips .cl{font-size:11px;color:var(--text-muted);margin-right:2px}
.chip{font:inherit;font-size:12.5px;padding:4px 11px;border-radius:20px;cursor:pointer;
  border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-secondary);
  font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--accent);color:var(--text-primary)}

/* a column total turns green once the two cells above it add up to it */
.ptot.ok{color:var(--discrim);font-weight:700}
.ptot.no{color:var(--danger);font-weight:700}

@media (max-width:760px){
  .keypad{max-width:none}
  .wfield input{width:96px}
}

/* ---------- Solve pad (calculation questions) ----------
 * Gives you the counts and does the arithmetic. It never names or computes
 * sensitivity, specificity, PPV or NPV — choosing the cells is the whole skill,
 * so that part stays with you.
 */
.pad{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-1);
  padding:18px 20px 20px;margin-top:18px}
.padhead{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.padhead .t{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-muted)}
.padhead .hint{font-size:12px;color:var(--text-muted);flex:1;min-width:180px}
/* Both pads share this 4x4. Areas are explicit so hiding the totals column on a
 * phone cannot reflow the cells — the same trap the 2x2 matrix hit. */
.pg{display:grid;gap:5px;align-items:stretch;font-size:13px;
  grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;
  grid-template-areas:
    "h0 h1 h2 h3"
    "rp tp fp r1"
    "rn fn tn r2"
    "ct c1 c2 ca";}
.pg .a-h0{grid-area:h0} .pg .a-h1{grid-area:h1} .pg .a-h2{grid-area:h2} .pg .a-h3{grid-area:h3}
.pg .a-rp{grid-area:rp} .pg .a-tp{grid-area:tp} .pg .a-fp{grid-area:fp} .pg .a-r1{grid-area:r1}
.pg .a-rn{grid-area:rn} .pg .a-fn{grid-area:fn} .pg .a-tn{grid-area:tn} .pg .a-r2{grid-area:r2}
.pg .a-ct{grid-area:ct} .pg .a-c1{grid-area:c1} .pg .a-c2{grid-area:c2} .pg .a-ca{grid-area:ca}
.pg .ph{text-align:center;font-weight:650;font-size:12.5px;color:var(--text-primary);
  padding-bottom:3px;align-self:end}
.pg .rl{display:grid;place-items:center;font-weight:650;padding-right:9px;white-space:nowrap;
  color:var(--text-primary)}
.pcell{border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-0);
  padding:14px 8px;cursor:pointer;font:inherit;text-align:center;color:inherit;
  display:flex;flex-direction:column;gap:3px;justify-content:center;min-height:74px;
  transition:border-color .12s, background .12s}
.pcell:hover{border-color:var(--mod-accent,var(--accent))}
.pcell .pn{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--text-primary);
  font-variant-numeric:tabular-nums}
.pcell .pk{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--text-muted)}
.pcell.inN{border-color:var(--accent);background:var(--accent-soft);border-width:2px}
.pcell.inD{border-color:var(--pearl);background:var(--pearl-bg);border-width:2px}
.pcell.inB{background:linear-gradient(160deg,var(--accent-soft),var(--pearl-bg));
  border-color:var(--accent);border-width:2px}
.pcell .tagrow{display:flex;gap:4px;justify-content:center;min-height:13px}
.pcell .tag{font-size:9px;font-weight:800;letter-spacing:.06em;padding:1px 5px;border-radius:3px}
.pcell .tag.n{background:var(--accent);color:#fff}
.pcell .tag.d{background:var(--pearl);color:#fff}
.ptot{display:grid;place-items:center;font-size:12px;color:var(--text-muted);
  font-variant-numeric:tabular-nums;padding:0 4px;white-space:nowrap}
/* an author display rule outranks the UA [hidden] rule — restore it explicitly */
.ptot[hidden]{display:none}
.padslots{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-top:16px;
  padding-top:14px;border-top:1px solid var(--hairline)}
.frac{display:inline-grid;justify-items:center;font-variant-numeric:tabular-nums}
.frac .num{font-family:var(--serif);font-size:20px;font-weight:600;padding:0 10px}
.frac .bar{height:1.5px;background:var(--text-secondary);width:100%;min-width:80px}
.frac .den{font-family:var(--serif);font-size:20px;font-weight:600;padding:0 10px}
.fracwrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.fraceq{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--text-primary)}
.padacts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.slotpick{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text-muted)}
@media (max-width:760px){
  .pad{padding:14px 12px 16px}
  .pg{font-size:12px;
    grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);
    grid-template-areas:
      "h0 h1 h2"
      "rp tp fp"
      "rn fn tn"
      "ct c1 c2";}
  /* row totals are derived; the column totals are what the checks hang on */
  .pg .a-h3,.pg .a-r1,.pg .a-r2,.pg .a-ca{display:none}
  .padslots{grid-template-columns:1fr}
  .padacts{justify-content:flex-start}
}

@media (max-width:760px){
  /* Drop the vertical axis label and move the row margins under the grid, where
   * there is width for them. Explicit areas make this a template swap only. */
  .mx{
    font-size:12.5px;
    grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);
    grid-template-areas:
      ".  ch ch"
      ".  c1 c2"
      "rp tp fp"
      "rn fn tn"
      ".  sn sp"
      "pv pv pv"
      "nv nv nv";
  }
  .mx-rowhead{display:none}
  .mx-cell{padding:14px 8px;min-height:92px}
  .mx-cell .ck{font-size:20px}
  .mx-cell .cl{font-size:12.5px}
  .mx-rowlabel{padding-right:7px}
  .mx-side{grid-template-columns:auto minmax(0,1fr);margin-top:2px}
  .mx-side .mx-arrow{transform:rotate(90deg)}
}

/* ---------- Cloze (values you type from memory) ---------- */
.cz-row{padding:11px 16px;font-size:13.6px;line-height:1.55}
.cz-row+.cz-row{border-top:1px solid var(--hairline)}
.cz-row:hover{background:var(--surface-2)}
.cz-q{color:var(--text-secondary)}
.cz-a{color:var(--text-primary);font-weight:700;background:var(--pearl-bg);
  border-bottom:1.5px solid var(--pearl-br);padding:0 5px;border-radius:3px}
.cz-why{font-size:12.4px;color:var(--text-muted);margin-top:4px;line-height:1.5}

/* ---------- Typed answer ---------- */
.typebox{display:flex;gap:10px;margin-top:20px;align-items:stretch;flex-wrap:wrap}
.typebox input{flex:1;min-width:200px;font:inherit;font-size:19px;font-family:var(--serif);
  padding:13px 16px;border-radius:10px;border:1px solid var(--border-strong);
  background:var(--surface-1);color:var(--text-primary)}
.typebox input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.typebox input.right{border-color:var(--discrim);background:var(--discrim-bg)}
.typebox input.wrong{border-color:var(--danger);background:var(--danger-bg)}
.verdict{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap;font-size:14px}
.verdict .vmark{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 11px;border-radius:6px;white-space:nowrap;flex:none}
.verdict .vmark.ok{background:var(--discrim-bg);color:var(--discrim);border:1px solid var(--discrim-br)}
.verdict .vmark.no{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-br)}
.verdict .truth{color:var(--text-secondary)}
.verdict .truth b{font-family:var(--serif);font-size:18px;color:var(--text-primary)}
.typehint{font-size:12px;color:var(--text-muted);margin-top:9px}

/* ---------- Chart ---------- */
.chart{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-1);padding:18px 20px}
.chart .cnote{font-size:13.2px;color:var(--text-secondary);margin:0 0 14px;max-width:70ch}
.bar-row{display:grid;grid-template-columns:200px 1fr 46px;gap:10px;align-items:center;padding:2px 0}
.bar-label{font-size:12.5px;color:var(--text-secondary);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:15px;background:var(--surface-2);border-radius:4px;position:relative}
.bar-fill{height:15px;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px;
  transition:width .5s cubic-bezier(.2,.7,.3,1)}
.bar-val{font-size:12.3px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.cfoot{font-size:11.8px;color:var(--text-muted);margin:12px 0 0;font-style:italic}

/* ==========================================================================
   Home dashboard
   ========================================================================== */
.hero{padding:44px 0 30px;border-bottom:1px solid var(--border)}
.hero h1{font-size:52px;max-width:16ch}
.hero .tagline{font-size:17.5px;max-width:56ch}
.herostats{display:flex;gap:0;flex-wrap:wrap;margin-top:26px}
.herostats .pstat{border-right:1px solid var(--border)}
.herostats .pstat:last-child{border-right:0}

.homegrid{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;margin-top:26px;align-items:start}
.panel{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-1);
  padding:22px 24px 24px}
.panel h2{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.015em;margin:0}
.panel .sub{font-size:13.5px;color:var(--text-muted);margin-top:6px;line-height:1.5}
.panel.cta{background:linear-gradient(160deg,var(--accent-soft),var(--surface-1) 72%);
  border-color:color-mix(in srgb,var(--accent) 24%,var(--border))}
.ctarow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.bankline{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.bankline div{font-size:12.5px;color:var(--text-muted)}
.bankline b{display:block;font-family:var(--serif);font-size:24px;color:var(--text-primary);
  font-weight:600;line-height:1.1}

.weakrow{display:grid;grid-template-columns:1fr 88px 44px;gap:12px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--hairline);font-size:13.4px}
.weakrow:last-child{border-bottom:0}
.weakname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.weakname:hover{color:var(--accent)}
.meter{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter > div{height:7px;border-radius:4px;background:var(--series-1)}
.meter.low > div{background:var(--danger)}
.meter.mid > div{background:var(--pearl)}
.meter.high > div{background:var(--discrim)}
.weakpct{font-size:12.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;text-align:right}

.sectionhead{display:flex;align-items:baseline;gap:14px;margin:44px 0 4px}
.sectionhead h2{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.018em;margin:0}
.sectionhead .rule{flex:1;height:1px;background:var(--border)}
.sectionhead .note{font-size:12.5px;color:var(--text-muted)}

.tilegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px;margin-top:16px}
.tile{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-1);
  padding:0 0 15px;cursor:pointer;text-align:left;font:inherit;color:inherit;
  display:flex;flex-direction:column;overflow:hidden;
  transition:border-color .15s, box-shadow .15s, transform .15s}
.tile:hover{border-color:var(--mod-accent,var(--border-strong));box-shadow:var(--shadow);transform:translateY(-2px)}
.tile .band{height:5px;background:var(--mod-accent,var(--border-strong))}
.tile .tbody{padding:14px 17px 0}
.tile .ttop{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.tile .tmono{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;
  background:var(--mod-tint,var(--surface-2));border:1px solid var(--mod-br,var(--border));
  font-size:10px;font-weight:800;letter-spacing:-.02em}
.tile .tw{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;margin-left:auto}
.tile .ttitle{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-.012em;line-height:1.25}
.tile .ttag{font-size:12.5px;color:var(--text-muted);line-height:1.45;margin-top:7px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tmeta{font-size:11px;color:var(--text-muted);margin-top:11px;letter-spacing:.03em;
  display:flex;gap:9px;flex-wrap:wrap}
.tile .tmeta span{white-space:nowrap}

/* ==========================================================================
   Practice
   ========================================================================== */
.practicewrap{max-width:740px;margin:0 auto;padding-top:24px}
.setup{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-1);
  padding:24px 26px 26px}
.field{margin-bottom:20px}
.field:last-child{margin-bottom:0}
.flabel{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:9px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{font:inherit;font-size:13.5px;padding:9px 15px;border-radius:10px;cursor:pointer;
  border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-secondary);
  text-align:left;line-height:1.3}
.opt:hover{border-color:var(--text-muted);color:var(--text-primary)}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.opt small{display:block;font-size:11px;opacity:.72;font-weight:400;margin-top:2px}
.opt.on small{opacity:.85}
select.opt{min-width:230px;padding-right:32px}
.startrow{margin-top:26px;padding-top:20px;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.startrow .n{font-size:13px;color:var(--text-muted)}

.qhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.qtype{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 9px;border-radius:5px;background:var(--surface-2);color:var(--text-muted)}
.qsrc{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)}
.qstem{font-size:15.5px;line-height:1.64;color:var(--text-secondary);
  border-left:3px solid var(--mod-accent,var(--accent));background:var(--surface-1);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:16px 20px}
.qprompt{font-family:var(--serif);font-size:23px;line-height:1.32;letter-spacing:-.016em;
  font-weight:600;padding:20px 2px 4px}
.qprompt.solo{font-size:27px;padding-top:6px}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.choice{text-align:left;font:inherit;font-size:14.5px;padding:13px 16px;border-radius:10px;cursor:pointer;
  border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);
  line-height:1.45;display:flex;gap:12px;align-items:flex-start}
.choice .key{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--text-muted);
  padding-top:2px;flex:none;width:14px}
.choice:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--discrim);background:var(--discrim-bg);font-weight:600}
.choice.right .key{color:var(--discrim)}
.choice.wrong{border-color:var(--danger);background:var(--danger-bg)}
.choice.wrong .key{color:var(--danger)}
.explain{border:1px solid var(--discrim-br);background:var(--discrim-bg);border-radius:10px;
  padding:14px 17px;margin-top:16px;font-size:14px;line-height:1.64;color:var(--text-secondary)}
.explain .et{font-weight:700;font-size:10.5px;color:var(--discrim);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.08em}
.explain a{font-weight:600}
.studybar{display:flex;align-items:center;gap:12px;margin-top:20px}
.progress{flex:1;height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.progress > div{height:5px;background:var(--accent);border-radius:3px;transition:width .3s}
.counter{font-size:12.5px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.score{font-size:13px;color:var(--text-secondary);text-align:center;margin-top:18px}
.bigscore{text-align:center;padding:34px 0 6px}
.bigscore .n{font-family:var(--serif);font-size:64px;font-weight:600;line-height:1;letter-spacing:-.03em}
.bigscore .of{font-size:14px;color:var(--text-muted);margin-top:10px}

/* ---------- Search results ---------- */
.result{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hairline);
  background:none;padding:14px 4px;cursor:pointer;font:inherit}
.result:hover{background:var(--surface-1)}
.result .rmod{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.result .rtxt{font-size:13.6px;color:var(--text-secondary);margin-top:5px;line-height:1.55}
.empty{color:var(--text-muted);font-size:14px;padding:30px 0}

/* ---------- Coverage ---------- */
.covgrid{display:grid;gap:0;margin-top:16px}
.covrow{display:grid;grid-template-columns:168px 1fr;gap:18px;align-items:center;
  border-bottom:1px solid var(--hairline);padding:14px 4px}
.covname{font-size:14px;font-weight:600}
.covname small{display:block;color:var(--text-muted);font-weight:400;font-size:11.5px;margin-top:2px}
.covbars{display:grid;gap:6px}
.covline{display:grid;grid-template-columns:78px 1fr 58px;gap:10px;align-items:center;font-size:11.5px;color:var(--text-muted)}

/* ---------- Document library ---------- */
.doccard{display:grid;grid-template-columns:44px 1fr auto;gap:18px;align-items:start;
  border-bottom:1px solid var(--hairline);padding:18px 4px}
.doccard:hover{background:var(--surface-1)}
.docicon{width:44px;height:56px;border-radius:6px;border:1px solid var(--border-strong);
  background:var(--surface-2);display:grid;place-items:center;font-size:9px;font-weight:800;
  color:var(--danger);letter-spacing:.06em}
.doctitle{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.012em}

        rows: [
          ['Passage of food', 'RETICULUM (honeycomb) → RUMEN (left side) → OMASUM → ABOMASUM, the true glandular stomach.'],
          ['Normal rumen pH', '6, roughly 6.0–6.8. It drops toward 5 in grain overload.'],

          ['Rumen acidosis / grain overload', 'High-energy grain diet → Streptococcus bovis and Lactobacillus proliferate → lactic acid accumulates → rumen pH falls from 6 to 5, killing the normal microbial population.', 'Alkalinizing agents, fluids, rumen transfaunation, rumenotomy if severe. Sequelae: rumenitis → liver abscesses, and laminitis.'],
          ['Rumenitis and liver abscesses', 'Fusobacterium necrophorum enters the portal circulation through damaged rumen wall. The classic feedlot sequela of grain overload. F. necrophorum is also the agent of foot rot and calf diphtheria — one bug, three diseases.', 'Tylosin is used in feed for prevention rather than to treat an established abscess.'],
          ['Caudal vena cava thrombosis', 'The full chain: high-producing cow → grain overload and rumenitis → F. necrophorum into portal circulation → liver abscess → erodes into the caudal vena cava → septic thrombus showers the lungs → pulmonary abscess RUPTURES INTO AN AIRWAY.', 'Three signs: right-sided heart failure, EPISTAXIS, HEMOPTYSIS. Grave prognosis; often found dead from exsanguination.'],
          ['Vagal indigestion', 'Outflow failure at the pylorus or reticulo-omasal orifice from vagal nerve damage — often post-hardware disease or an abscess.', 'Two results: indigestion with a papple-shaped abdomen, and BRADYCARDIA. The bradycardia is the tell.'],

          ['Psoroptes and Chorioptes', 'Surface mites', 'Both live ON the skin, so topical sprays and dusts work. Psoroptes is common in cattle, sheep, and rabbits and is reportable in sheep. Chorioptes causes leg mange in cattle and horses — long legs, short pedicles.'],
          ['Stephanofilariasis', 'Stephanofilaria', 'Plaque-like dermatitis along the VENTRAL MIDLINE. Transmitted by the HORN FLY (Haematobia irritans).'],
          ['Photosensitization', '—', 'Primary: the plant itself is photodynamic — St. John\'s wort, Hypericum, Erodium, brassicas, and tetracyclines. Secondary (hepatogenous): liver damage prevents clearance of PHYLLOERYTHRIN, the chlorophyll breakdown product, which accumulates in skin and reacts with UV light. Affects white and unpigmented areas.']
        ]
      },

      /* ---------------- Vector-borne & reportable ---------------- */
      {
        type: 'table', title: 'Vector-borne disease', wide: true,
        columns: ['Disease', 'Agent', 'Vector', 'Features & treatment'],
        rows: [
          ['Anaplasmosis', 'Anaplasma marginale', 'Dermacentor', 'Found INSIDE the RBC, at the margin. Causes EXTRAVASCULAR hemolysis — which is why you see ICTERUS and PALE mucous membranes but NO hemoglobinuria and NO red urine. Also Howell-Jolly bodies from the regenerative response. Treat with OXYTETRACYCLINE.'],
          ['Babesiosis ("tick fever", "Texas fever", "redwater")', 'Babesia bovis and B. bigemina', 'Rhipicephalus (Boophilus)', 'PEAR-SHAPED organisms inside RBCs. Causes INTRAvascular hemolysis → severe anemia, HEMOGLOBINURIA, fever, and jaundice. The stem: "redwater hemoglobinuria in Texas cows near Mexico." Eradicated from the US by tick control; imidocarb where permitted.'],
          ['Theileriosis', 'Theileria orientalis', 'Asian longhorned tick — Haemaphysalis longicornis', 'Severe hemolytic anemia, fever, jaundice, and reduced milk yield. An emerging US problem with the spread of the longhorned tick.'],
          ['Heartwater ⚑R', 'Ehrlichia ruminantium', 'Amblyomma (ornate, long mouthparts)', 'FATAL ENCEPHALITIS in sheep, goats, and cattle. Necropsy: PERICARDIAL EFFUSION — the "hydropericardium" that gives the disease its name. A foreign animal disease.'],
          ['Epizootic bovine abortion ("foothill abortion")', 'A deltaproteobacterium', 'Ornithodoros coriaceus — a SOFT tick', 'Late-term abortion; fetus has enlarged lymph nodes and spleen with a DESTROYED THYMUS.'],
          ['Otobius megnini (spinose ear tick)', '—', 'A SOFT tick', 'Predilection site: the EARS. Causes otitis and irritation.'],
          ['Trypanosomiasis ("Nagana")', 'Trypanosoma congolense', 'TSETSE FLY (Glossina) — cyclical biological transmission', 'Three signs: intermittent FEVER, severe ANEMIA, WEIGHT LOSS.'],
          ['Bluetongue ⚑R', 'Orbivirus', 'CULICOIDES — the biting midge', 'In SHEEP, most severe: oral lesions and erosions, vasculitis, edema of the muzzle, tongue, and CORONARY BANDS, and arthrogryposis with hydranencephaly in utero. Cattle are usually subclinical reservoirs.'],
          ['Bovine leukosis', 'BLV — a retrovirus', 'Biting flies, needles, rectal sleeves, colostrum', 'Persistent lymphocytosis; lymphosarcoma in a minority. Also a cause of cardiomyopathy.'],
          ['Louping ill', 'FLAVIVIRUS', 'Ixodes', 'Ovine encephalomyelitis. Two signs: fine muscle tremors and "nervous nibbling." UK and Ireland.']
        ]
      },
      { type: 'callout', variant: 'discrim', title: 'The red-urine differentials', body: 'ANAPLASMA — EXTRAvascular hemolysis → icterus and pallor, but NO red urine. BABESIA — INTRAvascular → RED URINE. Bacillary hemoglobinuria (C. haemolyticum) — red urine plus a liver infarct, following Fasciola migration. LEPTOSPIROSIS — hemoglobinuria plus abortion and agalactia. ANTHRAX — sudden death with unclotted blood and no rigor mortis.' },
      {
        type: 'table', title: 'Systemic & reportable disease',
        columns: ['Disease', 'Agent', 'Features, diagnosis & action'],
        rows: [
          ['Anthrax ⚑R ⚑Z', 'Bacillus anthracis', 'Sudden death. Necropsy findings: LACK OF RIGOR MORTIS and UNCLOTTED blood oozing from orifices. DIAGNOSIS: obtain VITREOUS HUMOR or a BLOOD SMEAR FROM AN EAR SCRAPE — do NOT open the carcass, because exposing the vegetative organism to oxygen creates environmentally persistent spores. Three forms in humans: intestinal, pulmonary, cutaneous.'],
          ['Bovine tuberculosis ⚑R ⚑Z', 'Mycobacterium bovis', 'Chronic weight loss, cough, enlarged lymph nodes, CASEOUS CALCIFIED GRANULOMAS, and "PEARL DISEASE" on the pleura. Screening: the CAUDAL FOLD TEST — intradermal bovine tuberculin in the caudal tail fold, read at 72 hours. To differentiate M. bovis from M. avium: the COMPARATIVE CERVICAL TEST. Definitive: culture, which takes weeks. Test-and-slaughter, no treatment.'],
          ['Brucellosis ⚑R ⚑Z', 'Brucella abortus', 'Late-term abortion with retained placenta. Milk ring test for herd screening; RB51 vaccination at 4–12 months; orange metal tag in the RIGHT ear. Zoonotic (undulant fever) — a classic occupational infection of veterinarians via vaccine needle-stick.'],
          ['Malignant catarrhal fever ⚑R', 'Ovine herpesvirus-2 (sheep-associated) or alcelaphine herpesvirus-1 (wildebeest)', 'Six signs: high fever, bilateral corneal opacity and uveitis, profuse oculonasal discharge, erosive stomatitis, generalized lymphadenopathy, and diarrhea. The classic history is cattle housed near SHEEP. Essentially always fatal.'],
          ['Foot and mouth disease ⚑R', 'Aphthovirus', 'Vesicles on the tongue, muzzle, teats, and coronary bands in cloven-hoofed animals. Horses are NOT affected — that is the key discriminator from vesicular stomatitis.'],
          ['Vesicular stomatitis ⚑R ⚑Z', 'Vesiculovirus', 'Affects PIGS, HORSES, and SHEEP as well as cattle. The vesicular disease that DOES affect horses — which is how you distinguish it from FMD in the field. Zoonotic.'],
          ['Rinderpest ⚑R', 'Morbillivirus', 'The "four Ds": DEPRESSION, DISCHARGES, DIARRHEA, DEATH. Severe fever, erosive mouth lesions, profuse diarrhea, extreme dehydration. Globally eradicated in 2011 but still examinable. Differentiate from Rift Valley fever, a mosquito-borne bunyavirus causing abortion storms and hepatic necrosis that is zoonotic.'],
          ['BSE ⚑R ⚑Z', 'Prion', '"Mad cow disease." Progressive neurologic disease in adult cattle. Feed bans; ruminant-to-ruminant protein prohibition.'],
          ['Peste des petits ruminants ⚑R', 'MORBILLIVIRUS — related to rinderpest and canine distemper', 'Four signs: fever, oral and nasal lesions, oculonasal discharge, and stomatitis with conjunctivitis. Report it; diagnose by PCR.']
        ]
      },

      /* ---------------- Parasitology ---------------- */
      {
        type: 'table', title: 'Gastrointestinal nematodes',
        columns: ['Parasite', 'Location', 'Disease'],
        rows: [
          ['Haemonchus contortus ("barber pole worm")', 'ABOMASUM', 'A blood-sucking strongyle. Localized bleeding → severe ANEMIA and SUBMANDIBULAR EDEMA ("bottle jaw") from hypoproteinemia — with NORMAL fecal consistency. That last detail is the classic trap: haemonchosis does NOT cause diarrhea. Primarily sheep and goats. Monitor with FAMACHA scoring of conjunctival color.'],
          ['Ostertagia ostertagi ("brown stomach worm")', 'ABOMASUM', 'Causes abomasal pH to RISE above 6 by destroying parietal glands, giving diarrhea, weight loss, and hypoproteinemia. Necropsy: "COBBLESTONE" or "MOROCCAN LEATHER" abomasal mucosa. Type I is disease from a current adult infection during the grazing season; type II is disease from the synchronous emergence of ARRESTED (hypobiotic) larvae in late winter and spring, in older animals, and is much harder to treat.'],
          ['Trichostrongylus', 'Abomasum / small intestine', 'The third of the "three stomach worms of cattle" with Haemonchus and Ostertagia.'],
          ['Oesophagostomum', 'Large intestine / colon', '"Nodular worm" — forms nodules in the intestinal wall.'],
          ['Nematodirus', 'Small intestine', 'Diarrhea, weight loss, failure to thrive — especially in young lambs and crias. Diagnose by direct smear and fecal flotation.'],
          ['Dictyocaulus viviparus', 'Lungs (bronchi)', 'Verminous pneumonia / "husk" in yearlings. Identify with the BAERMANN technique — you are looking for larvae, not eggs. Treat with ivermectin.'],
          ['Muellerius capillaris', 'Small bronchioles (sheep and goats)', 'Verminous pneumonia with small firm gray-green NODULES on the lung surface. Dictyocaulus filaria is the MOST PATHOGENIC lungworm of small ruminants; Muellerius is the most common but less pathogenic.'],
          ['Setaria cervi', 'Peritoneal cavity', 'Usually an incidental finding at slaughter; aberrant migration can cause neurologic disease.'],
          ['Thelazia gulosa', 'EYE', 'Eyeworm — conjunctivitis and keratitis; face fly transmitted.']
        ]
      },
      {
        type: 'table', title: 'Trematodes, cestodes & protozoa',
        columns: ['Parasite', 'Detail'],
        rows: [
          ['Fasciola hepatica (liver fluke)', 'A TREMATODE. Intermediate host: LYMNAEID SNAILS. Acute: migratory tract hemorrhage and hepatitis. Chronic, with adults in the bile ducts: weight loss, ANEMIA, hypoproteinemia, SUBMANDIBULAR EDEMA, and poor production. Two classic sequelae: "BLACK DISEASE" — infectious necrotic hepatitis from Clostridium novyi type B — and BACILLARY HEMOGLOBINURIA from C. haemolyticum. Fluke migration creates the anaerobic niche in which clostridial spores germinate.'],
          ['Eurytrema (pancreatic fluke)', 'Parasitizes the pancreatic and biliary ducts. Light infections are asymptomatic; heavy burdens cause bovine eurytrematosis.'],
          ['Paramphistomum (rumen fluke)', 'Adults in the rumen are largely harmless; immature flukes migrating through the duodenum cause severe enteritis in heavy infections.'],
          ['Moniezia', 'The tapeworm of ruminants. Largely non-pathogenic but alarming to owners when proglottids appear. Treat with fenbendazole. Oribatid mite intermediate host.'],
          ['Echinococcus granulosus ⚑Z', 'A cestode whose definitive host is the DOG. Sheep and other ruminants are intermediate hosts and develop HYDATID CYSTS in the LIVER and LUNGS. Fatal hydatid disease in humans. Do not feed raw offal to farm dogs.'],
          ['Eimeria', '4 sporocysts. Infects ruminants, horses, rabbits, and poultry — NOT dogs and cats. Treat with amprolium plus sulfonamides. In sheep and goats: monensin as a coccidiostat in feed, amprolium in water for the sick.'],
          ['Cryptosporidium ⚑Z', 'Acid-fast or IFA staining required; resistant to disinfectants and chlorination. Calves 1–3 weeks; chronic emaciation with tenesmus. Zoonotic — a genuine risk to students and farm children.'],
          ['Toxoplasma gondii', 'Major abortifacient in sheep and goats; does NOT cause abortion in COWS. Cat is the definitive host. Placental lesions: bright dark red cotyledons with white foci of necrosis.'],
          ['Parelaphostrongylus tenuis ("meningeal worm")', 'Definitive host: the WHITE-TAILED DEER. Aberrant migration in sheep, goats, and camelids causes ataxia, paraparesis, torticollis, and head tilt. CSF: EOSINOPHILIC pleocytosis with elevated protein — the diagnostic hallmark.'],
          ['Oestrus ovis', 'Nasal bot of sheep — larvae in the nasal passages and sinuses cause sneezing and nasal discharge ("false gid").']
        ]
      },
      {
        type: 'rapidfire', title: 'Rapid-fire ruminant parasitology recall',
        items: [
          ['Bottle jaw + anemia + normal manure', 'Haemonchus (abomasum) → FAMACHA'],
          ['Cobblestone abomasum + diarrhea + pH above 6', 'Ostertagia; type II = arrested larvae emerging'],
          ['Bottle jaw + snail + liver', 'Fasciola → sequelae black disease and bacillary hemoglobinuria'],
          ['Husky cough in a yearling', 'Dictyocaulus → Baermann → ivermectin'],
          ['Gray-green lung nodules in a sheep', 'Muellerius'],
          ['Ataxic goat or alpaca with eosinophilic CSF', 'Meningeal worm — white-tailed deer host'],
          ['Abortion in sheep but not cows', 'Toxoplasma'],
          ['Repeat breeder with a carrier bull', 'Tritrichomonas → cull']
        ]
      },

      /* ---------------- Production & misc ---------------- */
      {
        type: 'table', title: 'Production medicine & miscellany',
        columns: ['Topic', 'Detail'],
        rows: [
          ['Most common urolith on an all-grain diet', 'STRUVITE (magnesium ammonium phosphate) — from high phosphorus and alkaline urine. The classic feedlot steer or wether.'],
          ['Most common urolith in the western US', 'SILICATE — from silica-rich range grasses.'],
          ['Limiting amino acids in high milk production', 'LYSINE and METHIONINE — the standard rumen-protected supplements.'],
          ['Measure of nitrogen metabolism', 'MUN — milk urea nitrogen — reflects the protein-to-energy balance of the ration.'],
          ['Poikilocytosis', 'NORMAL in GOATS and young cattle — do not over-interpret it.'],
          ['Gram stain colors', 'Gram POSITIVE = PURPLE. Gram NEGATIVE = PINK.']
        ]
      },
      {
        type: 'cloze', title: 'Numbers to memorize',
        items: [
          { q:'Cow gestation is ___ days.', a:'280', accept:['280 days','9 months'], why:'Estrus 18 hours; cycle 21 days; year-round polyestrus.' },
          { q:'The bovine estrous cycle is ___ days.', a:'21', why:'Estrus itself lasts only 18 hours — the shortest of the domestic species.' },
          { q:'Rectal palpation slip is detectable from ___ days of pregnancy.', a:'30-35', accept:['30–35','30 to 35'], why:'Placentomes at 70 days; fremitus at 120–150 days.' },
          { q:'BVDV infection between ___ days of gestation creates a persistently infected calf.', a:'80-150', accept:['80–150','80 to 150'], why:'Before the fetal immune system matures, so the virus is recognized as self.' },
          { q:'Lupine eaten on days ___ of gestation causes crooked calf disease.', a:'40-70', accept:['40–70','40 to 70'], why:'Anagyrine — arthrogryposis and cleft palate.' },
          { q:'Target calving interval is ___ months.', a:'12-13', accept:['12–13','12 to 13','365-395 days'], why:'Days open 85–115; services per conception 1.5–2.0.' },
          { q:'Target first-service conception rate in dairy cattle is about ___%.', a:'50-60', accept:['50–60','50 to 60'], why:'A low rate with high services-per-conception points to heat detection, insemination technique, or semen handling — not cow fertility.' },
          { q:'Normal rumen pH is about ___.', a:'6', why:'It falls to 5 in grain overload.' },
          { q:'The caudal fold tuberculin test is read at ___ hours.', a:'72', why:'The comparative cervical test then differentiates M. bovis from M. avium.' },
          { q:'Brucella RB51 is given at ___ months of age.', a:'4-12', accept:['4–12','4 to 12'], why:'Orange tag in the right ear.' },
          { q:'A PAP score above ___ mmHg marks a bull as susceptible to brisket disease.', a:'46', why:'Under 41 mmHg is good. High-altitude disease screening.' },
          { q:'Calf scours under 4 days old is most likely ___.', a:'E. coli', accept:['e coli','escherichia coli','enterotoxigenic e. coli','etec'], why:'Rota 5 d–4 wk · corona 4–30 d · C. perfringens ~2 wk · crypto 1–3 wk · salmonella and coccidia >21 d.' },
          { q:'A ruminant has ___ permanent teeth.', a:'32', why:'No upper incisors — a dental pad instead.' }
        ]
      }
    ]
  });

<script>
/* ---- data/06-swine.js ---- */
/* NAVLE Hub — Swine
 * Source: NAVLE_Swine_Study_Guide.pdf
 * Porcine is ~5% of the exam.
 */
(function (N) {
  N.push({
    id: 'swine',
    group: 'Species',
    title: 'Swine',
    tagline: '~5% of the exam. Swine medicine is age medicine — the age alone narrows the differential to two or three diseases.',
    weight: 5,
    sections: [
      { type: 'callout', variant: 'pearl', title: 'The single most useful swine exam strategy', body: 'Nearly every porcine question gives you an age — neonate, nursery, grower-finisher, or sow — and the age alone narrows the differential to two or three diseases. The age tables below are the highest-yield material in this module.' },

      /* ---------------- Enteric ---------------- */
      {
        type: 'table', title: 'The piglet diarrhea algorithm',
        columns: ['Agent', 'Age', 'Features'],
        rows: [
          ['E. coli (ETEC)', '1–5 days', 'ALKALINE pH diarrhea — enteric colibacillosis. Secretory, watery, no blood. Fimbrial adhesins: F4 (K88) affects NEONATES; F5 (K99) causes ETEC in 1–5 day old pigs; F18 with SHIGA TOXIN causes EDEMA DISEASE.'],
          ['Rotavirus', 'Nursing / weaned', 'ACIDIC pH diarrhea in young pigs — malabsorptive from villous atrophy. Prevent by vaccination.'],
          ['C. perfringens type C', '1–5 days', 'Produces alpha PLUS BETA toxin → HEMORRHAGIC, necrotizing enteritis of the small intestine. Peracute; often found dead. Prevent with PRE-FARROW VACCINATION of the sow. Treat with ANTITOXIN.'],
          ['C. perfringens type A', 'Neonatal', 'Alpha toxin only → MILD necrotic enteritis. One of the top three causes of milk-scours in a 3-day-old piglet.'],
          ['C. difficile', 'Neonatal', 'MESOCOLON EDEMA in neonates — the distinguishing lesion.'],
          ['Cystoisospora suis', '7–11 days', 'The coccidian of pigs. High morbidity, LOW mortality — NON-hemorrhagic, pasty yellow diarrhea in piglets over 1 week old. Fibrinonecrotic enteritis of the jejunum and ileum. Treat with a coccidiostat such as PONAZURIL or toltrazuril.'],
          ['Porcine astrovirus', '< 2 weeks', 'STAR-SHAPED appearance on electron microscopy — hence the name.'],
          ['Sapovirus / norovirus', 'Older piglets', 'CUP-SHAPED DEPRESSIONS on EM (calicivirus morphology — "calici" means cup). Can be ZOONOTIC.'],
          ['Sapelovirus', 'Neonatal', 'A PICORNAVIRUS — ICOSAHEDRAL. Causes enteritis plus cardiac or neurologic signs.'],
          ['PEDV (porcine epidemic diarrhea virus)', 'All ages; worst in neonates', 'A CORONAVIRUS. High MORBIDITY with severe diarrhea in NAIVE herds and very high mortality in neonates, approaching 100% under 7 days. Management: FEEDBACK — deliberately exposing sows to infected material to generate lactogenic immunity that protects the piglets.'],
          ['TGE (transmissible gastroenteritis)', 'All ages', 'A coronavirus causing vomiting and diarrhea. It is an endemic porcine coronavirus closely related to PEDV — neither zoonotic nor federally reportable.']
        ]
      },
      { type: 'callout', variant: 'discrim', title: 'The 3-day-old piglet with a flaccid, thin-walled jejunum', body: 'The top three causes of milk-scours in a 3-day-old piglet with a flaccid, thin-walled jejunum containing watery contents: 1. ROTAVIRUS · 2. E. COLI · 3. C. PERFRINGENS TYPE A. The thin, flaccid wall tells you the process is secretory or malabsorptive, not necrotizing — which is what separates these from type C, where the intestine is thickened, dark, and hemorrhagic.' },
      {
        type: 'table', title: 'Enteric disease of older pigs',
        columns: ['Disease', 'Agent', 'Features & treatment'],
        rows: [
          ['Porcine proliferative enteropathy (ileitis)', 'Lawsonia intracellularis', 'Affects the SMALL INTESTINE (ileum) of OLDER pigs — grower-finishers. "GARDEN HOSE GUT" — a thickened, rigid, corrugated ileum. The hemorrhagic form causes acute death with a blood-filled intestine in finishing pigs and gilts. The same organism causes "wet tail" in hamsters and proliferative enteropathy in horses. Treat with tylosin, tiamulin, or tetracyclines.'],
          ['Swine dysentery', 'Brachyspira hyodysenteriae', 'MUCOHEMORRHAGIC DIARRHEA — mucus and blood, in the LARGE INTESTINE. Affects FEEDER-GROWER pigs at 7–16 weeks. Treat with LINCOMYCIN or tiamulin.'],
          ['Salmonellosis ⚑Z', 'Salmonella Typhimurium and Choleraesuis', 'Two lesions to name: "BUTTON ULCERS" — round, raised, concentric ulcers in the colon and cecum — and RECTAL STRICTURES from healed ulceration and ischemia, specifically with S. Typhimurium. Two structures affected: the intestine and the lung; S. Choleraesuis is the septicemic and pneumonic form. Prevention: vaccinate in the water or intranasally. Human GI disease comes from S. Typhimurium and S. Enteritidis.'],
          ['Edema disease', 'E. coli F18 with SHIGA TOXIN', 'Post-weaning. Shiga toxin causes an angiopathy → edema of the eyelids, forehead, stomach wall (gastric submucosa), and mesocolon, plus neurologic signs — ataxia, paddling — and a characteristic squeaky, hoarse squeal from laryngeal edema. Sudden death in the BEST pigs. Management: reduce weaning stress and abrupt feed changes.']
        ]
      },
      { type: 'callout', variant: 'danger', title: 'Button ulcers are not only Salmonella', body: 'Button ulcers are also the classic lesion of CLASSICAL SWINE FEVER (hog cholera), a foreign animal disease. Button ulcers plus high mortality and skin hemorrhage should raise CSF, not just salmonellosis.' },

      /* ---------------- Respiratory ---------------- */
      {
        type: 'table', title: 'Respiratory disease',
        columns: ['Disease', 'Agent', 'Features & management'],
        rows: [
          ['Enzootic pneumonia', 'Mycoplasma hyopneumoniae', 'A dry, non-productive "BARK" COUGH — predominantly a disease of GROWING PIGS, though naive introduced breeding stock cough hardest. Reduces weight gain and feed efficiency; the economic cost is mostly subclinical. Lesion: CRANIOVENTRAL CONSOLIDATION — purple-gray, well-demarcated. Treat with LINCOMYCIN (or tylosin, tiamulin, tetracyclines) and IMPROVE VENTILATION. Destroys tracheal cilia, so it is the great enabler of secondary bacterial pneumonia.'],
          ['PRRS', 'ARTERIVIRUS — an enveloped RNA virus', 'Causes SEVERE NECROTIZING INTERSTITIAL PNEUMONIA and respiratory failure, and PREDISPOSES pigs to secondary infections by destroying alveolar macrophages. Reproductive form: MUMMIFIED fetuses and STILLBIRTHS, late-term abortion, transient ear cyanosis. GILTS spread it — introducing naive or infected replacement gilts is the classic breakdown. Histopathology: interstitial pneumonia with type II pneumocyte hyperplasia and septal infiltration. A positive ELISA antibody test means EXPOSURE, not active infection or protection — it cannot distinguish vaccination from field infection. Sequence ORF5 for strain matching.'],
          ['Actinobacillus pleuropneumonia (APP)', 'Actinobacillus pleuropneumoniae', 'Affects GROWING pigs. OPEN-MOUTH BREATHING, bloody froth at the nose, and a sharp increase in mortality — pigs die acutely with a fibrinohemorrhagic necrotizing pleuropneumonia and dorsocaudal lung lesions.'],
          ['Atrophic rhinitis', 'Bordetella bronchiseptica + toxigenic Pasteurella multocida', 'Both are GRAM-NEGATIVE COCCOBACILLI. Bordetella ALONE causes rhinitis. Bordetella COMBINED with toxigenic Pasteurella causes ATROPHIC RHINITIS with TURBINATE ATROPHY — snout deviation, epistaxis, tear staining. That two-organism requirement is the exam point.'],
          ['Swine influenza ⚑Z', 'Influenza A', 'Seen in FALL and WINTER. ACUTE ONSET and RAPID RECOVERY — high morbidity, low mortality, herd recovers in about a week. Zoonotic and reverse-zoonotic.'],
          ['Ascarid larval migration', 'Ascaris suum', 'VERMINOUS pneumonia from larvae migrating through the lungs.']
        ]
      },
      { type: 'callout', variant: 'pearl', title: 'The porcine respiratory disease complex', body: 'Like BRDC in cattle, swine respiratory disease is usually multifactorial: a primary agent (M. hyopneumoniae, PRRS, influenza, PCV2) damages defenses, and secondary bacteria (Pasteurella, Glaesserella, Strep suis, APP) do the killing. Ventilation and stocking density are as much the treatment as any antibiotic.' },

      /* ---------------- Systemic ---------------- */
      {
        type: 'table', title: 'Systemic, septicemic & cardiac disease',
        columns: ['Disease', 'Agent', 'Features & treatment'],
        rows: [
          ['Streptococcus suis ⚑Z', 'Gram-positive coccus', 'Found in the TONSILS and lungs; affects the JOINTS. Seen in WEANLING and GROWER pigs. Causes MENINGITIS (paddling, opisthotonos), arthritis, and VALVULAR ENDOCARDITIS. Three signs of valvular endocarditis: SEIZURES, PADDLING, FIBRIN IN THE CHEST. Zoonotic — causes meningitis and deafness in abattoir workers.'],
          ['Glaesserella (Haemophilus) parasuis — Glässer\'s disease', 'Gram-negative', 'Septicemia and SUDDEN DEATH in 6–8 WEEK OLD pigs. Sign: FIBRINOUS SEROSITIS — fibrin on the pericardium, pleura, peritoneum, and joints. Treat with PENICILLIN.'],
          ['Mycoplasma hyorhinis', 'Mycoplasma', 'SEPTICEMIA in pigs UNDER 10 WEEKS — arthritis with polyserositis and systemic disease → failure to thrive. Associated with COLOSTRUM DEPRIVATION.'],
          ['Erysipelas ⚑Z', 'Erysipelothrix rhusiopathiae — a GRAM-POSITIVE ROD', 'Three forms: acute septicemia with DIAMOND-SHAPED skin lesions; chronic ARTHRITIS causing lameness; and VEGETATIVE VALVULAR ENDOCARDITIS. Treat with PENICILLIN — highly susceptible, and the dramatic response is itself near-diagnostic. Zoonotic: causes "erysipeloid" in fish handlers, butchers, and veterinarians. Also affects turkeys and sheep.'],
          ['Mulberry heart disease', 'Vitamin E and SELENIUM deficiency', 'TRANSMURAL HEMORRHAGES ON THE HEART — a mottled, mulberry-like appearance. Sudden death in rapidly growing nursery pigs, typically the best in the pen. Treat and prevent with VITAMIN E INJECTION and dietary selenium. Related: hepatosis dietetica (liver) and white muscle disease (skeletal muscle) are the same deficiency in different tissues.'],
          ['Mycoplasma suis (eperythrozoonosis)', 'Hemotropic mycoplasma', 'An infectious HEMOLYTIC ANEMIA — attaches to the red cell surface. Classic transmission route: CONTAMINATED NEEDLES, and biting insects. Icterus, pallor, poor doing. Treat with tetracyclines.'],
          ['PCV2 / PMWS', 'PORCINE CIRCOVIRUS 2', 'Three findings: PALE KIDNEYS with white foci, ENLARGED LYMPH NODES, and EDEMA or pleural effusion. Progressive wasting in nursery and grower pigs, plus dermatitis-nephropathy syndrome. Diagnosis requires detecting VIRAL ANTIGEN IN LYMPHOID TISSUE by IHC or in situ hybridization — because the virus is ubiquitous, you must show it in the lesion to call it disease. There is no specific treatment: management is vaccination (highly effective), reducing co-infections, and improving husbandry.'],
          ['Leptospirosis ⚑Z', 'Leptospira', 'ABORTION and SMALL LITTER SIZE. Zoonotic.']
        ]
      },

      /* ---------------- Neurologic ---------------- */
      {
        type: 'table', title: 'Neurologic disease',
        columns: ['Disease', 'Agent', 'Features'],
        rows: [
          ['Pseudorabies (Aujeszky\'s disease) ⚑R', 'HERPESVIRUS (suid herpesvirus-1)', 'Affects piglets under 7 days most severely — near 100% mortality with CNS signs. Lesion: NECROTIZING TONSILLITIS. FATAL TO CATS AND DOGS that eat infected pork — the "mad itch," with frantic self-mutilation and rapid death. Pigs are the only natural host; every other species dies. Eradicated from commercial US herds — reportable; feral swine remain a reservoir.'],
