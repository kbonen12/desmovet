    lead:'What is the strongest argument against the aminoglycoside here?',
    a:'Nephrotoxicity is worst in volume-depleted patients',
    wrong:['Aminoglycosides have no gram-negative activity','Aminoglycosides cannot reach urinary concentrations','Aminoglycosides are contraindicated with any fluid therapy'],
    why:'Aminoglycosides carry three toxicities worth naming together — ototoxic, nephrotoxic and neuromuscular blockade — and the nephrotoxicity is worst in dehydrated patients, so they should never be given to a volume-depleted animal; once-daily dosing reduces renal accumulation. Both aminoglycosides and fluoroquinolones also lack anaerobic activity, because both depend on oxygen-dependent uptake or aerobic metabolism.'
  });

  Q.push({
    m:'sa-pharm',
    stem:'A dog is presented with a deep, necrotic bite-wound abscess. The clinician wants an agent with reliable activity against obligate anaerobes.',
    lead:'Which drug is the poorest choice?',
    a:'Enrofloxacin',
    wrong:['Metronidazole','Clindamycin','Amoxicillin-clavulanate'],
    why:'Fluoroquinolones and aminoglycosides have no anaerobic activity because both require oxygen-dependent uptake or aerobic metabolism, which is precisely why they fail in abscesses and necrotic tissue. The three best anaerobic choices are penicillins, clindamycin and metronidazole, with metronidazole the most reliably anaerobicidal.'
  });

  Q.push({
    m:'sa-pharm',
    stem:'A cat with a fractured femur is receiving buprenorphine and remains painful. The clinician considers doubling the buprenorphine dose.',
    lead:'Why will that not work?',
    a:'Buprenorphine has a ceiling effect — higher doses add side effects, not analgesia',
    wrong:['Buprenorphine is inactivated by feline glucuronidation','Buprenorphine has no analgesic activity in cats','Buprenorphine antagonizes its own receptor at higher doses only in cats'],
    why:'Buprenorphine is a partial mu agonist and butorphanol is a kappa agonist and mu antagonist; both, along with the NSAIDs as a class, have a ceiling effect where increasing the dose increases side effects without increasing analgesia. For severe pain the answer is to switch to a full mu agonist — morphine, hydromorphone, methadone or fentanyl — not to escalate. Buprenorphine does have excellent transmucosal absorption in cats.'
  });

  Q.push({
    m:'sa-pharm',
    stem:'A pig under halothane anesthesia develops a rapidly rising body temperature, muscle rigidity and severe acidosis.',
    lead:'Which drug is indicated, and what is its mechanism?',
    a:'Dantrolene — a ryanodine receptor antagonist that blocks calcium release from the sarcoplasmic reticulum',
    wrong:['Methocarbamol — a centrally acting muscle relaxant','Succinylcholine — a depolarizing neuromuscular blocker','Atipamezole — an alpha-2 antagonist'],
    why:'Malignant hyperthermia, or porcine stress syndrome, is treated and prevented with dantrolene, which antagonizes the ryanodine receptor and blocks calcium release from the sarcoplasmic reticulum. The same drug is used in horses for post-anesthetic myositis and exertional rhabdomyolysis. Methocarbamol is the tremorgenic-toxicosis relaxant and does nothing for the underlying calcium release.'
  });

  Q.push({
    m:'sa-pharm',
    stem:'A cat with immune-mediated hemolytic anemia is started on prednisolone. The clinician asks whether azathioprine should be added as a steroid-sparing adjunct, as it would be in a dog.',
    lead:'What is the correct answer?',
    a:'No — cats lack TPMT and develop severe marrow suppression; use chlorambucil or cyclosporine',
    wrong:['Yes, at half the canine dose','Yes, but only with weekly CBC monitoring','No — azathioprine causes fatal pulmonary edema in cats'],
    why:'Cats lack thiopurine methyltransferase and cannot metabolize azathioprine, developing severe and sometimes fatal bone marrow suppression; chlorambucil or cyclosporine are the feline alternatives. Azathioprine sits on the "never in cats" list alongside cisplatin (fatal pulmonary edema), 5-FU (fatal neurotoxicity), ketoconazole, permethrin and acetaminophen.'
  });

  Q.push({
    m:'sa-boards',
    stem:'A patient in respiratory distress has an SpO2 of 90% on room air.',
    lead:'What is the corresponding PaO2, and what does it mean clinically?',
    a:'60 mmHg — the threshold for oxygen supplementation',
    wrong:['80 mmHg — borderline, continue monitoring','50 mmHg — the threshold for visible cyanosis','30 mmHg — critical'],
    why:'The 90/60 rule is the one pair to memorize: an SpO2 of 90% corresponds to a PaO2 of 60 mmHg, and below that you are on the steep part of the oxyhemoglobin dissociation curve where small drops in saturation mean large drops in PaO2. Visible cyanosis requires a PaO2 under 50 mmHg and at least 5 g/dL of desaturated hemoglobin, which is why a severely anemic patient can be profoundly hypoxemic without ever looking cyanotic.'
  });

  Q.push({
    m:'diagnostics',
    stem:'A screening test for a disease with a herd prevalence of 0.1% has a sensitivity of 95% and a specificity of 95%. You test 100,000 animals: 95 true positives and 4,995 false positives.',
    lead:'What is the positive predictive value?',
    a:'About 1.9%',
    wrong:['About 95%','About 68%','About 50%'],
    why:'PPV = TP/(TP+FP) = 95/5,090 ≈ 1.9%. The test is unchanged — it is the rarity of the disease that destroys the meaning of a positive result, because the enormous healthy population generates far more false positives than there are true cases. The same test at 10% prevalence gives a PPV of 68%.'
  });

  Q.push({
    m:'diagnostics',
    stem:'A dog with intense non-seasonal pruritus, crusting at the ear margins and elbows, and a positive pinnal-pedal reflex has had two negative superficial skin scrapes.',
    lead:'How should the negative scrapes be interpreted?',
    a:'The scrape has low sensitivity, so a negative result does not rule out sarcoptic mange — treat empirically',
    wrong:['The scrape has high sensitivity, so sarcoptic mange is effectively excluded','The negative results confirm demodicosis instead','A third scrape is required before any treatment can be justified'],
    why:'Very few Sarcoptes mites are usually present, so the scrape misses most true cases — it is a low-sensitivity, high-specificity test. A negative does not exclude the diagnosis, while a positive is essentially conclusive. Because a sensitive test is what rules disease out (SnNout), an insensitive one cannot.'
  });

  Q.push({
    m:'diagnostics',
    stem:'You are choosing between two tests for a regulatory program in which a positive result means the animal is quarantined for life or euthanized.',
    lead:'Which test characteristic matters most?',
    a:'High specificity',
    wrong:['High sensitivity','High analytical sensitivity','A high negative predictive value'],
    why:'A false positive here is unrecoverable for that animal, so you need a test that almost never calls a healthy animal positive — that is specificity, and SpPin says a positive on a highly specific test rules disease in. Equine infectious anemia testing is exactly this setting. Sensitivity is what you optimize when a missed case is the expensive error.'
  });

  Q.push({
    m:'diagnostics',
    stem:'A herd is screened for bovine tuberculosis with the caudal fold tuberculin test, read at 72 hours. Reactors are then tested with the comparative cervical test.',
    lead:'What is the statistical logic of this two-step scheme?',
    a:'Serial testing — a sensitive screen followed by a specific confirmation, which raises overall specificity',
    wrong:['Parallel testing — running both tests raises overall sensitivity','Serial testing — which raises overall sensitivity','Parallel testing — which reduces the false negative rate to near zero'],
    why:'Testing only the positives from the first test and requiring both to agree is serial testing: overall specificity rises and overall sensitivity falls slightly. The caudal fold test is the sensitive herd screen; the comparative cervical test is the more specific follow-up that separates M. bovis from M. avium sensitization. Parallel testing — calling it positive if either test is positive — does the opposite.'
  });

  Q.push({
    m:'diagnostics',
    stem:'A continuous-scale assay reports a numeric value, and the laboratory lowers the cutoff used to call a result positive.',
    lead:'What happens to the test characteristics?',
    a:'Sensitivity rises and specificity falls',
    wrong:['Sensitivity falls and specificity rises','Both rise, because more information is used','Neither changes — they are fixed properties of the assay'],
    why:'More results cross a lower threshold, so more diseased animals are caught (sensitivity up) and more healthy animals are wrongly flagged (specificity down). The two always trade against each other for a given assay; the ROC curve plots that trade-off as sensitivity against 1 − specificity, and the area under it measures overall discrimination.'
  });

  Q.push({
    m:'diagnostics',
    stem:'Of 100 dogs tested, 40 truly have the disease. The test returns 36 true positives, 4 false negatives, 6 false positives and 54 true negatives.',
    lead:'What is the positive predictive value?',
    a:'85.7%',
    wrong:['90.0%','93.1%','40.0%'],
    why:'PPV = TP/(TP+FP) = 36/(36+6) = 36/42 = 85.7% — read across the test-positive row. The 90% figures are sensitivity (36/40) and specificity (54/60), read down the disease columns, and 93.1% is the NPV (54/58). Reading the grid in the wrong direction is the most common error on these items.'
  });

  Q.push({
    m:'diagnostics',
    stem:'A clinic adopts a new in-house test. Sensitivity and specificity are unchanged from the reference laboratory version, but the clinic serves a much higher-risk caseload than the reference population.',
    lead:'Which values change?',
    a:'PPV rises and NPV falls',
    wrong:['Sensitivity and specificity both rise','PPV falls and NPV rises','Nothing changes, because the test is the same'],
    why:'Sensitivity and specificity are properties of the test and do not move with the population. Predictive values do: as prevalence rises, a positive result is more likely to be real (PPV up) and a negative result is less reassuring (NPV down). This is why the same test performs differently in a referral hospital than in a wellness clinic.'
  });

  Q.push({
    m:'diagnostics',
    stem:'A test for a disease with a prevalence of 0.1% is evaluated. It returns a negative result on every animal tested, and is reported as 99.9% accurate.',
    lead:'What is the problem with that claim?',
    a:'Accuracy is inflated by the huge true-negative count; the sensitivity of this test is zero',
    wrong:['Accuracy is the correct summary measure and the test is excellent','The specificity is zero, which is what accuracy is hiding','Accuracy cannot be calculated without knowing the gold standard'],
    why:'Accuracy = (TP+TN)/total, and when 99.9% of animals are healthy a test that never calls anything positive scores 99.9% while catching no cases at all. Sensitivity is TP/(TP+FN) = 0/100 = 0%. Its specificity is a perfect 100% — which is exactly why accuracy alone is a misleading summary for a rare disease.'
  });

  Q.push({
    m:'diagnostics',
    stem:'An in-house chemistry analyzer is run five times on the same control sample. The five results are nearly identical to each other, but all five sit well above the control material\'s stated value.',
    lead:'How is this analyzer best described?',
    a:'Precise but inaccurate',
    wrong:['Accurate but imprecise','Both accurate and precise','Neither accurate nor precise'],
    why:'Precision is repeatability — how tightly repeated measurements cluster — and these cluster tightly. Accuracy is closeness to the true value, and they are all systematically high. A consistently miscalibrated analyzer is the textbook example of precise and inaccurate.'
  });

  Q.push({
    m:'diagnostics',
    stem:'A dog vaccinated against Lyme disease is tested with an antibody assay against the C6 peptide, which returns positive.',
    lead:'What does this result indicate?',
    a:'Natural exposure to Borrelia burgdorferi, because the C6 antibody is not produced in response to vaccination',
    wrong:['Vaccine response only, which is why the C6 test is used post-vaccination','Active clinical Lyme disease requiring immediate treatment','A false positive, since vaccinated dogs cannot be tested serologically'],
    why:'The whole point of the C6 test is its specificity for natural exposure: vaccinated dogs do not make antibody to that peptide, so a positive distinguishes exposure from vaccine response in a way general Borrelia serology cannot. Exposure is not the same as clinical disease — many seropositive dogs never develop signs.'
  });

  Q.push({
    m:'diagnostics',
    stem:'A test has a sensitivity of 90% and a specificity of 90%.',
    lead:'What is the positive likelihood ratio?',
    a:'9',
    wrong:['0.11','0.9','1.8'],
    why:'LR+ = Sn/(1 − Sp) = 0.90/0.10 = 9, meaning a positive result makes the disease about nine times more likely than it was beforehand. The negative likelihood ratio is (1 − Sn)/Sp = 0.10/0.90 = 0.11. An LR+ above 10 or an LR− below 0.1 is considered strongly informative.'
  });

  Q.push({
    m:'diagnostics',
    stem:'A shelter wants to be as certain as possible that no infected animal enters the general population. Two independent tests are available, and any animal positive on either test will be isolated.',
    lead:'What is the effect of this strategy?',
    a:'Parallel testing — sensitivity rises and specificity falls',
    wrong:['Parallel testing — specificity rises and sensitivity falls','Serial testing — specificity rises and sensitivity falls','Serial testing — sensitivity rises and specificity falls'],
    why:'Calling an animal positive if either test is positive is parallel testing: fewer cases are missed (sensitivity up) at the cost of more healthy animals being isolated (specificity down). That trade is appropriate when a missed case is unacceptable. Requiring both tests to agree — serial testing — would do the opposite.'
  });

  Q.push({
    m:'diagnostics',
    stem:'Two clinicians independently score the same 200 radiographs as normal or abnormal. Only 6% of the films are truly abnormal, and the two agree on 92% of them.',
    lead:'Which statistic should be reported instead of raw percent agreement?',
    a:'Kappa',
    wrong:['Specificity','Positive predictive value','The likelihood ratio'],
    why:'When one outcome is rare, two observers who both call almost everything normal will agree a high proportion of the time by chance alone. Kappa corrects agreement for the amount expected by chance, which is why it is the statistic reported for inter-observer and inter-test agreement.'
  });

  Q.push({
    m:'diagnostics',
    stem:'An exam item prints the standard lettered 2 × 2, with disease status across the top and test result down the side: cell A is test-positive and diseased, B is test-positive and healthy, C is test-negative and diseased, D is test-negative and healthy.',
    lead:'Which expression gives the sensitivity?',
    a:'A / (A + C)',
    wrong:['A / (A + B)','D / (B + D)','D / (C + D)'],
    why:'Sensitivity is read straight down the diseased column, which contains A and C — the animals that truly have the disease, split by whether the test found them. A/(A+B) is the PPV, read across the positive row; D/(B+D) is specificity; D/(C+D) is the NPV.'
  });

  Q.push({
    m:'diagnostics',
    stem:'Using the same lettered layout — A test-positive and diseased, B test-positive and healthy, C test-negative and diseased, D test-negative and healthy.',
    lead:'Which cell represents the false negatives?',
    a:'C',
    wrong:['A','B','D'],
    why:'A false negative is a diseased animal the test called negative — the test-negative row crossed with the diseased column, which is C. B is the false positives, and A and D are the two correct cells. Mislabelling C as B is the single most common error on lettered-table items.'
  });

  Q.push({
    m:'diagnostics',
    stem:'A lettered 2 × 2 is given with A = 90, B = 60, C = 10, D = 340. A is test-positive and diseased, B is test-positive and healthy, C is test-negative and diseased, D is test-negative and healthy.',
    lead:'What is the positive predictive value?',
    a:'60%',
    wrong:['90%','85%','15%'],
    why:'PPV = A/(A+B) = 90/150 = 60% — read across the test-positive row. The 90% figure is the sensitivity, A/(A+C) = 90/100, read down the diseased column. Reading the grid in the wrong direction is what turns a 60% answer into a 90% one.'
  });

  Q.push({
    m:'diagnostics',
    stem:'On the same lettered 2 × 2, an item asks you to identify the denominator used for specificity.',
    lead:'Which cells make up that denominator?',
    a:'B + D — all the truly healthy animals',
    wrong:['A + C — all the truly diseased animals','C + D — all the test-negative animals','A + B — all the test-positive animals'],
    why:'Specificity = D/(B+D). The denominator is the healthy column: every animal without the disease, split by whether the test correctly cleared it. A+C is the denominator for sensitivity, C+D for NPV, and A+B for PPV.'
  });

  Q.push({
    m:'diagnostics',
    stem:'A herd of 600 cattle has a true prevalence of 10%. The available test is 90% sensitive and 95% specific.',
    lead:'How many infected cattle will this test MISS?',
    a:'6',
    wrong:['54','27','60'],
    why:'Go straight to the error cell with the complement: diseased = 600 × 10% = 60, and the test misses (1 − 0.90) = 10% of them, so FN = 60 × 0.10 = 6. There is no need to compute the 54 true positives and subtract. The 27 is the false positive count — 540 healthy × (1 − 0.95) — and 60 is the diseased column itself.'
  });

  Q.push({
    m:'diagnostics',
    stem:'A clinic screens 400 dogs. Prevalence is 25%, and the test is 88% sensitive and 90% specific.',
    lead:'How many healthy dogs will be wrongly flagged as positive?',
    a:'30',
    wrong:['12','88','300'],
    why:'False positives come out of the healthy column via the complement of specificity: healthy = 400 × 75% = 300, and 1 − 0.90 = 10% of them are wrongly flagged, so FP = 300 × 0.10 = 30. The 12 is the false negatives — 100 diseased × (1 − 0.88) — and 300 is the healthy column itself.'
  });

  Q.push({
    m:'diagnostics',
    stem:'A student is asked for the number of false negatives a 75% sensitive test will produce in a group of 80 truly infected animals.',
    lead:'What is the most direct route to the answer?',
    a:'80 × (1 − 0.75) = 20',
    wrong:['80 × 0.75 = 60, then that is the answer','80 ÷ 0.75 = 107','80 × 0.25 × 0.75 = 15'],
    why:'Sensitivity is the fraction of diseased animals the test catches, so its complement is the fraction it misses — apply (1 − Sn) to the diseased column and you land on the false negatives in one step. Computing 80 × 0.75 = 60 gives the true positives, which then needs a subtraction; the complement skips it entirely.'
  });

})(window.NAVLE_QUESTIONS);

<script>
(function(){
"use strict";
var M = window.NAVLE_MODULES || [];
var QB = window.NAVLE_QUESTIONS || [];
var DOCS = window.NAVLE_DOCS || [];
var GROUP_ORDER = ['Start here','Species','Infectious disease','Differential clusters','Cross-cutting'];
/* Chapters in these groups render fully open with no toggles — they are short,
 * and they are the pages you read rather than search. */
var ALWAYS_OPEN = { 'Start here': true };

/* Per-chapter identity colour. Hues come from a validated categorical set and
 * are used only as rules, numerals, dots and tinted bands — never as body text
 * colour, so contrast never depends on them. */
var HUES = {
  blue:   ['#2a78d6','#5b9cea'], orange: ['#c85a22','#e0783f'],
  teal:   ['#1a8a68','#35a883'], amber:  ['#a67c00','#d4a52a'],
  plum:   ['#8a4f7d','#b878aa'], violet: ['#5245a8','#8d81e0'],
  green:  ['#3f7a2e','#66a84f'], red:    ['#b0433c','#dd7a72'],
  slate:  ['#4c5a68','#8496a8']
};
var ACCENT = {
  equine:'orange', bovine:'teal', swine:'plum', smallrum:'green', camelids:'violet',
  'sa-tox':'red', 'sa-heme':'blue', 'sa-cardioresp':'blue', 'sa-neuro':'blue',
  'sa-medicine':'blue', 'sa-feline':'blue', 'sa-vectorborne':'blue',
  'sa-parasites':'green', 'sa-pharm':'slate', 'sa-boards':'slate',
  'id-smallanimal':'blue', 'clusters-sa':'blue', 'clusters-la':'orange',
  petbirds:'amber', poultry:'amber', 'avian-crosscutting':'amber',
  fish:'teal', herps:'green', rabbits:'plum', ferrets:'plum', rodents:'plum', primates:'violet',
  oncology:'red', parasitology:'green', 'tox-regulatory':'red', latox:'red',
  reportable:'red', therapeutics:'slate', 'id-exotic-companion':'amber',
  blueprint:'slate', 'bread-and-butter':'slate', diagnostics:'teal'
};
function hueOf(id){
  var pair = HUES[ACCENT[id] || 'slate'];
  return document.documentElement.getAttribute('data-theme')==='dark' ? pair[1] : pair[0];
}
function monogram(t){
  var w = t.replace(/[^A-Za-z &]/g,'').split(/\s+/).filter(function(x){ return x && x!=='&'; });
  if (w.length >= 2) return (w[0][0] + w[1][0]).toUpperCase();
  return t.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase();
}
function accentVars(id){
  var h = hueOf(id);
  return '--mod-accent:'+h+';--mod-tint:color-mix(in srgb,'+h+' 9%,var(--surface-1));'+
         '--mod-br:color-mix(in srgb,'+h+' 24%,var(--border));';
}

var content = document.getElementById('content');
var nav = document.getElementById('nav');
var search = document.getElementById('search');

var state = {
  view:'home', id:(M[0]||{}).id, doc:null,
  open:{},                       // moduleId -> {sectionIndex:true}
  cfg:{ kind:'mixed', scope:'all', len:20 },
  run:null,                      // active practice run
  stats:{}                       // moduleId -> {right, seen}  (this session only)
};

/* ---------------- helpers ---------------- */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// Renders ⚑R / ⚑Z reportable+zoonotic flags, and "Agent\nsub" second lines.
function fmt(s){
  var t = esc(s);
  t = t.replace(/⚑R/g,'<span class="flag r" title="Reportable">R</span>')
       .replace(/⚑Z/g,'<span class="flag z" title="Zoonotic">Z</span>');
  t = t.replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>')
       .replace(/&lt;i&gt;/g,'<i>').replace(/&lt;\/i&gt;/g,'</i>');
  if(/^(✓\*?|–)$/.test(s)){
    if(s==='✓') return '<span class="yes">✓</span>';
    if(s==='✓*') return '<span class="yes-c">✓*</span>';
    return '<span class="no">–</span>';
  }
  var parts = t.split('\n');
  if(parts.length > 1) return parts[0] + '<span class="agent">' + parts.slice(1).join(' ') + '</span>';
  return t;
}
function strip(s){ return String(s).replace(/<[^>]+>/g,''); }
function byId(id){ for(var i=0;i<M.length;i++) if(M[i].id===id) return M[i]; return null; }
function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}
function plural(n, one, many){ return n + ' ' + (n===1?one:(many||one+'s')); }
function footer(){
  return '<div class="footer">Study aid only — verify drug doses, protocols, and reporting requirements '+
    'against current references before clinical use. Part of <strong>desmoVet</strong>, a resource hub for '+
    'veterinarians and veterinary students.</div>';
}
/* The label toggle only flips a class — both label sets are already in the DOM. */
function wireMatrix(){
  content.querySelectorAll('[data-mxseg]').forEach(function(seg){
    var grid = document.getElementById(seg.dataset.mxseg);
    seg.querySelectorAll('button').forEach(function(b){
      b.onclick = function(){
        seg.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
        b.classList.add('on');
        if(!grid) return;
        grid.classList.toggle('letters', b.dataset.mode === 'letters');
        grid.classList.toggle('build',   b.dataset.mode === 'build');
      };
    });
  });
}
function wireGoto(){
  content.querySelectorAll('[data-goto]').forEach(function(a){
    a.addEventListener('click', function(e){ e.preventDefault(); go('module', a.dataset.goto); });
  });
}
function chapterLink(id){
  var m = byId(id);
  return m ? '<a href="#" data-goto="'+id+'">Read the ' + esc(m.title) + ' chapter →</a>' : '';
}

/* Content counts, used in tiles, plates and the coverage map. */
function tally(m){
  var t = { sections:0, rows:0, cards:0, values:0 };
  m.sections.forEach(function(s){
    if(!R[s.type]) return;
    t.sections++;
    if(s.type==='table') t.rows += s.rows.length;
    else if(s.type==='rapidfire') t.cards += s.items.length;
    else if(s.type==='cloze') t.values += s.items.length;
  });
  return t;
}

/* ---------------- nav ---------------- */
function buildNav(){
  var groups = {};
  M.forEach(function(m){ (groups[m.group] = groups[m.group] || []).push(m); });
  var order = GROUP_ORDER.filter(function(g){ return groups[g]; })
    .concat(Object.keys(groups).filter(function(g){ return GROUP_ORDER.indexOf(g)<0; }));
  var html = '<div class="navgroup">Study</div>'+
    '<div class="navlink" data-view="home"><span class="lbl">Home</span></div>'+
    '<div class="navlink" data-view="practice"><span class="lbl">Practice</span>'+
      '<span class="pct">'+bankSize()+'</span></div>'+
    '<div class="navlink" data-view="coverage"><span class="lbl">Coverage map</span></div>';
  // Species list reads top-down by exam weight, so the biggest blocks come first.
  var sortW = function(m){ return m.weight || m.covWeight || 0; };
  if(groups['Species']) groups['Species'].sort(function(a,b){ return sortW(b)-sortW(a); });
  order.forEach(function(g){
    html += '<div class="navgroup">'+esc(g)+'</div>';
    groups[g].forEach(function(m){
      html += '<div class="navlink" data-id="'+m.id+'" style="--mod-accent:'+hueOf(m.id)+'">'+
        '<span class="dot"></span><span class="lbl">'+esc(m.title)+'</span>'+
        (m.weight ? '<span class="pct">'+m.weight+'%</span>' : '')+'</div>';
    });
  });
  if (DOCS.length) {
    html += '<div class="navgroup">Documents</div>'+
      '<div class="navlink" data-view="docs"><span class="lbl">Source documents</span>'+
      '<span class="pct">'+DOCS.length+'</span></div>';
  }
  nav.innerHTML = html;
  nav.querySelectorAll('.navlink').forEach(function(a){
    a.addEventListener('click', function(){
      if(a.dataset.view) go(a.dataset.view); else go('module', a.dataset.id);
      closeSidebar();
    });
  });
}
function markNav(){
  nav.querySelectorAll('.navlink').forEach(function(a){
    var v = (state.view==='doc') ? 'docs' : state.view;
    var on = (state.view==='module' && a.dataset.id===state.id) ||
             (state.view!=='module' && a.dataset.view===v);

}

/* ---------------- section renderers ----------------
 * Bodies only — the section header owns the title. */
var R = {
  callout: function(s){
    var v = s.variant || 'pearl';
    var glyph = v==='danger' ? '▲' : v==='discrim' ? '⇄' : v==='warn' ? '!' : '◆';
    var label = CALL_LABEL[v] || 'Note';
    var body = s.body ? '<p>'+fmt(s.body)+'</p>' : '';
    var list = s.list ? '<ul>'+s.list.map(function(x){return '<li>'+fmt(x)+'</li>';}).join('')+'</ul>' : '';
    return '<div class="callout c-'+v+'">'+
      '<div class="ct"><span class="glyph">'+glyph+'</span>'+esc(label)+'</div>'+
      (s.title ? '<div class="cname">'+esc(s.title)+'</div>' : '')+
      body+list+'</div>';
  },
  table: function(s){
    var t = '<table'+(s.wide?' class="wide"':'')+'><thead><tr>'+
      s.columns.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>'+
      s.rows.map(function(r){
        return '<tr>'+r.map(function(c){return '<td>'+fmt(c)+'</td>';}).join('')+'</tr>';
      }).join('')+'</tbody></table>';
    var n = s.note ? '<div class="tnote">'+esc(s.note)+'</div>' : '';
    return '<div class="tablewrap">'+n+'<div class="tablescroll">'+t+'</div></div>';
  },
  list: function(s){
    return '<ul class="plainlist">'+s.items.map(function(x){return '<li>'+fmt(x)+'</li>';}).join('')+'</ul>';
  },
  rapidfire: function(s){
    return '<div class="rf">'+s.items.map(function(p){
      return '<div class="rf-row"><div class="rf-cue">'+fmt(p[0])+'</div>'+
        '<div class="rf-arrow">&rarr;</div><div class="rf-ans">'+fmt(p[1])+'</div></div>';
    }).join('')+'</div>';
  },
  chart: function(s){
    var max = Math.max.apply(null, s.data.map(function(d){return d[1];}));
    var rows = s.data.map(function(d){
      var w = (d[1]/max*100).toFixed(1);
      return '<div class="bar-row"><div class="bar-label" title="'+esc(d[0])+'">'+esc(d[0])+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+w+'%"></div></div>'+
        '<div class="bar-val">'+d[1]+'%</div></div>';
    }).join('');
    return '<div class="chart">'+(s.note?'<p class="cnote">'+esc(s.note)+'</p>':'')+rows+
      (s.footnote?'<p class="cfoot">'+esc(s.footnote)+'</p>':'')+'</div>';
  },
  /* The 2x2 contingency table, drawn rather than tabulated — this is the shape
   * the concept lives in, and reading it off a grid is the whole skill. Cells are
   * placed by name so the mobile template can restack without reflowing. */
  matrix2x2: function(s){
    var c = s.cells, area = ['tp','fp','fn','tn'], LET = ['A','B','C','D'];
    var id = 'mx' + (R.matrix2x2._n = (R.matrix2x2._n || 0) + 1);
    // A third mode is offered only when the data supplies a formula for every cell.
    var hasExpr = c.every(function(x){ return !!x.expr; });
    var cell = function(x, i){
      return '<div class="mx-cell mx-'+area[i]+' '+(x.ok?'good':'bad')+'" '+
        'title="'+esc(x.tip||'')+'">'+
        '<div class="cl">'+esc(x.label)+'</div>'+
        '<div class="ck"><span class="k-abbr">'+esc(x.key)+'</span>'+
          '<span class="k-letter">'+LET[i]+'</span>'+
          (x.expr?'<span class="k-expr">'+esc(x.expr)+'</span>':'')+'</div></div>';
    };
    // Letter forms of the four ratios, in the a=TP b=FP c=FN d=TN convention.
    var LF = { 'Sensitivity':'A / (A + C)', 'Specificity':'D / (B + D)',
               'PPV':'A / (A + B)', 'NPV':'D / (C + D)' };
    var marg = function(m){
      var lf = LF[m.name];
      return '<div class="mx-marg">'+
        '<span class="n-name">'+esc(m.name)+'</span>'+
        (m.buildName?'<span class="n-build">'+esc(m.buildName)+'</span>':
                     '<span class="n-build">'+esc(m.name)+'</span>')+
        (m.formula?'<small>'+
          '<span class="f-abbr">'+esc(m.formula)+'</span>'+
          (lf?'<span class="f-letter">'+esc(lf)+'</span>':'')+
          (m.buildFormula?'<span class="f-build">'+esc(m.buildFormula)+'</span>':'')+
        '</small>':'')+'</div>';
    };
    var side = function(m, a){
      return '<div class="mx-side mx-'+a+'"><span class="mx-arrow">&rarr;</span>'+marg(m)+'</div>';
    };
    var under = function(m, a){
      return '<div class="mx-under mx-'+a+'"><span class="mx-arrow">&darr;</span>'+marg(m)+'</div>';
    };
    var bar = '<div class="mxbar"><span class="lab">Read it as</span>'+
      '<span class="seg" data-mxseg="'+id+'">'+
        '<button data-mode="abbr" class="on" type="button">TP · FP · FN · TN</button>'+
        '<button data-mode="letters" type="button">A · B · C · D</button>'+
        (hasExpr?'<button data-mode="build" type="button">Formula</button>':'')+
      '</span>'+
      '<span class="hint" style="font-size:12px;color:var(--text-muted)">'+
      (hasExpr ? 'Exam items print the letters. <b>Formula</b> shows how to build each cell '+
                 'straight from prevalence, sensitivity and specificity.'
               : 'Exam items usually print the lettered version.')+'</span></div>';
    var h = '<div class="mx" id="'+id+'">'+
      '<div class="mx-colhead">'+esc(s.colTitle)+'</div>'+
      '<div class="mx-collabel mx-c1">'+esc(s.cols[0])+'</div>'+
      '<div class="mx-collabel mx-c2">'+esc(s.cols[1])+'</div>'+
      '<div class="mx-rowhead">'+esc(s.rowTitle)+'</div>'+
      '<div class="mx-rowlabel mx-rp">'+esc(s.rows[0])+'</div>'+
      '<div class="mx-rowlabel mx-rn">'+esc(s.rows[1])+'</div>'+
      cell(c[0],0)+cell(c[1],1)+cell(c[2],2)+cell(c[3],3)+
      side(s.rowMargins[0],'pv')+side(s.rowMargins[1],'nv')+
      under(s.colMargins[0],'sn')+under(s.colMargins[1],'sp')+
      '</div>';
    var n = s.note ? '<div class="tnote" style="border:0;padding:12px 2px 0">'+esc(s.note)+'</div>' : '';
    return bar + h + n;
  },

  /* In the chapter a calcset is just the raw counts; the drilling happens in
   * Practice, where each scenario becomes one question per measure. */
  calcset: function(s){
    var n = s.note ? '<div class="tnote">'+esc(s.note)+'</div>' : '';
    var t = '<table><thead><tr><th>Population</th><th>TP</th><th>FP</th><th>FN</th><th>TN</th>'+
      '<th>Total</th></tr></thead><tbody>'+
      s.scenarios.map(function(x){
        return '<tr><td>'+esc(x.stem.split('.')[0])+'</td><td>'+x.tp+'</td><td>'+x.fp+'</td>'+
          '<td>'+x.fn+'</td><td>'+x.tn+'</td><td>'+(x.tp+x.fp+x.fn+x.tn)+'</td></tr>';
      }).join('')+'</tbody></table>';
    return '<div class="tablewrap">'+n+'<div class="tablescroll">'+t+'</div></div>';
  },

  /* A cloze section reads as a fact list with the answer set in place, and the
   * same items drive the typed-answer drill in Practice. */
  cloze: function(s){
    var n = s.note ? '<div class="tnote">'+esc(s.note)+'</div>' : '';
    return '<div class="tablewrap">'+n+'<div class="clozelist">'+s.items.map(function(it){
      return '<div class="cz-row"><div class="cz-q">'+
        fmt(it.q).replace(/_{2,}/, '<b class="cz-a">'+esc(it.a)+'</b>')+'</div>'+
        (it.why?'<div class="cz-why">'+fmt(it.why)+'</div>':'')+'</div>';
    }).join('')+'</div></div>';
  }
};
var CALL_LABEL = {pearl:'Board pearl', danger:'Watch out', warn:'Read this', discrim:'Discriminator'};

/* ---------------- chapter rendering ----------------
 * Sections are a numbered list on hairlines, not a stack of cards. Callouts —
 * pearls, discriminators, warnings — render inline and open, because they are
 * the lines most worth seeing and hiding them behind a toggle wastes them.
 * Everything else collapses to a title, a preview and a count.
 */
function sectionMeta(s){
  var title = s.title, count = '', prev = '';
  if(s.type==='table'){
    count = plural(s.rows.length, 'row');
    prev  = s.rows.slice(0,4).map(function(r){ return String(r[0]).split('\n')[0]; }).join(' · ');
  } else if(s.type==='rapidfire'){
    count = plural(s.items.length, 'card');
    prev  = s.items.slice(0,3).map(function(p){ return p[0]; }).join(' · ');
  } else if(s.type==='list'){
    count = plural(s.items.length, 'item');
    prev  = String(s.items[0]||'');
  } else if(s.type==='chart'){
    count = plural(s.data.length, 'bar');
    prev  = s.data.slice(0,4).map(function(d){ return d[0]; }).join(' · ');
  } else if(s.type==='backcalcset'){
    count = plural(s.scenarios.length, 'population');
    prev  = 'Given Sn, Sp and prevalence — solve for the cell counts';
  } else if(s.type==='calcset'){
    count = plural(s.scenarios.length, 'population');
    prev  = s.scenarios.length * 6 + ' calculation questions in Practice';
  } else if(s.type==='matrix2x2'){
    count = '2 × 2';
    prev  = s.cells.map(function(x){ return x.key; }).join(' · ');
  } else if(s.type==='cloze'){
    count = plural(s.items.length, 'value');
    prev  = s.items.slice(0,3).map(function(it){ return strip(it.q).replace(/_{2,}/,'___'); }).join(' · ');
  } else if(s.type==='callout'){
    title = title || (CALL_LABEL[s.variant] || 'Note');
    count = '';
    prev  = s.body ? s.body : (s.list ? s.list[0] : '');
  }
  return { title: strip(title || 'Section'), count: count, prev: strip(prev).slice(0,140) };
}

function renderModule(id){
  var m = byId(id); if(!m) return;
  if(!state.open[id]) state.open[id] = {};
  var openMap = state.open[id];
  var isStatic = !!ALWAYS_OPEN[m.group];
  var secs = m.sections.filter(function(s){ return R[s.type]; });
  var t = tally(m);

  var head =
    '<div class="plate">'+
      '<div class="eyebrow">'+esc(m.group)+
        (m.weight ? ' &nbsp;·&nbsp; <b>'+m.weight+'% of the NAVLE</b>'

      '<h1>'+esc(m.title)+'</h1>'+
      (m.tagline?'<p class="tagline">'+esc(m.tagline)+'</p>':'')+
      '<div class="platestats">'+
        '<div class="pstat"><b>'+t.sections+'</b><span>Sections</span></div>'+
        (t.rows ? '<div class="pstat"><b>'+t.rows+'</b><span>Table rows</span></div>' : '')+
        (t.cards ? '<div class="pstat"><b>'+t.cards+'</b><span>Recall cues</span></div>' : '')+
        (t.values ? '<div class="pstat"><b>'+t.values+'</b><span>Typed values</span></div>' : '')+
        (countQuestions(m.id) ? '<div class="pstat"><b>'+countQuestions(m.id)+'</b><span>Practice Qs</span></div>' : '')+
      '</div>'+
    '</div>';

  var body = '<div class="sections">', n = 0;
  secs.forEach(function(s, k){
    var meta = sectionMeta(s);
    // Callouts are always inline and open, in every chapter.
    if(s.type === 'callout'){
      body += '<div class="inlinecall" id="sec-'+k+'">'+R.callout(s)+'</div>';
      return;
    }
    n++;
    var num = (n<10?'0':'') + n;
    if(isStatic){
      body +=
        '<section class="sec static" id="sec-'+k+'">'+
          '<div class="statichead">'+
            '<span class="secnum">'+num+'</span>'+
            '<span class="sectitle">'+esc(meta.title)+'</span>'+
            '<span class="seccount">'+esc(meta.count)+'</span>'+
          '</div>'+
          '<div class="secbody">'+ R[s.type](s) +'</div>'+
        '</section>';
      return;
    }
    var isOpen = !!openMap[k];
    body +=
      '<section class="sec'+(isOpen?' open':'')+'" id="sec-'+k+'">'+
        '<button class="sechead" data-sec="'+k+'" aria-expanded="'+isOpen+'">'+
          '<span class="secnum">'+num+'</span>'+
          '<span class="lines"><span class="sectitle">'+esc(meta.title)+'</span>'+
            (meta.prev?'<span class="secprev">'+esc(meta.prev)+'</span>':'')+'</span>'+
          '<span class="seccount">'+esc(meta.count)+'</span>'+
          '<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" '+
            'stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l6 6-6 6"/></svg>'+
        '</button>'+
        '<div class="secbody">'+ R[s.type](s) +'</div>'+
      '</section>';
  });
  body += '</div>';

  var rail = '<aside class="rail"><div class="railtitle">In this chapter</div>';
  secs.forEach(function(s, k){
    rail += '<button class="railitem'+(s.type==='callout'?' iscall':'')+'" data-jump="'+k+'">'+
      esc(sectionMeta(s).title)+'</button>';
  });
  if(!isStatic){
    rail += '<div class="railtools">'+
      '<button class="btn tiny" id="expandAll">Expand all</button>'+
      '<button class="btn tiny" id="collapseAll">Collapse all</button></div>';
  }
  rail += '</aside>';

  content.innerHTML = '<div style="'+accentVars(m.id)+'">'+ head +
    '<div class="chapterwrap"><div class="chapterbody">'+ body + footer() +'</div>'+ rail +'</div></div>';

  function setOpen(k, want){
    var el = document.getElementById('sec-'+k);
    if(!el || !el.classList.contains('sec') || el.classList.contains('static')) return;
    el.classList.toggle('open', want);
    var h = el.querySelector('.sechead');
    if(h) h.setAttribute('aria-expanded', String(want));
    openMap[k] = want;
  }
  content.querySelectorAll('.sechead').forEach(function(b){
    b.addEventListener('click', function(){
      var k = +b.dataset.sec;
      setOpen(k, !document.getElementById('sec-'+k).classList.contains('open'));
    });
  });
  content.querySelectorAll('[data-jump]').forEach(function(b){
    b.addEventListener('click', function(){
      var k = +b.dataset.jump;
      setOpen(k, true);
      var el = document.getElementById('sec-'+k);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
  if(!isStatic){
    document.getElementById('expandAll').onclick = function(){ secs.forEach(function(_,k){ setOpen(k,true); }); };
    document.getElementById('collapseAll').onclick = function(){ secs.forEach(function(_,k){ setOpen(k,false); }); };
  }

  var railItems = content.querySelectorAll('.railitem');
  function syncRail(){
    var best = 0, bestTop = -1e9;
    secs.forEach(function(_, k){
      var el = document.getElementById('sec-'+k); if(!el) return;
      var top = el.getBoundingClientRect().top - 95;
      if(top <= 0 && top > bestTop){ bestTop = top; best = k; }
    });
    railItems.forEach(function(b){ b.classList.toggle('cur', +b.dataset.jump === best); });
  }
  if(renderModule._scroll) window.removeEventListener('scroll', renderModule._scroll);
  renderModule._scroll = syncRail;
  window.addEventListener('scroll', syncRail, {passive:true});
  syncRail();
  wireGoto();
  wireMatrix();
  window.scrollTo(0,0);
}

/* ==========================================================================
   Practice bank — everything is multiple choice

   Two sources, one format:
     'case'  — the hand-written vignettes, each with three chosen look-alikes
     'rapid' — chapter rapid-fire cues, with distractors drawn from the other
               answers in the same chapter so they stay plausible
   ========================================================================== */
function caseQuestions(){
  return QB.map(function(c){
    var mod = byId(c.m);
    return { type:'case', m:c.m, src:mod?mod.title:'', stem:c.stem, q:c.lead,
             a:c.a, wrong:(c.wrong||[]).slice(0,3), why:c.why };
  });
}
var RAPID_CACHE = null;
function rapidQuestions(){
  if(RAPID_CACHE) return RAPID_CACHE;
  var out = [];
  M.forEach(function(m){
    // Pool of every answer in this chapter, used as the distractor source.
    var pool = [];
    m.sections.forEach(function(s){
      if(s.type==='rapidfire') s.items.forEach(function(p){ pool.push(strip(p[1])); });
    });
    if(pool.length < 4) return;   // too few to build honest distractors
    m.sections.forEach(function(s){
      if(s.type!=='rapidfire') return;
      s.items.forEach(function(p){
        var ans = strip(p[1]);
        var others = [];
        shuffle(pool).forEach(function(x){
          if(x !== ans && others.indexOf(x) < 0 && others.length < 3) others.push(x);
        });
        if(others.length < 3) return;
        out.push({ type:'rapid', m:m.id, src:m.title, stem:'', q:strip(p[0]),
                   a:ans, wrong:others,
                   why:'From the ' + m.title + ' rapid-fire list' +
                       (s.title ? ' (' + strip(s.title) + ')' : '') + '.' });
      });
    });
  });
  RAPID_CACHE = out;
  return out;
}
/* Typed-answer items. Unlike the two multiple-choice sources these are recall,
 * not recognition — you type the value. Answers are matched leniently: case,
 * spacing, commas, dash style, "to" for a range and a trailing unit are all
 * ignored, single numbers compare numerically, and an explicit `accept` list
 * covers the rest. There is still an "I had it right" override, because no
 * matcher gets every phrasing. */
/* Calculation items. Every expected answer is computed from the scenario's four
 * counts, so the arithmetic cannot drift from the table the student is shown. */
var MEASURES = [
  { key:'sensitivity', name:'sensitivity',
    calc:function(x){ return x.tp / (x.tp + x.fn); },
    lead:'What is the sensitivity of this test?',
    why:'Sensitivity = TP / (TP + FN) — read straight down the diseased column. It is a property of the test and does not change with prevalence.' },
  { key:'specificity', name:'specificity',
    calc:function(x){ return x.tn / (x.tn + x.fp); },
    lead:'What is the specificity of this test?',
    why:'Specificity = TN / (TN + FP) — read straight down the healthy column. Also a property of the test, independent of prevalence.' },
  { key:'ppv', name:'positive predictive value',
    calc:function(x){ return x.tp / (x.tp + x.fp); },
    lead:'What is the positive predictive value?',
    why:'PPV = TP / (TP + FP) — read across the test-positive row. Unlike sensitivity it depends on how common the disease is in this population.' },
  { key:'npv', name:'negative predictive value',
    calc:function(x){ return x.tn / (x.tn + x.fn); },
    lead:'What is the negative predictive value?',
    why:'NPV = TN / (TN + FN) — read across the test-negative row. It rises as the disease becomes rarer.' },
  // Prevalence is only asked on scenarios flagged askPrev — otherwise it dominates the deck.
  { key:'prevalence', name:'prevalence', gate:'askPrev',
    calc:function(x){ return (x.tp + x.fn) / (x.tp + x.fp + x.fn + x.tn); },
    lead:'What is the true prevalence in this population?',
    why:'Prevalence = (TP + FN) / total — the diseased column over everything. It is the hinge on which PPV and NPV turn.' }
];

/* Back-calculation: given sensitivity, specificity, prevalence and a population
 * size, reconstruct a cell count. This is the direction exam items are usually
 * written in, and the work runs down the columns — population splits into
 * diseased and healthy first, then sensitivity acts on one column and
 * specificity on the other. */
function bcCells(x){
  var dis = x.n * x.prev / 100, hea = x.n - dis;
  var tp = dis * x.sn / 100, fn = dis - tp;
  var tn = hea * x.sp / 100, fp = hea - tn;
  return { dis:dis, hea:hea, tp:tp, fn:fn, tn:tn, fp:fp, pos:tp + fp, neg:tn + fn };
}
var BACK_MEASURES = [
  { key:'fp', lead:'How many FALSE POSITIVES will this test produce?',
    get:function(c){ return c.fp; },
    why:'False positives come out of the healthy column: healthy = total × (1 − prevalence), and the test wrongly flags the fraction it fails to clear, which is (1 − specificity). So FP = healthy × (1 − specificity).' },
  { key:'tp', lead:'How many TRUE POSITIVES will this test produce?',
    get:function(c){ return c.tp; },
    why:'True positives come out of the diseased column: diseased = total × prevalence, and sensitivity is the fraction of those the test catches. So TP = diseased × sensitivity.' },
  { key:'fn', lead:'How many FALSE NEGATIVES will this test produce?',
    get:function(c){ return c.fn; },
    why:'The diseased animals the test misses: FN = diseased × (1 − sensitivity). Diseased = total × prevalence.' },
  { key:'tn', lead:'How many TRUE NEGATIVES will this test produce?',
    get:function(c){ return c.tn; },
    why:'The healthy animals the test correctly clears: TN = healthy × specificity, where healthy = total × (1 − prevalence).' },
  { key:'pos', lead:'How many animals will test POSITIVE in total?',
    get:function(c){ return c.pos; },
    why:'The whole test-positive row: TP + FP. Note how much of it is false positives once the disease is uncommon — that is the PPV problem in raw counts.' },
  { key:'dis', lead:'How many animals in this population truly HAVE the disease?', gate:'askDiseased',
    get:function(c){ return c.dis; },
    why:'Total × prevalence. This is always the first step — split the population into the two disease columns before applying sensitivity or specificity to either one.' }
];
var BACK_CACHE = null;
function backQuestions(){
  if(BACK_CACHE) return BACK_CACHE;
  var out = [];
  M.forEach(function(m){
    m.sections.forEach(function(sec){
      if(sec.type!=='backcalcset') return;
      sec.scenarios.forEach(function(x){
        var c = bcCells(x), kept = [];
        BACK_MEASURES.forEach(function(bm){
          if(bm.gate && !x[bm.gate]) return;
          var v = bm.get(c);
          // counts must be far enough apart that the grader cannot confuse two of them
          var all = ['fp','tp','fn','tn','pos','dis'].map(function(k){
            return k==='pos' ? c.pos : k==='dis' ? c.dis : c[k]; });
          for(var i=0;i<all.length;i++){
            if(all[i] !== v && Math.abs(all[i] - v) <= 1) return;
          }
          kept.push(v);
          out.push({
            type:'back', m:m.id, src:m.title, stem:x.label, q:bm.lead,
            a: String(Math.round(v)) + ' animals', num: v, tol: 1, scn: x, cells: c,
            why: bm.why
          });
        });
      });
    });
  });
  BACK_CACHE = out;
  return out;
}
var CALC_TOL = 0.6;    // grading tolerance, in percentage points
var CALC_MIN_SEP = 3.0; // two measures closer than this are indistinguishable to the grader
var CALC_CACHE = null;
/* Within one scenario the six measures can land on top of each other — accuracy in
 * particular, since accuracy = p·Sn + (1−p)·Sp, so it converges on specificity as
 * prevalence falls. If two answers sit inside the grading tolerance the item is
 * unanswerable: a student who computed the *other* measure would also be marked
 * right. So a measure is only asked when it is at least CALC_MIN_SEP from every
 * measure already accepted for that scenario; MEASURES is ordered by priority, so
 * the less useful member of a colliding pair (usually accuracy) is the one dropped. */
function calcQuestions(){
  if(CALC_CACHE) return CALC_CACHE;
  var out = [];
  M.forEach(function(m){
    m.sections.forEach(function(sec){
      if(sec.type!=='calcset') return;
      sec.scenarios.forEach(function(x){
        // An asked measure must be distinguishable from every OTHER measure in the
        // drill vocabulary — including ones this scenario happens not to ask for,
        // since a student who computed the wrong one would otherwise be marked
        // right. Accuracy is deliberately not in this list: it is not part of the
        // drill, so it cannot be the wrong answer a student arrives at here.
        var allVals = MEASURES.map(function(mv){ return mv.calc(x) * 100; });
        MEASURES.forEach(function(mv, mi){
          if(mv.gate && !x[mv.gate]) return;
          var v = mv.calc(x) * 100;
          for(var i=0;i<allVals.length;i++){
            if(i !== mi && Math.abs(allVals[i] - v) < CALC_MIN_SEP) return;
          }
          out.push({
            type:'calc', m:m.id, src:m.title, stem:x.stem, q:mv.lead,
            a: v.toFixed(1) + '%', num: v, tol: CALC_TOL, scn: x, measure: mv.key,
            why: mv.why
          });
        });
      });
    });
  });
  CALC_CACHE = out;
  return out;
}
var TYPED_CACHE = null;
function typedQuestions(){
  if(TYPED_CACHE) return TYPED_CACHE;
  var out = [];
  M.forEach(function(m){
    m.sections.forEach(function(s){
      if(s.type!=='cloze') return;
      s.items.forEach(function(it){
        out.push({ type:'typed', m:m.id, src:m.title, stem:'', q:it.q,
                   a:it.a, accept:it.accept||[], why:it.why||'' });
      });
    });
  });
  TYPED_CACHE = out;
  return out;
}
function normAnswer(x){
  return String(x).toLowerCase()
    .replace(/[\u2012-\u2015\u2212]/g,'-')       // dash variants
    .replace(/[,]/g,'')
    .replace(/\bto\b/g,'-')                      // "22 to 24" -> "22-24"
    .replace(/\band\b/g,' ')
    .replace(/[^a-z0-9.\-\/:%]+/g,' ')
    .replace(/\s*-\s*/g,'-')
    .replace(/\s+/g,' ')
    .replace(/[.\s]+$/,'')
    .trim();
}
/* Calculation answers grade numerically: a percentage within tolerance, or the
 * same value written as a decimal fraction. */
function numericMatches(input, q){
  var t = String(input).replace(/[,\s%]/g,'');
  if(!t || !/^[0-9]*\.?[0-9]+$/.test(t)) return false;
  var v = parseFloat(t);
  if(isNaN(v)) return false;
  if(Math.abs(v - q.num) <= q.tol) return true;
  // percentages may also be written as a decimal fraction — 0.933 for 93.3%
  if(q.type !== 'back' && v <= 1 && Math.abs(v*100 - q.num) <= q.tol) return true;
  return false;
}
function answerMatches(input, q){
  if(q.type === 'calc' || q.type === 'back') return numericMatches(input, q);
  var got = normAnswer(input);
  if(!got) return false;
  var cands = [q.a].concat(q.accept||[]).map(normAnswer);
  if(cands.indexOf(got) >= 0) return true;
  // strip a trailing unit word the prompt already supplies ("60 mmhg" -> "60")
  var bare = got.replace(/\s*(mmhg|mg\/dl|meq\/l|mmol\/l|ml\/kg|mg\/ml|days?|hours?|hrs?|months?|weeks?|wks?|degrees?|f|%)$/,'').trim();
  if(bare && cands.indexOf(bare) >= 0) return true;
  // single numbers compare numerically, so "1.0" answers "1"
  var n = parseFloat(bare || got);
  if(!isNaN(n) && /^[0-9.]+$/.test((bare||got))){
    for(var i=0;i<cands.length;i++){
      if(/^[0-9.]+$/.test(cands[i]) && parseFloat(cands[i]) === n) return true;
    }
  }
  return false;
}
function bank(kind){
  if(kind==='case')  return caseQuestions();
  if(kind==='rapid') return rapidQuestions();
  if(kind==='typed') return typedQuestions();
  if(kind==='calc')  return calcQuestions().concat(backQuestions());
  return caseQuestions().concat(rapidQuestions()).concat(typedQuestions())
           .concat(calcQuestions()).concat(backQuestions());
}
function bankSize(){
  return caseQuestions().length + rapidQuestions().length + typedQuestions().length +
         calcQuestions().length + backQuestions().length;
}
function countQuestions(modId){
  var n = 0;
  bank('mixed').forEach(function(q){ if(q.m===modId) n++; });
  return n;
}
/* Scope options: everything, one group, or one chapter. */
function scopeMatches(q, scope){
  if(scope==='all') return true;
  if(scope.indexOf('g:')===0){ var m = byId(q.m); return !!m && m.group === scope.slice(2); }
  return q.m === scope;
}
function scopeLabel(scope){
  if(scope==='all') return 'the whole hub';
  if(scope.indexOf('g:')===0) return scope.slice(2);
  var m = byId(scope); return m ? m.title : scope;
}

      '<div class="startrow">'+

    (statLines().length ? '<div class="panel" style="margin-top:20px">'+

function startRun(){
  var c = state.cfg;
  var pool = shuffle(bank(c.kind).filter(function(q){ return scopeMatches(q, c.scope); }));
  var n = (c.len==='all') ? pool.length : Math.min(pool.length, c.len);
  state.run = {
    qs: pool.slice(0, n).map(function(q){
      return { q:q, choices: q.type==='typed' ? null : shuffle([q.a].concat(q.wrong)) };
    }),
    i:0, score:0, answered:false
  };
  state.view = 'practice';
  drawQuestion();
}

/* The scaffold for a back-calculation question: the givens, an empty 2 x 2 to

        key('C','fn','data-k="clear"')+key('⌫','fn','data-k="back"')+

        key('7','','data-k="d" data-v="7"')+key('8','','data-k="d" data-v="8"')+

}

function wireFillPad(x){
  var pad = document.getElementById('fillpad');
  if(!pad) return;

  /* ---- a plain four-function calculator ---- */
  var dispEl = document.getElementById('calcDisp'), subEl = document.getElementById('calcSub');
  var disp = '0', acc = null, pend = null, fresh = true;
  var tidy = function(v){
    if(!isFinite(v)) return 'Error';
    return String(Math.round(v * 1e6) / 1e6);
  };
  var draw = function(){
    dispEl.textContent = disp;
    subEl.textContent = (pend !== null && acc !== null) ? tidy(acc) + ' ' + pend : '';
  };
  var apply = function(a, b, op){
    return op === '+' ? a + b : op === '−' ? a - b : op === '×' ? a * b : (b === 0 ? NaN : a / b);
  };
  var actions = {
    d: function(v){
      if(fresh){ disp = (v === '.') ? '0.' : v; fresh = false; }
      else if(v === '.'){ if(disp.indexOf('.') < 0) disp += '.'; }
      else { disp = (disp === '0') ? v : disp + v; }
      draw();
    },
    op: function(v){
      var cur = parseFloat(disp);
      // chain: an operator after a completed entry evaluates what is pending first
      if(pend !== null && !fresh){ cur = apply(acc, cur, pend); disp = tidy(cur); }
      acc = cur; pend = v; fresh = true; draw();
    },
    eq: function(){
      if(pend === null) return;
      disp = tidy(apply(acc, parseFloat(disp), pend));
      acc = null; pend = null; fresh = true; draw();
    },
    clear: function(){ disp = '0'; acc = null; pend = null; fresh = true; draw(); },
    back: function(){
      if(fresh) return;
      disp = disp.length > 1 ? disp.slice(0, -1) : '0';
      if(disp === '' || disp === '-') disp = '0';
      draw();
    }
  };
  pad.querySelectorAll('.key').forEach(function(b){
    b.onclick = function(){ actions[b.dataset.k](b.dataset.v); };
  });
  pad.querySelectorAll('.chip[data-v]').forEach(function(c){
    c.onclick = function(){ disp = c.dataset.v; fresh = false; draw(); };
  });
  draw();

  /* ---- worksheet ---- */
  var get = function(k){
    var el = pad.querySelector('[data-w="'+k+'"]');
    var v = parseFloat(String(el.value).replace(/[,\s]/g,''));
    return isNaN(v) ? null : v;
  };
  var near = function(a, b){ return Math.abs(a - b) < 0.51; };
  var round = function(v){ return Math.round(v * 100) / 100; };

  function put(id, v, ok){
    var el = document.getElementById(id);
    el.textContent = (v === null) ? '—' : round(v);
    el.classList.toggle('ok', ok === true);
    el.classList.toggle('no', ok === false);
  }

  function refresh(){
    var dis=get('dis'), hea=get('hea'), tp=get('tp'), fp=get('fp'), fn=get('fn'), tn=get('tn');

    // row totals come from the cells
    put('wRow1', (tp!==null && fp!==null) ? tp+fp : null);
    put('wRow2', (fn!==null && tn!==null) ? fn+tn : null);

    // column totals mirror step 1 the moment it is filled, and turn green once the
    // two cells above them add up to it
    put('wCol1', dis, (dis!==null && tp!==null && fn!==null) ? near(tp+fn, dis) : undefined);
    put('wCol2', hea, (hea!==null && fp!==null && tn!==null) ? near(fp+tn, hea) : undefined);
    put('wAll', (dis!==null && hea!==null) ? dis+hea : null,
        (dis!==null && hea!==null) ? near(dis+hea, x.n) : undefined);

    var el = document.getElementById('wChecks');
    if(dis === null || hea === null){
      el.innerHTML = '<span class="chk">Fill in step 1 — the column totals follow from it.</span>';
      return;
    }
    var ok = near(dis+hea, x.n);
    el.innerHTML = '<span class="chk '+(ok?'ok':'no')+'">'+(ok?'✓ ':'✗ ')+
      round(dis)+' + '+round(hea)+' = '+round(dis+hea)+' vs population '+x.n+'</span>';
  }
  pad.querySelectorAll('[data-w]').forEach(function(i){ i.addEventListener('input', refresh); });
  refresh();
}

function wireSolvePad(x){
  var pad = document.getElementById('solvepad');
  if(!pad) return;
  var counts = [x.tp, x.fp, x.fn, x.tn];
  var picked = { num:[], den:[] };
  var slot = 'num';

  function sum(list){ return list.reduce(function(a,i){ return a + counts[i]; }, 0); }
  function paint(){
    pad.querySelectorAll('.pcell').forEach(function(b){
      var i = +b.dataset.cell;
      var inN = picked.num.indexOf(i) >= 0, inD = picked.den.indexOf(i) >= 0;
      b.classList.toggle('inN', inN && !inD);
      b.classList.toggle('inD', inD && !inN);
      b.classList.toggle('inB', inN && inD);
      b.querySelector('.tagrow').innerHTML =
        (inN?'<span class="tag n">NUM</span>':'') + (inD?'<span class="tag d">DEN</span>':'');
    });
    document.getElementById('padNum').textContent =
      picked.num.length ? sum(picked.num) : '—';
    document.getElementById('padDen').textContent =
      picked.den.length ? sum(picked.den) : '—';
    document.getElementById('padEq').textContent = '';
    document.getElementById('padSlotN').classList.toggle('primary', slot==='num');
    document.getElementById('padSlotD').classList.toggle('primary', slot==='den');
  }
  pad.querySelectorAll('.pcell').forEach(function(b){
    b.onclick = function(){
      var i = +b.dataset.cell, list = picked[slot], at = list.indexOf(i);
      if(at >= 0) list.splice(at, 1); else list.push(i);
      paint();
    };
  });
  document.getElementById('padSlotN').onclick = function(){ slot='num'; paint(); };
  document.getElementById('padSlotD').onclick = function(){ slot='den'; paint(); };
  document.getElementById('padClear').onclick = function(){
    picked = {num:[], den:[]}; slot='num'; paint(); };
  document.getElementById('padCompute').onclick = function(){
    if(!picked.num.length || !picked.den.length) return;
    var d = sum(picked.den);
    document.getElementById('padEq').textContent =
      d ? '= ' + (sum(picked.num)/d*100).toFixed(1) + '%' : '';
  };
  document.getElementById('padTotals').onchange = function(e){
    pad.querySelectorAll('.padtot').forEach(function(t){ t.hidden = !e.target.checked; });
  };
  paint();
}

function drawQuestion(){
  var run = state.run;
  if(!run) return practiceSetup();
  if(run.i >= run.qs.length) return runResults();
  var item = run.qs[run.i], q = item.q;
  var mod = byId(q.m);
  var pct = (run.i/run.qs.length*100).toFixed(1);
  var KEYS = ['A','B','C','D'];
  var isCalc = (q.type === 'calc'), isBack = (q.type === 'back');
  var typed = (q.type === 'typed' || isCalc || isBack);
  var label = isCalc ? 'Calculate' : isBack ? 'Back-calculate'
            : q.type==='typed' ? 'Type the answer'
            : q.type==='case' ? 'Case vignette' : 'Rapid recall';

  // A typed prompt shows its blank; a multiple-choice prompt does not have one.
  var prompt = typed
    ? fmt(q.q).replace(/_{2,}/, '<span style="display:inline-block;width:52px;border-bottom:2.5px solid var(--mod-accent,var(--accent));margin:0 4px"></span>')
    : fmt(q.q);

  content.innerHTML =
    '<div style="'+(mod?accentVars(mod.id):'')+'">'+
    '<div class="practicewrap">'+
      '<div class="qhead">'+
        '<span class="qtype">'+label+'</span>'+
        '<span class="qsrc" id="qsrc">'+(run.answered?esc(q.src):'')+'</span>'+
        '<span class="spacer" style="flex:1"></span>'+
        '<button class="btn tiny" id="quitBtn">End set</button>'+
      '</div>'+
      (q.stem ? '<div class="qstem">'+fmt(q.stem)+'</div>' : '')+
      '<div class="qprompt'+(q.stem?'':' solo')+'">'+prompt+'</div>'+
      (isCalc ? solvePad(q.scn) : isBack ? fillPad(q.scn) : '')+
      (typed
        ? '<div class="typebox">'+
            '<input id="typeIn" type="text" autocomplete="off" autocapitalize="off" '+
              'autocorrect="off" spellcheck="false" placeholder="Type your answer">'+
            '<button class="btn primary big" id="checkBtn">Check</button>'+
          '</div>'+
          '<div class="typehint">'+(isCalc
            ? 'Answer as a percentage — “90”, “90%” or “0.9” all count, to within 0.6 of a point.'
            : isBack ? 'Answer as a number of animals.'
            : 'Units and spacing do not matter — “22-24”, “22 to 24” and “22–24 mEq/L” all count.')+
          ' Enter to check.</div>'+
          '<div id="verdict"></div>'
        : '<div class="choices">'+item.choices.map(function(ch,i){
            return '<button class="choice" data-i="'+i+'"><span class="key">'+KEYS[i]+'</span>'+
              '<span>'+fmt(ch)+'</span></button>';
          }).join('')+'</div>')+
      '<div id="expl"></div>'+
      '<div class="studybar"><div class="progress"><div style="width:'+pct+'%"></div></div>'+
        '<span class="counter">'+(run.i+1)+' / '+run.qs.length+'</span>'+
        '<button class="btn primary" id="nextBtn">Next →</button></div>'+
      '<div class="score" id="scoreLine">Score '+run.score+' / '+run.i+'</div>'+
    '</div></div>';

  function reveal(right, extra){
    run.answered = true;
    if(right) run.score++;
    recordStat(q.m, right);
    document.getElementById('qsrc').textContent = q.src;
    document.getElementById('expl').innerHTML =
      '<div class="explain"><div class="et">'+(right?'Correct':'Why')+'</div>'+fmt(q.why||'')+
      '<div style="margin-top:9px">'+chapterLink(q.m)+'</div></div>';
    document.getElementById('scoreLine').textContent = 'Score '+run.score+' / '+(run.i+1);
    if(extra) extra();
    wireGoto();
  }

  if(isCalc){ wireSolvePad(q.scn); wireMatrix(); }
  if(isBack){ wireFillPad(q.scn); wireMatrix(); }
  if(typed){
    var input = document.getElementById('typeIn');
    var checkBtn = document.getElementById('checkBtn');
    input.focus();
    var check = function(){
      if(run.answered) return;
      var right = answerMatches(input.value, q);
      input.disabled = true;
      input.classList.add(right ? 'right' : 'wrong');
      checkBtn.disabled = true;
      document.getElementById('verdict').innerHTML =
        '<div class="verdict"><span class="vmark '+(right?'ok':'no')+'">'+
          (right?'Correct':'Not quite')+'</span>'+
        (right ? '<span class="truth">'+esc(q.a)+'</span>'
               : '<span class="truth">Answer: <b>'+esc(q.a)+'</b></span>'+
                 '<button class="btn tiny" id="overrideBtn">I had it right</button>')+
        '</div>';
      reveal(right);
      var ov = document.getElementById('overrideBtn');
      if(ov) ov.onclick = function(){
        // Credit the answer and unwind the miss the matcher recorded.
        run.score++;
        var st = state.stats[q.m]; if(st) st.right++;
        input.classList.remove('wrong'); input.classList.add('right');
        document.querySelector('.verdict .vmark').className = 'vmark ok';
        document.querySelector('.verdict .vmark').textContent = 'Counted correct';
        ov.remove();
        document.getElementById('scoreLine').textContent = 'Score '+run.score+' / '+(run.i+1);
      };
    };
    checkBtn.onclick = check;
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        if(run.answered) document.getElementById('nextBtn').click();
        else check();
      }
    });
  } else {
    var btns = content.querySelectorAll('.choice');
    btns.forEach(function(b){
      b.onclick = function(){
        if(run.answered) return;
        var picked = item.choices[+b.dataset.i];
        var right = (picked === q.a);
        reveal(right, function(){
          btns.forEach(function(x){
            x.disabled = true;
            if(item.choices[+x.dataset.i] === q.a) x.classList.add('right');
            else if(x === b) x.classList.add('wrong');
          });
        });
      };
    });
  }

  document.getElementById('nextBtn').onclick = function(){
    run.i++; run.answered = false; drawQuestion();
  };
  document.getElementById('quitBtn').onclick = function(){
    run.qs = run.qs.slice(0, run.i + (run.answered?1:0)); runResults();
  };
  window.scrollTo(0,0);
}

/* Session accuracy, kept in memory only — nothing is written to the browser. */
function recordStat(modId, right){
  var s = state.stats[modId] || (state.stats[modId] = {right:0, seen:0});
  s.seen++; if(right) s.right++;
}
function statLines(limit){
  var rows = Object.keys(state.stats).map(function(id){
    var s = state.stats[id], m = byId(id);
    return { id:id, title:m?m.title:id, pct:Math.round(s.right/s.seen*100), seen:s.seen };
  }).filter(function(r){ return r.seen >= 2; })
    .sort(function(a,b){ return a.pct-b.pct; });
  if(limit) rows = rows.slice(0, limit);
  return rows.map(function(r){
    var band = r.pct < 60 ? 'low' : r.pct < 80 ? 'mid' : 'high';
    return '<div class="weakrow">'+
      '<div class="weakname" data-stat="'+r.id+'">'+esc(r.title)+'</div>'+
      '<div class="meter '+band+'"><div style="width:'+r.pct+'%"></div></div>'+
      '<div class="weakpct">'+r.pct+'%</div></div>';
  });
}

/* ---------------- search ---------------- */
function collectText(m){
  var out = [];
  m.sections.forEach(function(s){
    if(s.title) out.push({t:s.title, ctx:s.title});
    if(s.body) out.push({t:s.body, ctx:s.title||m.title});
    (s.list||[]).forEach(function(x){ out.push({t:x, ctx:s.title||m.title}); });
    (s.items||[]).forEach(function(x){
      if(Array.isArray(x)) out.push({t:x[0]+' → '+x[1], ctx:s.title||m.title});
      else out.push({t:x, ctx:s.title||m.title});
    });
    (s.rows||[]).forEach(function(r){ out.push({t:r.join(' · '), ctx:s.title||m.title}); });
    (s.data||[]).forEach(function(d){ out.push({t:d[0]+' '+d[1]+'%', ctx:s.title||m.title}); });
  });
  return out;
}
function runSearch(q){
  var needle = q.toLowerCase(), hits = [];
  M.forEach(function(m){
    collectText(m).forEach(function(e){
      var i = e.t.toLowerCase().indexOf(needle);
      if(i>=0 && hits.length<80){
        var start = Math.max(0, i-70), snip = (start>0?'…':'')+e.t.slice(start, i+230)+(e.t.length>i+230?'…':'');
        hits.push({mod:m, ctx:e.ctx, snip:snip});
      }
    });
  });
  var html = '<div class="plate"><div class="eyebrow">Search</div><h1>'+hits.length+
    ' result'+(hits.length===1?'':'s')+'</h1><p class="tagline">for “'+esc(q)+'”</p></div><div style="margin-top:18px">';
  if(!hits.length){ html += '<p class="empty">Nothing matched. Try a buzzword, an agent name, or a drug.</p>'; }
  hits.forEach(function(h){
    var re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    html += '<button class="result" data-id="'+h.mod.id+'">'+
      '<div class="rmod">'+esc(h.mod.title)+' · '+esc(strip(h.ctx))+'</div>'+
      '<div class="rtxt">'+esc(strip(h.snip)).replace(re,'<mark>$1</mark>')+'</div></button>';
  });
  html += '</div>';
  content.innerHTML = html;
  content.querySelectorAll('.result').forEach(function(b){
    b.addEventListener('click', function(){ search.value=''; go('module', b.dataset.id); });
  });
  window.scrollTo(0,0);
}

/* ---------------- coverage map ---------------- */
function coverage(){
  var rows = M.filter(function(m){ return m.group==='Species' || m.covKey; }).map(function(m){
    var filled=0;
    m.sections.forEach(function(s){
      if(s.type==='table') filled += (s.rows||[]).length;
      else if(s.type==='rapidfire'||s.type==='list'||s.type==='cloze') filled += (s.items||[]).length;
      else filled += 1;
    });
    return {m:m, filled:filled};
  });
  // Modules sharing a covKey are chapters of one exam block (the ICVA weights the
  // species, not the body system) — merge them into a single row so the bar means
  // something. covTitle/covWeight describe the merged block.
  var merged = [], seen = {};
  rows.forEach(function(r){
    var k = r.m.covKey;
    if(!k){ merged.push(r); return; }
    if(!seen[k]){
      seen[k] = {m:{title:r.m.covTitle||r.m.title, weight:r.m.covWeight||r.m.weight,
                    weightNote:r.m.weightNote, id:r.m.id}, filled:0};
      merged.push(seen[k]);
    }
    seen[k].filled += r.filled;
  });
  rows = merged;
  var maxF = Math.max.apply(null, rows.map(function(r){return r.filled;}));
  var maxW = Math.max.apply(null, rows.map(function(r){return r.m.weight||0;})) || 1;
  var html = '<div class="plate"><div class="eyebrow">Study</div><h1>Coverage map</h1>'+
    '<p class="tagline">Exam weight against how much content this hub currently holds. '+
    'Where a bar is short and the weight is high, that is where the next source document should go.</p></div>'+
    '<div class="covgrid">';
  rows.sort(function(a,b){ return (b.m.weight||0)-(a.m.weight||0); }).forEach(function(r){
    var wPct = r.m.weight ? (r.m.weight/maxW*100).toFixed(1) : 0;
    var cPct = (r.filled/maxF*100).toFixed(1);
    html += '<div class="covrow"><div class="covname">'+esc(r.m.title)+
      '<small>'+(r.m.weight?r.m.weight+'% of exam':(r.m.weightNote||'weight n/a'))+'</small></div>'+
      '<div class="covbars">'+
      '<div class="covline"><span>Exam weight</span><div class="bar-track" style="height:10px">'+
        '<div class="bar-fill" style="height:10px;width:'+wPct+'%"></div></div>'+
        '<span>'+(r.m.weight||'—')+(r.m.weight?'%':'')+'</span></div>'+
      '<div class="covline"><span>Content here</span><div class="bar-track" style="height:10px">'+
        '<div class="bar-fill" style="height:10px;width:'+cPct+'%;opacity:.45"></div></div>'+
        '<span>'+r.filled+' items</span></div>'+
      '</div></div>';
  });
  html += '</div>'+footer();
  content.innerHTML = html;
  window.scrollTo(0,0);
}

        'Use <em>Open in new tab</em> or <em>Download</em> to read '+esc(d.title)+'. '+
        'If you are opening a copy of this file on its own, make sure the <code>docs/</code> '+
        'folder sits beside it.</div>'+
      '</object>'+
    '</div>'+footer();
  document.getElementById('backLib').onclick = function(){ go('docs'); };
  // The embedded viewer owns its own print UI, and cross-document print() is
  // blocked in most browsers — so open a tab and let the PDF viewer print it.
  document.getElementById('printDoc').onclick = function(){ window.open(url, '_blank'); };
  window.scrollTo(0,0);
}

/* ---------------- router ---------------- */
function go(view, id){
  state.view = view;
  if(view==='module'){ state.id = id; renderModule(id); }
  else if(view==='home'){ home(); }
  else if(view==='practice'){ state.run = null; practiceSetup(); }
  else if(view==='coverage'){ coverage(); }
  else if(view==='docs'){ docLibrary(); }
  else if(view==='doc'){ state.doc = id; docViewer(id); }
  markNav();
}

/* ---------------- chrome ---------------- */
var to;
search.addEventListener('input', function(){
  clearTimeout(to);
  to = setTimeout(function(){
    var q = search.value.trim();
    if(q.length < 2){
      if(state.view==='search') go(state.id ? 'module' : 'home', state.id);
      return;
    }
    state.view = 'search'; runSearch(q); markNav();
  }, 130);
});
document.getElementById('themeBtn').onclick = function(){
  var d = document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', d?'light':'dark');
  // Accents are resolved per theme, so repaint whatever is on screen.
  if(state.view==='practice' && state.run) drawQuestion();
  else if(state.view==='search') runSearch(search.value.trim());
  else go(state.view, state.view==='doc'?state.doc:state.id);
};
document.getElementById('homeBtn').onclick = function(){ go('home'); };
document.getElementById('practiceBtn').onclick = function(){ go('practice'); };
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('on'); }
document.getElementById('menuBtn').onclick = function(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('scrim').classList.toggle('on'); };
document.getElementById('scrim').onclick = closeSidebar;
document.addEventListener('keydown', function(e){
  if(document.activeElement === search) return;
  if(state.view==='practice' && state.run){
    if(document.activeElement && document.activeElement.id === 'typeIn') return;
    var keys = {a:0,b:1,c:2,d:3,1:0,2:1,3:2,4:3};
    var k = keys[e.key.toLowerCase()];
    if(k !== undefined){
      var btn = content.querySelectorAll('.choice')[k];
      if(btn && !btn.disabled){ e.preventDefault(); btn.click(); }
    }
    if(e.key==='Enter' || e.key===' '){
      var nx = document.getElementById('nextBtn');
      if(nx){ e.preventDefault(); nx.click(); }
    }
  }
  if(e.key==='/'){ e.preventDefault(); search.focus(); }
});

/* ---------------- init ---------------- */
if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
  document.documentElement.setAttribute('data-theme','dark');
}
buildNav();
go('home');
})();
</script>
</body>
</html>
